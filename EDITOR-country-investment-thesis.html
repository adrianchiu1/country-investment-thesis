<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country Investment Thesis</title>
<style>
  :root {
    --bg: #F3F5F7;
    --panel: #FFFFFF;
    --ink: #1B2430;
    --muted: #5B6673;
    --rule: #D8DEE5;
    --rule-soft: #E9EDF1;
    --accent: #2F5D8A;
    --accent-soft: #E4EDF6;
    --up: #1F7A5A;
    --up-soft: #DDF1E8;
    --down: #B23A2E;
    --down-soft: #F7DFDB;
    --edit: #B7791F;
    --edit-soft: #FBF1DC;
    --sig: #24706E;        /* signposts lens */
    --sig-soft: #DDF0EE;
    --band: #1F3A5F;
    --band-ink: #F3F5F7;
    --serif: Georgia, Cambria, "Times New Roman", serif;
    --font: "Segoe UI", "Segoe UI Variable Text", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
  }
  button { font: inherit; color: inherit; }
  textarea, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---------- top band: title + economy tabs ---------- */
  .band { background: var(--band); color: var(--band-ink); }
  .band-inner {
    max-width: 1440px; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: stretch; gap: 32px;
  }
  .brand {
    font-family: var(--serif); font-weight: 400; font-size: 18px; letter-spacing: 0;
    padding: 12px 0; white-space: nowrap; align-self: center;
  }
  /* Economies get their own row: seven of them plus the tools never fit on one line. */
  .band-tabs { max-width: 1440px; margin: 0 auto; padding: 0 24px; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; }
  .tab {
    background: none; border: 0; padding: 8px 14px 10px; cursor: pointer;
    color: #C7CFD8; border-bottom: 3px solid transparent; white-space: nowrap;
    font-size: 15px;
  }
  .tab:hover { color: #fff; }
  .tab[aria-selected="true"] { color: #fff; border-bottom-color: #F3F5F7; font-weight: 600; }
  .tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--edit); margin-left: 6px; vertical-align: middle; }
  .band-tools { margin-left: auto; align-self: center; display: flex; gap: 8px; align-items: center; }
  /* Three slots only: the folder state (which is also the control), who you are, and the rest. */
  .chip {
    background: transparent; border: 1px solid #4A6690; color: #C7CFD8; font: inherit; font-size: 12.5px;
    padding: 5px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap;
  }
  .chip:hover { border-color: #7FB2E5; color: #fff; }
  .chip.status.ok { border-color: #6FB59A; color: #C9EEDC; }
  .chip.status.ok::after { content: " \21BB"; opacity: 0.6; }
  .chip.status.warn { border-color: #D9A94E; color: #F6DFAC; }
  .chip.id { border-radius: 99px; font-weight: 600; min-width: 30px; text-align: center; }
  .chip.more { padding: 5px 9px; line-height: 1; letter-spacing: 1px; }
  .band-tools .menu-panel { color: var(--ink); }

  /* ---------- second row: section switcher + actions ---------- */
  .toolbar {
    background: var(--panel); border-bottom: 1px solid var(--rule);
    position: sticky; top: 0; z-index: 5;
  }
  .toolbar-inner {
    max-width: 1440px; margin: 0 auto; padding: 10px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: var(--panel); border: 0; padding: 7px 14px; cursor: pointer; color: var(--muted);
    border-right: 1px solid var(--rule);
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .seg button[aria-selected="true"][data-section="scenarios"] { background: var(--sig-soft); color: var(--sig); }
  .meta { color: var(--muted); font-size: 12.5px; }
  .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn {
    border: 1px solid var(--rule); background: var(--panel); padding: 7px 14px; border-radius: 6px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #26507A; color: #fff; }
  .btn.warn { background: var(--edit); border-color: var(--edit); color: #fff; }
  .btn.warn:hover { background: #9C6617; color: #fff; }
  .btn.quiet { border-color: transparent; color: var(--muted); }
  .btn.quiet:hover { border-color: var(--rule); color: var(--ink); }
  .btn.small { padding: 3px 9px; font-size: 12.5px; }
  .btn.danger:hover { border-color: var(--down); color: var(--down); }
  .btn:disabled, .btn:disabled:hover { opacity: 0.45; cursor: not-allowed; }
  /* Dropdown menu (the per-economy Workflow menu; reusable) */
  .menu { position: relative; display: inline-flex; }
  .menu > .btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  .caret { margin-left: 7px; font-size: 10px; opacity: 0.65; }
  .menu-panel {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 60; min-width: 216px;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
    box-shadow: 0 10px 28px rgba(16, 24, 40, 0.14); padding: 6px;
  }
  .menu-panel .menu-group {
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); padding: 7px 10px 4px;
  }
  .menu-panel button[role="menuitem"] {
    display: block; width: 100%; text-align: left; background: none; border: 0; font: inherit;
    padding: 7px 10px; border-radius: 5px; cursor: pointer; color: var(--ink);
  }
  .menu-panel button[role="menuitem"]:hover:not(:disabled),
  .menu-panel button[role="menuitem"]:focus-visible { background: var(--accent-soft); color: var(--accent); outline: none; }
  .menu-panel button[role="menuitem"]:disabled { opacity: 0.45; cursor: not-allowed; }
  .menu-sep { height: 1px; background: var(--rule); margin: 5px 4px; }

  body.editing .toolbar { border-bottom: 3px solid var(--edit); }
  .edit-banner {
    display: none; background: var(--edit-soft); color: #6E4A10; padding: 6px 24px; font-size: 12.5px;
    border-bottom: 1px solid #EBD9B4;
  }
  body.editing .edit-banner { display: block; }
  .edit-banner-inner { max-width: 1440px; margin: 0 auto; }

  /* ---------- main ---------- */
  main { max-width: 1440px; margin: 0 auto; padding: 20px 24px 80px; }
  .narrow { max-width: 980px; }
  .notice {
    background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--accent);
    padding: 14px 18px; border-radius: 6px; margin-bottom: 20px;
  }
  .notice.error { border-left-color: var(--down); }
  .notice.warn { border-left-color: var(--edit); }
  .notice h3 { margin: 0 0 4px; font-size: 15px; }
  .notice p { margin: 4px 0; }
  .notice ul { margin: 6px 0 0; padding-left: 20px; }

  /* ---------- import review ---------- */
  .review { max-width: 980px; }
  .review .note { background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--edit); border-radius: 6px; padding: 12px 16px; margin: 0 0 18px; white-space: pre-wrap; font-size: 13px; }
  .review .note h3 { margin: 0 0 6px; font-size: 14px; }
  .chg { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 12px; padding: 12px 16px; }
  .chg h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .chg h3 .where { color: var(--muted); font-weight: 400; }
  .kind { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 7px; border-radius: 10px; }
  .kind.edited { background: var(--edit-soft); color: #6E4A10; }
  .kind.added { background: var(--up-soft); color: var(--up); }
  .kind.retired { background: var(--down-soft); color: var(--down); }
  .chg .fld { margin: 8px 0 0; }
  .chg .fld .fname { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .dl { white-space: pre-wrap; padding: 2px 8px 2px 24px; text-indent: -16px; border-radius: 3px; font-size: 13px; line-height: 1.45; }
  .dl.add { background: var(--up-soft); }
  .dl.del { background: var(--down-soft); color: #7A2A20; }
  .dl.same { color: var(--muted); }
  .inline .old { background: var(--down-soft); color: #7A2A20; text-decoration: line-through; padding: 0 4px; border-radius: 3px; }
  .inline .new { background: var(--up-soft); padding: 0 4px; border-radius: 3px; }
  dialog textarea { width: 100%; min-height: 160px; border: 1px solid var(--rule); border-radius: 4px; padding: 7px 9px; font: 12px/1.4 ui-monospace, Consolas, monospace; }
  dialog .filerow { display: flex; align-items: center; gap: 10px; margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }

  /* ---------- drivers: nested folds ---------- */
  details { border-top: 1px solid var(--rule); }
  details.driver { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 14px; }
  details.driver > summary { font-family: var(--serif); font-size: 19px; font-weight: 400; padding: 12px 16px; }
  summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
    transform: rotate(-45deg); transition: transform 120ms; flex: none; margin: 0 4px 2px 0;
  }
  details[open] > summary::before { transform: rotate(45deg); margin-bottom: 4px; }
  summary .count { color: var(--muted); font-weight: 400; font-size: 12.5px; margin-left: 4px; }
  .tagline {
    font-family: var(--font); color: var(--muted); font-size: 13px; font-weight: 400;
    margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--rule);
  }
  tr.group .tagline { font-size: 12px; }
  @media (max-width: 680px) {
    details.driver > summary { flex-wrap: wrap; }
    summary .tagline { margin-left: 0; padding-left: 0; border-left: 0; flex-basis: 100%; }
  }
  summary .spacer { flex: 1; }

  .rich ul { margin: 4px 0; padding-left: 20px; }
  .rich li { margin: 2px 0; }
  .rich p { margin: 4px 0; }
  .rich strong { font-weight: 600; }

  /* ---------- edit widgets ---------- */
  .field { margin: 6px 0 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .field input[type=text], .field textarea {
    width: 100%; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 8px; background: #FFFDF8;
  }
  .field textarea { min-height: 72px; resize: vertical; line-height: 1.45; }
  .field input:focus, .field textarea:focus { border-color: var(--edit); outline: none; box-shadow: 0 0 0 2px var(--edit-soft); }
  .hint { font-size: 12px; color: var(--muted); }
  .row-actions { display: flex; gap: 8px; margin: 6px 0 10px; flex-wrap: wrap; }
  .invalid { border-color: var(--down) !important; background: #FFF6F4 !important; }

  /* ---------- signposts table (Scenarios & signposts page) ---------- */
  table.scen { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 6px; }
  table.scen th, table.scen td { border-top: 1px solid var(--rule-soft); padding: 10px 12px; vertical-align: top; text-align: left; }
  table.scen thead th { background: #F8FAFC; color: var(--muted); font-weight: 600; font-size: 12.5px; border-top: 0; }
  table.scen th.issue-col { width: 22%; }
  table.scen td.title { font-weight: 600; }
  table.scen td.title .n { color: var(--muted); font-weight: 400; margin-right: 6px; }
  table.scen td .field { margin: 0; }
  table.scen td textarea { min-height: 90px; }
  th.upside { color: var(--up); } th.downside { color: var(--down); }
  /* the two lenses on one card: same card, same tabs; the toggle at the end of the tab row switches page */
  .lens-toggle { margin-left: auto; align-self: center; display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
  .lens-toggle button { background: var(--panel); border: 0; padding: 4px 12px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .lens-toggle button[aria-selected="true"] { font-weight: 600; }
  .lens-toggle button[data-lens="issues"][aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
  .lens-toggle button[data-lens="signposts"][aria-selected="true"] { background: var(--sig-soft); color: var(--sig); }
  body[data-lens="signposts"] .stab[aria-selected="true"] { color: var(--sig); border-bottom-color: var(--sig); }
  body[data-lens="signposts"] .ol-btn.active { background: var(--sig-soft); color: var(--sig); }
  body[data-lens="signposts"] .ol-btn.l1.active { background: none; color: var(--sig); }
  tr.scen-row.hl td { background: var(--sig-soft); }
  table.scen td.title { font-weight: 600; }

  /* ---------- implications matrix ---------- */
  .matrix-wrap { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto; }
  table.matrix { border-collapse: collapse; width: 100%; min-width: 900px; }
  table.matrix th, table.matrix td { border-bottom: 1px solid var(--rule-soft); padding: 8px 10px; }
  table.matrix thead th { background: #F8FAFC; font-weight: 600; font-size: 12.5px; color: var(--muted); text-align: center; }
  table.matrix thead tr.groups th { border-bottom: 1px solid var(--rule); color: var(--ink); font-size: 13px; padding-top: 12px; }
  table.matrix thead th.rowhead { text-align: left; width: 300px; }
  table.matrix thead th.eq { border-left: 1px solid var(--rule); }
  table.matrix td.eq { border-left: 1px solid var(--rule-soft); }
  table.matrix tr.group td { background: #F8FAFC; font-weight: 600; cursor: pointer; padding: 10px; }
  table.matrix tr.group td::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg); margin: 0 10px 3px 2px; transition: transform 120ms;
  }
  table.matrix tr.group.closed td::before { transform: rotate(-45deg); margin-bottom: 1px; }
  table.matrix tr.leaf td.rowhead { padding-left: 30px; }
  table.matrix tr.leaf.hl td { background: var(--accent-soft); }
  table.matrix tr.leaf.hl td.rowhead { color: var(--accent); font-weight: 600; }
  table.matrix td.cell { text-align: center; width: 96px; font-size: 18px; line-height: 1; }
  button.cellbtn {
    width: 30px; height: 30px; border-radius: 50%; border: 1px dashed var(--rule); background: transparent; cursor: pointer;
    font-weight: 700; font-size: 16px; line-height: 1;
  }
  button.cellbtn:hover { border-color: var(--edit); }
  button.cellbtn.up { color: var(--up); background: var(--up-soft); border-style: solid; border-color: var(--up-soft); }
  button.cellbtn.down { color: var(--down); background: var(--down-soft); border-style: solid; border-color: var(--down-soft); }


  /* ---------- page layout: outline spine + content ---------- */
  .layout { display: grid; grid-template-columns: 260px minmax(0, 860px); gap: 36px; align-items: start; }
  .layout.wide { grid-template-columns: 260px minmax(0, 1fr); }
  .eco-head { margin: 0 0 18px; }
  .eco-head h1 { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  .eco-head p { margin: 4px 0 0; color: var(--muted); }
  .outline { position: sticky; top: 62px; max-height: calc(100vh - 80px); overflow-y: auto; padding-right: 6px; font-size: 13px; }
  .outline-tools { display: flex; gap: 12px; margin: 6px 0 12px 2px; }
  .outline-tools button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12.5px; }
  .outline-tools button:hover { text-decoration: underline; }
  .outline ol { list-style: none; margin: 0; padding: 0; }
  .outline ol ol { margin-left: 9px; padding-left: 13px; border-left: 1px solid var(--rule); }
  .outline li { margin: 0; }
  .ol-btn { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 4px 8px; border-radius: 4px; cursor: pointer; color: var(--muted); line-height: 1.35; }
  .ol-btn:hover { background: var(--panel); color: var(--ink); }
  .ol-btn.l1 { font-family: var(--serif); font-size: 15px; color: var(--ink); padding: 8px 8px 4px; }
  .ol-btn.l2 { font-weight: 600; color: var(--ink); }
  .ol-btn.l3 { padding-left: 8px; }
  .ol-btn .n { display: inline-block; min-width: 16px; color: #9AA5B1; }
  .ol-btn .cnt { color: #9AA5B1; font-weight: 400; margin-left: 4px; }
  .ol-btn.active { background: var(--accent-soft); color: var(--accent); }
  .ol-btn.l1.active { background: none; color: var(--accent); }
  details, tr.scen-row, tr.group, tr.leaf, .spanel { scroll-margin-top: 70px; }
  .demo-note { background: var(--edit-soft); border: 1px solid #EBD9B4; color: #6E4A10; padding: 8px 14px; border-radius: 6px; font-size: 12.5px; margin-bottom: 16px; }
  .demo-note a { color: inherit; }
  @media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } .outline { display: none; } }

  /* ---------- svg arrows ---------- */
  .arrow svg, .cellbtn svg { width: 16px; height: 16px; display: block; margin: 0 auto; }
  .arrow { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; }
  .arrow.up { color: var(--up); background: var(--up-soft); }
  .arrow.down { color: var(--down); background: var(--down-soft); }
  .arrow.none { color: #C4CCD5; }
  button.cellbtn { display: inline-flex; align-items: center; justify-content: center; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; color: var(--muted); font-size: 12.5px; margin: 12px 2px 0; }
  .legend span.item { display: inline-flex; align-items: center; gap: 8px; }
  .legend .arrow { width: 24px; height: 24px; }
  .legend .arrow svg { width: 13px; height: 13px; }


  /* ---------- subsection tabs inside a driver card ---------- */
  .stabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--rule); }
  .stab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 9px; margin-bottom: -1px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .stab:hover { color: var(--ink); }
  .stab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .stab .cnt { font-weight: 400; color: #9AA5B1; margin-left: 4px; }
  .stab.add { font-weight: 400; color: var(--edit); }
  .spanel { padding: 6px 16px 10px; scroll-margin-top: 70px; }
  .spanel[hidden] { display: none; }
  .spanel-head { display: flex; gap: 10px; align-items: center; margin: 8px 0 4px; }
  .spanel-head .field, .spanel-head .spacer { flex: 1; margin: 0; }
  details.issue { margin: 0; border-top: 1px solid var(--rule-soft); }
  details.issue:first-of-type { border-top: 0; }
  details.issue > summary { padding: 9px 0; font-weight: 600; }
  .issue-body { padding: 0 0 14px 19px; max-width: 76ch; }
  /* outline folding */
  .ol-row { display: flex; align-items: center; }
  .ol-row .ol-btn { flex: 1; }
  .ol-tog { flex: none; width: 18px; height: 22px; background: none; border: 0; padding: 0; cursor: pointer; color: #9AA5B1; display: flex; align-items: center; justify-content: center; }
  .ol-tog::before { content: ""; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); transition: transform 120ms; margin-bottom: 2px; }
  .ol-node.closed > .ol-row .ol-tog::before { transform: rotate(-45deg); margin-bottom: 0; }
  .ol-node.closed > ol { display: none; }
  .ol-tog.blank { visibility: hidden; }
  .outline ol ol { margin-left: 8px; padding-left: 8px; }

  /* ---------- CSS: dialogs ---------- */
  dialog { border: 1px solid var(--rule); border-radius: 8px; padding: 20px 22px; max-width: 520px; box-shadow: 0 12px 40px rgba(27,36,48,0.18); }
  dialog::backdrop { background: rgba(27,36,48,0.35); }
  dialog h3 { margin: 0 0 8px; }
  dialog p { margin: 6px 0; }
  dialog .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  dialog input[type=text] { width: 100%; border: 1px solid var(--rule); border-radius: 4px; padding: 7px 9px; }

  /* ---------- walkthrough ---------- */
  #tour { position: fixed; inset: 0; z-index: 39; }
  #tour[hidden] { display: none; }
  .tour-dim { position: absolute; inset: 0; }
  .tour-spot { position: absolute; z-index: 1; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(27,36,48,0.55); pointer-events: none; transition: top 120ms, left 120ms, width 120ms, height 120ms; }
  .tour-card { position: absolute; z-index: 2; width: 360px; max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 12px 40px rgba(27,36,48,0.25); padding: 14px 16px; }
  .tour-card .tour-step { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .tour-card h3 { margin: 4px 0 6px; font-size: 15px; }
  .tour-card .tour-body { font-size: 13px; }
  .tour-card .tour-body p { margin: 4px 0; }
  .tour-card .tour-body .btn { margin-top: 6px; }

<script>
/* ====================================================================
   Country Investment Thesis — single-file front-end
   Storage: YAML files in the folder that contains this HTML.
   Requires Edge/Chrome (File System Access API). Falls back to
   open-file / download when the API is unavailable.
   ==================================================================== */
'use strict';

/* ---------------- constants ---------------- */
const DEFAULT_ECONOMIES = [
  { id: 'united-states', name: 'United States' },
  { id: 'china', name: 'China' },
  { id: 'eurozone', name: 'Eurozone' },
  { id: 'japan', name: 'Japan' },
  { id: 'united-kingdom', name: 'United Kingdom' },
  { id: 'india', name: 'India' },
  { id: 'brazil', name: 'Brazil' },
];
/* Each group carries the question it exists to answer, shown beside its name on the
   Drivers and Signposts pages and on the implications matrix. A tagline may include
   {economy}, which is filled in with the selected economy ("the United States", "China");
   none currently do, since the page heading already says which economy this is.
   The ids are frozen: history, the log and the implications keys are all keyed on them,
   so a renamed group or subsection keeps the id it was created with. That is why the
   Politics group is still `geopolitics` and the Financial subsection still `credit`. */
const DRIVER_TEMPLATE = [
  { id: 'regime', name: 'Economic Regime',
    tagline: 'What shifts the growth-inflation regime?',
    subsections: [['trend-growth', 'Growth'], ['trend-inflation', 'Inflation']] },
  { id: 'policy', name: 'Policy',
    tagline: 'Are policies help or hindrance to returns?',
    subsections: [['monetary', 'Monetary'], ['fiscal', 'Fiscal'], ['reforms', 'Reforms']] },
  { id: 'imbalances', name: 'Imbalances',
    tagline: 'Where is stress building?',
    subsections: [['domestic', 'Domestic'], ['external', 'External'], ['credit', 'Financial']] },
  { id: 'geopolitics', name: 'Politics',
    tagline: 'Which political risks are not priced?',
    subsections: [['domestic', 'Domestic'], ['international', 'Geopolitics']] },
];
const SCENARIO_COLS = ['baseline', 'upside', 'downside'];
/* Where the old top-level scenario categories land when a legacy file is read (see normalise). */
const LEGACY_SCENARIO_HOME = { growth: ['regime', 'trend-growth'], inflation: ['regime', 'trend-inflation'], policy: ['policy', 'monetary'] };
const LEGACY_FISCAL = /fiscal|gilt|issuance|budget|deficit|debt/i;
const FACTORS = [
  { id: 'sales_growth', name: 'Sales growth', group: 'equity' },
  { id: 'margin_growth', name: 'Margin growth', group: 'equity' },
  { id: 'valuation', name: 'Valuation', group: 'equity' },
  { id: 'dividend_yield', name: 'Dividend yield', group: 'equity' },
  { id: 'cash_rate', name: 'Cash rate', group: 'bonds' },
  { id: 'inflation_expectation', name: 'Inflation expectation', group: 'bonds' },
  { id: 'term_premium', name: 'Term premium', group: 'bonds' },
  { id: 'liquidity', name: 'Liquidity', group: 'bonds' },
];
const ARROW = {
  up: '<svg viewBox="0 0 16 16" aria-label="up" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13.5V2.5M3.5 7l4.5-4.5L12.5 7"/></svg>',
  down: '<svg viewBox="0 0 16 16" aria-label="down" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v11M3.5 9l4.5 4.5L12.5 9"/></svg>',
  none: '<svg viewBox="0 0 16 16" aria-label="neutral" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/></svg>',
};
const CELL_CYCLE = { '': 'up', 'up': 'down', 'down': '' };
const LOCK_RENEW_MS = 5 * 60 * 1000;

/* ====================================================================
   Minimal YAML reader/writer.
   Supports the subset this tool writes: block mappings, block sequences,
   literal block scalars (| and |-), double-quoted strings (JSON escapes),
   single-quoted strings, plain scalars, null/true/false/numbers, [] and {}.
   Comments (# at line start) and blank lines are ignored outside literals.
   ==================================================================== */
const YAML = (() => {
  function parse(text) {
    const raw = text.replace(/\r\n?/g, '\n').split('\n');
    const lines = raw.map((s, i) => ({ raw: s, indent: s.search(/\S|$/), text: s.trim(), n: i }));
    const docs = [];
    let i = 0;
    while (i < lines.length) {
      // skip blanks / comments / separators
      while (i < lines.length && (lines[i].text === '' || lines[i].text.startsWith('#') || lines[i].text === '---')) i++;
      if (i >= lines.length) break;
      const [val, next] = parseBlock(lines, i, lines[i].indent);
      docs.push(val);
      i = next;
      while (i < lines.length && lines[i].text !== '---') i++; // anything left before a separator is ignored
    }
    return docs.length <= 1 ? (docs[0] === undefined ? null : docs[0]) : docs;
  }
  function isSkippable(l) { return l.text === '' || l.text.startsWith('#'); }
  // literal block header: | plus optional chomping (+/-) and indentation indicator (1-9), in either order
  function literalHeader(t) { const m = t.match(/^\|(?:([1-9])([+-])?|([+-])?([1-9])?)$/); return m ? { chomp: m[2] || m[3] || '', indent: +(m[1] || m[4] || 0) } : null; }
  function keyMatch(text) {
    // key: value  |  "quoted key": value
    const m = text.match(/^("(?:[^"\\]|\\.)*"|'(?:[^']|'')*'|[^:#\-\[\]{}"'][^:]*?):(?:\s+(.*)|$)/);
    if (!m) return null;
    return { key: scalar(m[1].trim()), rest: (m[2] || '').trim() };
  }
  function parseBlock(lines, i, indent) {
    const l = lines[i];
    if (l.text.startsWith('- ') || l.text === '-') return parseSeq(lines, i, indent);
    if (keyMatch(l.text)) return parseMap(lines, i, indent);
    // bare scalar block
    return [scalar(l.text), i + 1];
  }
  function parseMap(lines, i, indent) {
    const obj = {};
    while (i < lines.length) {
      const l = lines[i];
      if (isSkippable(l)) { i++; continue; }
      if (l.text === '---') break;
      if (l.indent < indent) break;
      if (l.indent > indent) throw new Error('YAML: unexpected indent at line ' + (l.n + 1));
      const km = keyMatch(l.text);
      if (!km) throw new Error('YAML: expected "key:" at line ' + (l.n + 1) + ': ' + l.text);
      const lit = literalHeader(km.rest);
      if (lit) {
        const [s, next] = parseLiteral(lines, i + 1, indent, lit);
        obj[km.key] = s; i = next;
      } else if (km.rest === '') {
        let j = i + 1;
        while (j < lines.length && isSkippable(lines[j])) j++;
        if (j < lines.length && lines[j].text !== '---' && (lines[j].indent > indent || (lines[j].indent === indent && lines[j].text.startsWith('- ')))) {
          const [v, next] = parseBlock(lines, j, lines[j].indent);
          obj[km.key] = v; i = next;
        } else { obj[km.key] = null; i = j; }
      } else {
        obj[km.key] = scalar(km.rest); i++;
      }
    }
    return [obj, i];
  }
  function parseSeq(lines, i, indent) {
    const arr = [];
    while (i < lines.length) {
      const l = lines[i];
      if (isSkippable(l)) { i++; continue; }
      if (l.text === '---') break;
      if (l.indent < indent) break;
      if (l.indent > indent) throw new Error('YAML: unexpected indent at line ' + (l.n + 1));
      if (!(l.text.startsWith('- ') || l.text === '-')) break;
      const rest = l.text.slice(1).trim();
      if (rest === '') {
        let j = i + 1;
        while (j < lines.length && isSkippable(lines[j])) j++;
        if (j < lines.length && lines[j].indent > indent) { const [v, next] = parseBlock(lines, j, lines[j].indent); arr.push(v); i = next; }
        else { arr.push(null); i = j; }
      } else if (literalHeader(rest)) {
        const [s, next] = parseLiteral(lines, i + 1, indent, literalHeader(rest)); arr.push(s); i = next;
      } else if (keyMatch(rest)) {
        // mapping whose first key sits on the dash line: re-indent that line and parse a map
        l.indent = l.raw.indexOf(rest); l.text = rest;
        const [v, next] = parseMap(lines, i, l.indent); arr.push(v); i = next;
      } else { arr.push(scalar(rest)); i++; }
    }
    return [arr, i];
  }
  function parseLiteral(lines, i, parentIndent, header) {
    const out = [];
    // explicit indentation indicator is relative to the parent node; otherwise the first non-blank line decides
    let blockIndent = header.indent ? parentIndent + header.indent : -1;
    while (i < lines.length) {
      const l = lines[i];
      if (l.text === '') { out.push(blockIndent >= 0 ? l.raw.slice(blockIndent) : ''); i++; continue; }
      if (blockIndent < 0) { if (l.indent <= parentIndent) break; blockIndent = l.indent; }
      if (l.indent < blockIndent) break;
      out.push(l.raw.slice(blockIndent)); i++;
    }
    let trailing = 0;
    while (out.length && out[out.length - 1] === '') { out.pop(); trailing++; }
    let s = out.join('\n');
    if (header.chomp === '+') s += '\n'.repeat(trailing + (out.length ? 1 : 0));
    else if (header.chomp === '' && out.length) s += '\n';
    return [s, i];
  }
  function scalar(t) {
    if (t === '' || t === '~' || t === 'null') return null;
    if (t === 'true') return true;
    if (t === 'false') return false;
    if (t === '[]') return [];
    if (t === '{}') return {};
    if (t[0] === '"') { try { return JSON.parse(t); } catch (e) { return t.slice(1, -1); } }
    if (t[0] === "'") return t.slice(1, -1).replace(/''/g, "'");
    if (/^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?$/.test(t)) return Number(t);
    return t;
  }

  /* ---- writer ---- */
  const PLAIN = /^[A-Za-z0-9_][A-Za-z0-9_\-\/. ,()%+]*$/;
  function needsQuote(s) {
    if (s === '' || !PLAIN.test(s) || s !== s.trim()) return true;
    if (/^(true|false|null|~|yes|no|on|off)$/i.test(s)) return true;
    if (/^[-+.]?\d/.test(s)) return true; // anything number-like (incl. hex, octal, dates, 1,000) so other YAML readers see a string too
    if (s.includes(': ') || s.includes(' #') || s.endsWith(':')) return true;
    return false;
  }
  /* Literal block scalar. Chomping keeps trailing newlines exactly; an explicit indentation
     indicator is written when the first line starts with whitespace, otherwise readers would
     take that whitespace as the block indent and fail on the following lines. */
  function literal(v, indent) {
    const pad = ' '.repeat(indent + 2);
    const body = v.replace(/\n+$/, ''), trailing = v.length - body.length;
    if (body === '' || trailing > 1) return JSON.stringify(v) + '\n'; // degenerate cases: a quoted string is unambiguous
    const header = '|' + (/^[ \t]/.test(body) ? '2' : '') + (trailing ? '' : '-');
    return header + '\n' + body.split('\n').map(l => l === '' ? '' : pad + l).join('\n') + '\n';
  }
  function str(s) { return needsQuote(s) ? JSON.stringify(s) : s; }
  function dump(v, indent = 0) { return dumpNode(v, indent, false).replace(/^\n/, '').replace(/\n+$/, '') + '\n'; }
  function dumpNode(v, indent, inSeq) {
    const pad = ' '.repeat(indent);
    if (v === null || v === undefined) return 'null\n';
    if (typeof v === 'boolean' || typeof v === 'number') return String(v) + '\n';
    if (typeof v === 'string') {
      if (v.includes('\n')) return literal(v, indent);
      return str(v) + '\n';
    }
    if (Array.isArray(v)) {
      if (v.length === 0) return '[]\n';
      let out = inSeq ? '' : '\n';
      for (const item of v) {
        if (item && typeof item === 'object' && !Array.isArray(item) && Object.keys(item).length) {
          const body = dumpMap(item, indent + 2);
          out += pad + '- ' + body.slice(indent + 2);
        } else if (Array.isArray(item) && item.length) {
          out += pad + '-' + dumpNode(item, indent + 2, false);
        } else {
          out += pad + '- ' + dumpNode(item, indent, true);
        }
      }
      return out;
    }
    if (typeof v === 'object') {
      if (Object.keys(v).length === 0) return '{}\n';
      return '\n' + dumpMap(v, indent);
    }
    return str(String(v)) + '\n';
  }
  function dumpMap(obj, indent) {
    const pad = ' '.repeat(indent);
    let out = '';
    for (const [k, v] of Object.entries(obj)) {
      const key = str(String(k));
      const isBlock = (v && typeof v === 'object' && (Array.isArray(v) ? v.length > 0 : Object.keys(v).length > 0)) || (typeof v === 'string' && v.includes('\n'));
      if (typeof v === 'string' && v.includes('\n')) out += pad + key + ': ' + dumpNode(v, indent, false);
      else if (isBlock) out += pad + key + ':' + dumpNode(v, indent + 2, false);
      else out += pad + key + ': ' + dumpNode(v, indent, false);
    }
    return out;
  }
  return { parse, dump };
})();

/* ====================================================================
   Word export. Builds a .docx (a zip of XML parts) in the page, with no
   library: CompressionStream does the deflate.
   Every issue is a table — a card — with a faint reference in its last
   row. Nothing is locked and nothing is hidden, so a person deletes, copies
   and moves cards the way they would in any Word document; the checking is
   done when the file comes back, and an import that cannot be trusted is
   refused with the card named rather than guessed at.
   Write only for now — reading an edited file back is a separate step.
   ==================================================================== */
const DOCX = (() => {
  const CRC = (() => { const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  const enc = new TextEncoder();
  const canDeflate = typeof CompressionStream === 'function';
  async function deflate(bytes) {
    const s = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  /* Minimal zip writer: one entry per part, deflated where the browser can. */
  async function zip(files) {
    const parts = [], central = []; let offset = 0;
    for (const f of files) {
      const data = enc.encode(f.text), crc = crc32(data);
      const body = canDeflate ? await deflate(data) : data, method = canDeflate ? 8 : 0;
      const nm = enc.encode(f.name);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, method, true); lh.setUint16(12, 0x2821, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, body.length, true); lh.setUint32(22, data.length, true);
      lh.setUint16(26, nm.length, true);
      parts.push(new Uint8Array(lh.buffer), nm, body);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true); ch.setUint16(10, method, true); ch.setUint16(14, 0x2821, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, body.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, nm.length, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), nm);
      offset += 30 + nm.length + body.length;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const eo = new DataView(new ArrayBuffer(22));
    eo.setUint32(0, 0x06054b50, true); eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
    eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true);
    const all = [...parts, ...central, new Uint8Array(eo.buffer)];
    const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0));
    let p = 0; for (const b of all) { out.set(b, p); p += b.length; }
    return out;
  }

  const X = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const WNS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const CELLS = ['baseline', 'upside', 'downside'];
  const NEW_REF = 'NEW';

  const runs = (text) => text === '' ? '' : String(text).split(/(\*\*[^*]+\*\*)/).filter(Boolean).map(seg => {
    const b = /^\*\*[^*]+\*\*$/.test(seg), t = b ? seg.slice(2, -2) : seg;
    return `<w:r>${b ? '<w:rPr><w:b/></w:rPr>' : ''}<w:t xml:space="preserve">${X(t)}</w:t></w:r>`;
  }).join('');
  const para = (style, text, extra = '') => `<w:p><w:pPr><w:pStyle w:val="${style}"/>${extra}</w:pPr>${runs(text)}</w:p>`;
  function bullets(text, style = 'CITBullet') {
    if (!text || !text.trim()) return para(style, '');
    return text.split('\n').map(line => {
      const m = line.match(/^(\s*)-\s+(.*)$/);
      if (!m) return para('CITBody', line.trim());
      const lvl = Math.min(Math.floor(m[1].length / 2), 1);
      return para(lvl ? 'CITBullet2' : style, m[2], `<w:numPr><w:ilvl w:val="${lvl}"/><w:numId w:val="1"/></w:numPr>`);
    }).join('');
  }

  /* ---- the card ------------------------------------------------------------
     One issue is one table. Nothing is locked and nothing is hidden: delete the
     card to retire the issue, copy it to add one, drag it to reorder. The only
     machine-readable thing is the reference in the last row, and if that is lost
     the importer says so rather than guessing. ------------------------------ */
  const GRID = [1450, 2517, 2517, 2516];                      // label + three signpost columns
  const cell = (w, body, opt = {}) =>
    `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${opt.span ? `<w:gridSpan w:val="${opt.span}"/>` : ''}`
    + `${opt.fill ? `<w:shd w:val="clear" w:color="auto" w:fill="${opt.fill}"/>` : ''}</w:tcPr>${body}</w:tc>`;
  const label = (text) => cell(GRID[0], para('CITLabel', text), { fill: 'F4F6F9' });
  const wide = (body) => cell(GRID[1] + GRID[2] + GRID[3], body, { span: 3 });

  function card(i, ref) {
    const hasCells = CELLS.some(k => (i[k] || '').trim());
    const row = (inner) => `<w:tr>${inner}</w:tr>`;
    return `<w:tbl><w:tblPr><w:tblStyle w:val="CITCard"/><w:tblW w:w="9000" w:type="dxa"/></w:tblPr>`
      + `<w:tblGrid>${GRID.map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`
      + row(label('Title') + wide(para('CITCardTitle', i.title || '')))
      + row(label('View') + wide(bullets(i.text)))
      + row(label('Signposts') + CELLS.map((k, n) => cell(GRID[n + 1], para('CITCellHead', k[0].toUpperCase() + k.slice(1)))).join(''))
      + row(label('') + CELLS.map((k, n) => cell(GRID[n + 1],
          hasCells || !i.__hint ? bullets(i[k] || '', 'CITBulletSm')
            : para('CITPlaceholder', 'leave empty if none'))).join(''))
      + row(cell(9000, para('CITRef', 'ref ' + ref), { span: 4 }))
      + `</w:tbl>` + para('CITGap', '');
  }

  const LOREM = {
    title: 'Lorem ipsum dolor sit amet, consectetur adipiscing',
    text: '- Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor\n- Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris\n- Duis aute irure dolor in reprehenderit in voluptate velit esse',

    + STYLE('CITTitle', 'CIT Title', '<w:pPr><w:spacing w:after="140"/></w:pPr><w:rPr><w:b/><w:sz w:val="40"/></w:rPr>')
    + STYLE('CITH1', 'CIT Heading 1', '<w:pPr><w:spacing w:before="0" w:after="160"/></w:pPr><w:rPr><w:b/><w:sz w:val="32"/><w:color w:val="1F3864"/></w:rPr>')

    + STYLE('CITCellHead', 'CIT Cell Head', '<w:rPr><w:b/><w:caps/><w:color w:val="7A8899"/><w:sz w:val="15"/></w:rPr>')
    + STYLE('CITRef', 'CIT Ref', '<w:pPr><w:jc w:val="right"/><w:spacing w:after="0"/></w:pPr><w:rPr><w:color w:val="B4BECB"/><w:sz w:val="14"/></w:rPr>')
    + STYLE('CITBullet', 'CIT Bullet', '<w:pPr><w:ind w:left="300" w:hanging="300"/><w:spacing w:after="50"/></w:pPr>')
    + STYLE('CITBulletSm', 'CIT Bullet Small', '<w:pPr><w:ind w:left="240" w:hanging="240"/><w:spacing w:after="50"/></w:pPr><w:rPr><w:sz w:val="18"/></w:rPr>')
    + STYLE('CITBullet2', 'CIT Bullet 2', '<w:pPr><w:ind w:left="640" w:hanging="300"/><w:spacing w:after="50"/></w:pPr>')
    + STYLE('CITBody', 'CIT Body', '')

    + STYLE('CITPlaceholder', 'CIT Placeholder', '<w:rPr><w:i/><w:color w:val="9AA6B4"/></w:rPr>')
    + STYLE('CITNoteHead', 'CIT Note Head', '<w:pPr><w:spacing w:after="80"/></w:pPr><w:rPr><w:b/><w:color w:val="1F4E79"/><w:sz w:val="22"/></w:rPr>')
    + STYLE('CITNote', 'CIT Note', '<w:pPr><w:spacing w:after="70"/></w:pPr><w:rPr><w:color w:val="33414F"/><w:sz w:val="19"/></w:rPr>')
    + `<w:style w:type="table" w:styleId="CITCard"><w:name w:val="CIT Card"/><w:tblPr><w:tblBorders>`
    + ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="D3DAE3"/>`).join('')
    + `</w:tblBorders><w:tblCellMar><w:top w:w="70" w:type="dxa"/><w:left w:w="110" w:type="dxa"/><w:bottom w:w="70" w:type="dxa"/><w:right w:w="110" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style>`

  const numberingXml = () => {

/* ====================================================================
   Storage: folder handle via File System Access API
   ==================================================================== */
const Store = (() => {
  let dir = null;
  let fallback = false;
  let writable = false;   // the folder is opened read-only; write permission is requested only when someone edits or imports
  const hasFS = typeof window.showDirectoryPicker === 'function';

  async function idb(op, val) {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('economy-views', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onerror = () => reject(req.error);
      req.onsuccess = () => {
        try {
          const tx = req.result.transaction('kv', 'readwrite');
          const st = tx.objectStore('kv');
          const r = op === 'get' ? st.get('dir') : st.put(val, 'dir');
          r.onsuccess = () => resolve(r.result);
          r.onerror = () => reject(r.error);
        } catch (e) { reject(e); } // e.g. a value that cannot be stored; never leave the caller hanging
      };
    });
  }
  async function reconnect() {
    if (!hasFS) return false;
    try {
      const h = await idb('get');
      if (!h) return false;
      if (await h.queryPermission({ mode: 'read' }) === 'granted') { dir = h; writable = await h.queryPermission({ mode: 'readwrite' }) === 'granted'; return true; }
      return 'prompt';
    } catch (e) { return false; }
  }
  async function requestSaved() {
    const h = await idb('get');
    if (!h) return false;
    const perm = await h.requestPermission({ mode: 'read' });
    if (perm === 'granted') { dir = h; writable = false; return true; }
    return false;
  }
  async function pick() {
    dir = await window.showDirectoryPicker({ mode: 'read' });
    writable = false;
    try { await idb('put', dir); } catch (e) { /* non-fatal */ }
    return true;
  }
  /* Ask the browser for write access to the connected folder (a second, explicit prompt). */
  async function ensureWrite() {
    if (!dir) return false;
    if (writable) return true;
    try { writable = (await dir.requestPermission({ mode: 'readwrite' })) === 'granted'; } catch (e) { writable = false; }
    return writable;
  }
  async function resolve(path, create) {
    const parts = path.split('/').filter(Boolean);
    let d = dir;
    for (let i = 0; i < parts.length - 1; i++) d = await d.getDirectoryHandle(parts[i], { create: !!create });
    return [d, parts[parts.length - 1]];
  }
  async function readText(path) {
    try {
      const [d, name] = await resolve(path, false);
      const fh = await d.getFileHandle(name);
      const f = await fh.getFile();
      return await f.text();
    } catch (e) {
      if (e && e.name === 'NotFoundError') return null;
      throw e;
    }
  }
  async function writeText(path, text) {
    const [d, name] = await resolve(path, true);
    const fh = await d.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(text);
    await w.close();
  }
  async function appendText(path, text) {
    const [d, name] = await resolve(path, true);
    const fh = await d.getFileHandle(name, { create: true });
    const f = await fh.getFile();
    const w = await fh.createWritable({ keepExistingData: true });
    await w.write({ type: 'write', position: f.size, data: text });
    await w.close();
  }
  async function remove(path) {
    try { const [d, name] = await resolve(path, false); await d.removeEntry(name); } catch (e) { /* already gone */ }
  }
  return {
    hasFS, reconnect, requestSaved, pick, ensureWrite, readText, writeText, appendText, remove,
    get connected() { return !!dir; },
    get writable() { return !!dir && writable; },
    get name() { return dir ? dir.name : ''; },
    get fallback() { return fallback; }, set fallback(v) { fallback = v; },
  };
})();
