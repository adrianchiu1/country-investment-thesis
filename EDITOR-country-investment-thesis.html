    tr.classList.toggle('closed');
    main.querySelectorAll(`tr.leaf[data-g="${tr.dataset.g}"]`).forEach(l => l.style.display = tr.classList.contains('closed') ? 'none' : '');
  }));
  main.querySelectorAll('.stab[data-s]').forEach(b => b.addEventListener('click', () => selectTab(+b.dataset.d, +b.dataset.s)));
  main.querySelectorAll('[data-lens]').forEach(b => b.addEventListener('click', () => {
    const card = b.closest('details.driver'); const di = card ? +card.id.slice(2) : null;
    const si = b.dataset.s != null ? +b.dataset.s : (card ? activeSub((S.draft || S.data[S.current]).drivers[di]) : null);
    switchLens(b.dataset.lens, di, si);
  }));
  if (!S.draft) { main.onclick = null; return; }
  const D = S.draft;
  main.querySelectorAll('[data-bind]').forEach(el => el.addEventListener('input', () => {
    const i = D.drivers[+el.dataset.d].subsections[+el.dataset.s].issues[+el.dataset.i];
    i[el.dataset.bind] = el.value;
    if (el.dataset.bind === 'title') { el.closest('details').querySelector('summary .t').textContent = el.value || 'Untitled'; const ol = main.querySelector(`.outline [data-jump="d-${el.dataset.d}-${el.dataset.s}-${el.dataset.i}"]`); if (ol) ol.textContent = el.value || 'Untitled'; }
    if (el.tagName === 'TEXTAREA') autoGrow(el);
  }));
  main.querySelectorAll('[data-pbind]').forEach(el => el.addEventListener('input', () => {
    D.drivers[+el.dataset.d].subsections[+el.dataset.s].issues[+el.dataset.i][el.dataset.pbind] = el.value;
    el.closest('tr').querySelectorAll('textarea').forEach(t => t.classList.remove('invalid'));
    autoGrow(el);
  }));
  main.querySelectorAll('[data-act="sub-name"]').forEach(el => el.addEventListener('input', () => {
    D.drivers[+el.dataset.d].subsections[+el.dataset.s].name = el.value;
    const lbl = main.querySelector(`.stab[data-d="${el.dataset.d}"][data-s="${el.dataset.s}"] .lbl`); if (lbl) lbl.textContent = el.value || 'Untitled';
  }));
  main.querySelectorAll('textarea').forEach(autoGrow);
  main.onclick = (e) => {
    // Controls that sit inside a <summary> must not fold/unfold the <details> they belong to.
    // (Do not stopPropagation on them: this delegated handler is what makes them work.)
    if (e.target.closest('summary') && e.target.closest('button')) e.preventDefault();
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const a = b.dataset.act, d = +b.dataset.d, s = +b.dataset.s, i = +b.dataset.i;
    if (a === 'add-issue') { D.drivers[d].subsections[s].issues.push({ id: uid('iss'), title: '', text: '', baseline: '', upside: '', downside: '' }); render(); focusLast('[data-bind="title"]'); }
    else if (a === 'del-issue') { confirmDlg('Remove this issue?', () => { D.drivers[d].subsections[s].issues.splice(i, 1); render(); }); }
    else if (a === 'move-issue') { const arr = D.drivers[d].subsections[s].issues, j = i + (+b.dataset.dir); if (j >= 0 && j < arr.length) { [arr[i], arr[j]] = [arr[j], arr[i]]; render(); } }
    else if (a === 'add-sub') { promptDlg('New subsection under ' + D.drivers[d].name, 'Subsection name', (name) => { const id = slug(name) + '-' + Math.random().toString(36).slice(2, 6); D.drivers[d].subsections.push({ id, name, issues: [] }); S.subTab[S.current + '/' + D.drivers[d].id] = id; render(); }); }
    else if (a === 'move-sub') { const arr = D.drivers[d].subsections, j = s + (+b.dataset.dir); if (j >= 0 && j < arr.length) { [arr[s], arr[j]] = [arr[j], arr[s]]; S.subTab[S.current + '/' + D.drivers[d].id] = arr[j].id; render(); } }
    else if (a === 'del-sub') { confirmDlg('Remove this subsection and all its issues?', () => { const sub = D.drivers[d].subsections.splice(s, 1)[0]; delete D.implications[`drivers/${D.drivers[d].id}/${sub.id}`]; delete S.subTab[S.current + '/' + D.drivers[d].id]; render(); }); }
    else if (a === 'cycle') {
      const key = b.dataset.key, f = b.dataset.f;
      const cur = (D.implications[key] || {})[f] || '';
      const nxt = CELL_CYCLE[cur];
      D.implications[key] = D.implications[key] || {};
      if (nxt) D.implications[key][f] = nxt; else delete D.implications[key][f];
      if (!Object.keys(D.implications[key]).length) delete D.implications[key];
      b.className = 'cellbtn ' + nxt; b.innerHTML = nxt ? ARROW[nxt] : '';
    }
  };
}
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.max(72, el.scrollHeight + 2) + 'px'; }
function focusLast(sel) { const els = $('main').querySelectorAll(sel); if (els.length) els[els.length - 1].focus(); }

/* ====================================================================
   Editing: lock, save, cancel
   ==================================================================== */
const lockPath = (id) => `locks/${id}.lock.yaml`;
async function readLock(id) {
  if (!Store.connected) return null;
  try { const t = await Store.readText(lockPath(id)); return t ? YAML.parse(t) : null; } catch (e) { return null; }
}
async function writeLock(id) {
  if (!Store.connected) return;
  const mins = Number(S.config.lock_minutes) || 30;
  const lock = { economy: id, by: S.author || 'unknown', since: S.lockSince || nowIso(), renewed: nowIso(), expires: new Date(Date.now() + mins * 60000).toISOString(), client: S.clientId };
  S.lockSince = lock.since;
  await Store.writeText(lockPath(id), YAML.dump(lock));
}
/* Name check + lock for the current economy; false if the user backed out. */
async function acquireLock() {
  if (!S.author && !(await askAuthor())) { toast('Set your name first so the change log can record it'); return false; }
  if (!canEditHere()) { toast(editorsHint()); render(); return false; }
  if (Store.connected && !(await Store.ensureWrite())) { toast('Editing needs permission to write to the folder; allow it when the browser asks, then try again'); return false; }
  if (Store.connected) statusConnected();
  const id = S.current;
  const lock = await readLock(id);
  if (lock && lock.client !== S.clientId && lock.expires && new Date(lock.expires) > new Date()) {
    if (S.author && lock.by === S.author) {
      toast(`Taking over your own lock from another window (since ${fmtTime(lock.since)})`);
    } else {
      const r = await dialog(`${S.data[id].name} is being edited`, `<p><strong>${esc(lock.by)}</strong> started editing at ${esc(fmtTime(lock.since))}. Their lock expires ${esc(fmtTime(lock.expires))} unless they save, cancel or keep the page open.</p><p>If this is you on another computer, or a window you closed while editing, take over. If it is someone else, taking over means both of you could save and the second save will be refused as a conflict.</p>`, [['Cancel', 'quiet'], ['Take over', 'primary']]);
      if (r !== 1) return false;
    }
  }
  S.clientId = S.clientId || uid('client');
  S.lockSince = null;
  try { await writeLock(id); } catch (e) { toast('Could not write the lock file: ' + e.message); }
  S.lockTimer = setInterval(() => writeLock(id).catch(() => {}), LOCK_RENEW_MS);
  return true;
}
async function startEdit() {
  if (!(await acquireLock())) return;
  S.draft = clone(S.data[S.current]);
  render();
}
async function releaseLock(id) {
  clearInterval(S.lockTimer); S.lockTimer = null; S.lockSince = null;
  if (Store.connected) await Store.remove(lockPath(id));
}
async function cancelDraft() {
  if (S.review) {
    if (await dialog('Discard this import?', '<p>Nothing has been written. You can import the same file again later.</p>', [['Keep reviewing', 'quiet'], ['Discard', 'primary']]) !== 1) return;
  } else {
    const dirty = JSON.stringify(S.draft) !== JSON.stringify(S.data[S.current]);
    if (dirty && await dialog('Discard your changes?', '', [['Keep editing', 'quiet'], ['Discard', 'primary']]) !== 1) return;
  }
  await releaseLock(S.current);
  S.draft = null; S.review = null; render();
}
function validate(D) {
  const problems = [];
  D.drivers.forEach((d, di) => d.subsections.forEach((s, si) => {
    if (!s.name.trim()) problems.push(`A subsection under ${d.name} has no name`);
    s.issues.forEach((i, ii) => {
      if (!i.title.trim()) problems.push(`${d.name} › ${s.name}: issue ${ii + 1} has no title`);
      // signposts are optional per issue, but once any cell is filled all three are required
      if (hasSignposts(i)) for (const k of SCENARIO_COLS) if (!(i[k] || '').trim()) { problems.push(`${d.name} › ${s.name} › ${i.title || 'issue ' + (ii + 1)}: ${k} is empty (baseline, upside and downside go together)`); markInvalid(di, si, ii, k); }
    });
  }));
  return problems;
}
function markInvalid(d, s, i, k) { const el = $('main').querySelector(`textarea[data-pbind="${k}"][data-d="${d}"][data-s="${s}"][data-i="${i}"]`); if (el) el.classList.add('invalid'); }

    <li>At the end Ada hands back the whole file, as a download where it can and always as a code block. Come back here, click <strong>Import</strong>, and either choose the downloaded <code>${esc(eco.id)}.yaml</code> or paste the code block. Never save it into the <code>data</code> folder.</li>

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* no */ } ta.remove(); return ok;
}

/* ====================================================================
   Import: a file handed back by Ada
   ==================================================================== */
async function startImport() {
  const id = S.current, ecoMeta = S.config.economies.find(e => e.id === id), cur = S.data[id];
  const p = dialog(`Import ${ecoMeta.name} from Ada`, `<p>Paste the YAML that Ada handed back, or choose the file you saved. The page shows every change for review before anything is written.</p>
    <div class="field"><textarea id="imp-text" spellcheck="false" placeholder="change_note: |-\n  ...\nid: ${esc(id)}\n..."></textarea></div>
    <div class="filerow"><input type="file" id="imp-file" accept=".yaml,.yml,.txt"></div>`, [['Cancel', 'quiet'], ['Review changes', 'primary']]);
  $('imp-file').addEventListener('change', async () => { const f = $('imp-file').files[0]; if (f) $('imp-text').value = await f.text(); });
  const text = $('imp-text');
  if (await p !== 1) return;
  const src = text.value;
  if (!src.trim()) { toast('Nothing to import'); return; }

  let raw;
  try { raw = YAML.parse(src); } catch (e) { dialog('The file could not be read', `<p>${esc(e.message)}</p><p>Ask Ada to return the whole file again as a single YAML block, with two-space indentation and every multi-line text as a <code>|-</code> block.</p>`, [['Close']]); return; }
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) { dialog('The file could not be read', '<p>This does not look like an economy file: expected <code>id:</code>, <code>drivers:</code> and <code>implications:</code> at the top level.</p>', [['Close']]); return; }
  if (raw.id && String(raw.id) !== id) {
    const other = S.config.economies.find(e => e.id === String(raw.id));
    dialog('Wrong economy', `<p>This file is for <strong>${esc(other ? other.name : raw.id)}</strong>, but <strong>${esc(ecoMeta.name)}</strong> is selected. Switch to that economy and import again.</p>`, [['Close']]); return;
  }
  const note = raw.change_note == null ? '' : (typeof raw.change_note === 'string' ? raw.change_note : YAML.dump(raw.change_note)).trim();
  delete raw.change_note;
  const warnings = [];
  if (raw.version != null && Number(raw.version) !== cur.version) warnings.push(`The file says it was derived from v${esc(raw.version)}, but ${esc(ecoMeta.name)} is now at v${cur.version}. The changes below include undoing whatever changed in between, so check them carefully.`);
  if (raw.implications && JSON.stringify(raw.implications) !== JSON.stringify(cur.implications)) warnings.push('The implications matrix in the file differs from the page and is ignored: arrows are only ever set by clicking in the page. Any suggestions in the change note are for you to apply after importing.');

  const imp = normalise(ecoMeta, raw);
  imp.implications = clone(cur.implications);
  // ids: keep what exists. A placeholder ("new-1"), blank or duplicate id takes the id of the
  // existing item with the same title in the same place (so importing a file twice does not
  // churn ids), otherwise a freshly minted one.
  const byTitle = {};
  for (const d of cur.drivers) for (const sub of d.subsections) for (const i of sub.issues) byTitle[`${d.id}/${sub.id}/${i.title.trim()}`] = i.id;
  const seen = new Set();
  const fix = (place, prefix) => (i) => {
    if (!i.id || /^new\b/i.test(i.id) || seen.has(i.id)) { const known = byTitle[`${place}/${String(i.title).trim()}`]; i.id = known && !seen.has(known) ? known : uid(prefix); }
    seen.add(i.id);
  };
  for (const d of imp.drivers) for (const sub of d.subsections) sub.issues.forEach(fix(`${d.id}/${sub.id}`, 'iss'));
  tidy(imp);
  const problems = validate(imp);
  if (problems.length) { dialog('The file is incomplete', '<p>Ask Ada to fix these and return the file again:</p><ul>' + problems.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>', [['Close']]); return; }
  const changes = diff(cur, imp);
  if (!changes.length) { toast('This file matches the current version; nothing to import'); return; }

  if (!(await acquireLock())) return;
  S.draft = imp;
  S.review = { note, warnings, changes };
  render();
  window.scrollTo(0, 0);
}

/* Review screen: every change grouped by the issue / signpost / subsection it belongs to. */
function renderReview(imp) {
  const R = S.review, cur = S.data[S.current];
  const names = {};
  const learn = (eco) => {
    for (const d of eco.drivers) { names[`drivers/${d.id}`] = d.name; for (const s of d.subsections) { names[`drivers/${d.id}/${s.id}`] = s.name; for (const i of s.issues) names[`drivers/${d.id}/${s.id}/${i.id}`] = i.title || 'Untitled'; } }
  };
  learn(cur); learn(imp); // the import's names win where both exist, so renamed items show their new title
  const groups = [];
  for (const ch of R.changes) {
    const parts = ch.path.split('/'), field = parts.pop(), key = parts.join('/');
    let g = groups.find(x => x.key === key); if (!g) { g = { key, parts, fields: [] }; groups.push(g); }
    g.fields.push({ field, old: ch.old, new: ch.new });
  }
  const fieldOrder = ['name', 'title', 'text', 'baseline', 'upside', 'downside', 'order'];
  const where = (parts) => parts.slice(1, -1).map((_, n) => names[parts.slice(0, n + 2).join('/')] || parts[n + 1]).join(' › ');
  const cards = groups.map(g => {
    const isItem = g.parts.length === 4;
    const kind = g.fields.every(f => f.old == null) && g.fields.some(f => f.field === 'title' || f.field === 'name') ? 'added'
      : g.fields.every(f => f.new == null) && g.fields.some(f => f.field === 'title' || f.field === 'name') ? 'retired' : 'edited';
    const label = names[g.key] || g.parts[g.parts.length - 1];
    const fields = g.fields.sort((a, b) => fieldOrder.indexOf(a.field) - fieldOrder.indexOf(b.field)).map(f => {
      if (f.field === 'order') return `<div class="fld"><div class="fname">Position</div><div class="inline">${f.old == null ? '' : `<span class="old">${esc(f.old)}</span> `}<span class="new">${esc(f.new == null ? 'removed' : f.new)}</span></div></div>`;
      if (f.field === 'title' || f.field === 'name') { if (kind !== 'edited') return ''; return `<div class="fld"><div class="fname">${f.field === 'name' ? 'Name' : 'Title'}</div><div class="inline"><span class="old">${esc(f.old)}</span> <span class="new">${esc(f.new)}</span></div></div>`; }
      const fname = { text: 'View', baseline: 'Baseline', upside: 'Upside', downside: 'Downside' }[f.field] || f.field;
      return `<div class="fld"><div class="fname">${esc(fname)}</div>${lineDiff(f.old || '', f.new || '')}</div>`;
    }).join('');
    const what = isItem ? 'issue' : 'subsection';
    return `<section class="chg"><h3><span class="kind ${kind}">${kind} ${what}</span>${esc(label)}<span class="where">${esc(where(g.parts))}</span></h3>${fields}</section>`;
  }).join('');
  const n = groups.length, f = R.changes.length;
  return `<div class="review">
    <header class="eco-head"><h1>${esc(cur.name)}: import review</h1><p>${n} item${n === 1 ? '' : 's'} changed (${f} field${f === 1 ? '' : 's'}) against v${cur.version}. Nothing is written until you click <strong>Apply import</strong>.</p></header>
    ${R.warnings.map(w => `<div class="notice warn"><p>${w}</p></div>`).join('')}
    ${R.note ? `<div class="note"><h3>Change note from Ada</h3>${esc(R.note)}</div>` : '<div class="notice warn"><p>The file carries no <code>change_note</code>. Ask Ada to include one next time so the log records who researched what, and why.</p></div>'}
    ${cards}
  </div>`;
}
/* Line-level diff (bullets are lines): unchanged lines muted, removed and added lines coloured. */
function lineDiff(a, b) {
  const A = a.split('\n'), B = b.split('\n');
  const m = A.length, n = B.length, L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < m && j < n) {
    if (A[i] === B[j]) { out.push(['same', A[i]]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { out.push(['del', A[i]]); i++; }
    else { out.push(['add', B[j]]); j++; }
  }
  while (i < m) out.push(['del', A[i++]]);
  while (j < n) out.push(['add', B[j++]]);
  return out.filter(([, t]) => t !== '' || out.length === 1).map(([k, t]) => `<div class="dl ${k}">${k === 'add' ? '+ ' : k === 'del' ? '− ' : '  '}${esc(t)}</div>`).join('');
}

/* Flatten an economy into path -> value, used for diffing */
function flatten(eco) {
  const m = {};
  for (const d of eco.drivers) d.subsections.forEach((s, sn) => {
    m[`drivers/${d.id}/${s.id}/name`] = s.name;
    m[`drivers/${d.id}/${s.id}/order`] = sn + 1;
    s.issues.forEach((i, n) => { const p = `drivers/${d.id}/${s.id}/${i.id}`; m[`${p}/title`] = i.title; m[`${p}/text`] = i.text; m[`${p}/order`] = n + 1; for (const k of SCENARIO_COLS) if ((i[k] || '').trim()) m[`${p}/${k}`] = i[k]; });
  });
  for (const [key, cells] of Object.entries(eco.implications || {})) for (const [f, v] of Object.entries(cells)) if (v) m[`implications/${key}/${f}`] = v;
  return m;
}
function diff(before, after) {
  const a = flatten(before), b = flatten(after), out = [];
  for (const k of new Set([...Object.keys(a), ...Object.keys(b)]).values()) {
    const ov = a[k] ?? null, nv = b[k] ?? null;
    if (JSON.stringify(ov) !== JSON.stringify(nv)) out.push({ path: k, old: ov, new: nv });
  }
  return out.sort((x, y) => x.path < y.path ? -1 : 1);
}
function tidy(D) {
  for (const d of D.drivers) for (const s of d.subsections) {
    s.name = s.name.trim();
    for (const i of s.issues) { i.title = i.title.trim(); i.text = i.text.replace(/\s+$/g, ''); for (const k of SCENARIO_COLS) { i[k] = (i[k] || '').replace(/\s+$/g, ''); if (!i[k]) delete i[k]; } }
  }
  const keys = new Set(rowKeys(D).map(r => r.key));
  for (const k of Object.keys(D.implications)) if (!keys.has(k)) delete D.implications[k];
}
async function saveDraft() {
  const id = S.current, D = S.draft;
  tidy(D);
  const problems = validate(D);
  if (problems.length) { dialog('Fix these before saving', '<ul>' + problems.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul>', [['Close']]); return; }
  const changes = diff(S.data[id], D);
  if (!changes.length) { toast('No changes to save'); await releaseLock(id); S.draft = null; S.review = null; render(); return; }

  // conflict check: re-read the file; any difference from what was loaded (a save by someone
  // else, a hand edit, a restored version) refuses the save, whatever the version number says
  if (Store.connected) {
    const onDisk = await Store.readText(`data/${id}.yaml`);
    if ((onDisk || '') !== S.loadedText[id]) {
      let v = null; try { v = YAML.parse(onDisk || ''); } catch (e) { /* ignore */ }
      const saved = v && typeof v === 'object' && Number(v.version) !== S.data[id].version;
      const what = saved
        ? `<p>The file on disk is now v${esc(v.version)} (saved ${esc(fmtTime(v.updated_at))} by ${esc(v.updated_by)}), but you started from v${S.data[id].version}.</p>`
        : `<p>The file on disk has been changed outside this page since you loaded it (edited by hand, restored, or re-synced), so saving would overwrite those changes.</p>`;
      dialog(saved ? 'Someone saved this economy while you were editing' : 'The data file changed while you were editing', what + `<p>Your changes were not written. Copy anything you need out of the page, then click <strong>Reload</strong> and re-apply your edits.</p>`, [['Close']]);
      return;
    }
  }
  const prev = S.data[id];
  D.version = (prev.version || 0) + 1;
  D.updated_at = nowIso();
  D.updated_by = S.author || 'unknown';
  const header = `# Country Investment Thesis — ${D.name}\n# Written by EDITOR-country-investment-thesis.html. Edit through the page so changes are logged.\n\n`;
  const dataText = header + YAML.dump({ id: D.id, name: D.name, version: D.version, updated_at: D.updated_at, updated_by: D.updated_by, drivers: D.drivers, implications: D.implications });
  const entry = { at: D.updated_at, by: D.updated_by, economy: id, version: D.version, from_version: prev.version || 0 };
  if (S.review) { entry.source = 'import'; if (S.review.note) entry.note = S.review.note; }
  entry.change_count = changes.length; entry.changes = changes;
  const logText = '---\n' + YAML.dump(entry);

  try {
    if (Store.connected) {
      await Store.writeText(`data/${id}.yaml`, dataText);
      await Store.appendText(`log/${id}.log.yaml`, logText);
    } else if (S.demo) {
      toast('Saved to this preview only — no folder is connected');
    } else {
      download(`${id}.yaml`, dataText);
      download(`${id}.log-entry-v${D.version}.yaml`, logText);
      toast('Downloaded the updated YAML and a log entry; copy them into data/ and log/');
    }
  } catch (e) { dialog('Save failed', '<p>' + esc(e.message || e) + '</p><p>Your edits are still on the page. Check the folder connection and try again.</p>', [['Close']]); return; }

  await releaseLock(id);
  const imported = !!S.review;
  S.data[id] = D; S.loadedText[id] = dataText; S.draft = null; S.review = null;
  render();
  toast(`${imported ? 'Imported' : 'Saved'} ${D.name} v${D.version} (${changes.length} change${changes.length === 1 ? '' : 's'})`);
}

/* ====================================================================
   Walkthrough: dims the page, spotlights one control at a time.
   Shown on the first visit, replayable with the Guide button.
   ==================================================================== */
function tourSteps() {
  const fs = Store.hasFS, connected = Store.connected;
  const steps = [
    { target: '#sections', title: 'One economy, three views', body: `<p>One hierarchy of drivers runs through all three. <strong>Drivers</strong> holds the view on each issue. <strong>Scenarios &amp; signposts</strong> shows the same issues with what we track for each: baseline, upside, downside. <strong>Investment implications</strong> maps the drivers onto equity and bond return building blocks.</p><p>Switch views here, or with the Views | Signposts toggle on any driver card; the tabs above switch economy.</p>` },
    connected
      ? { target: '#btn-folder', title: 'The folder chip', body: `<p>The page reads the YAML files in the synced folder${Store.writable ? ' and may write to them' : ', read-only for now: the browser asks for write access only when you click Edit or Import'}. <strong>Reload</strong> picks up other people's saves.</p>` }
      : fs
        ? { target: '#btn-folder', title: 'Connect the team folder', body: `<p>Click <strong>Connect folder</strong> and choose the synced folder that contains this page (the one with <code>config.yaml</code> and a <code>data</code> subfolder). The browser asks to <em>view</em> the folder, once per session; it asks separately for write access only when you click Edit or Import.</p><p>Until the folder is connected you are looking at built-in sample content.</p>`, action: { label: 'Connect folder now', run: connectFolder } }
        : { target: '#btn-folder', title: 'Open the YAML files', body: `<p>This browser cannot write to the folder. <strong>Open YAML files</strong> loads the files you pick; saving downloads updated files for you to copy into <code>data</code>. Edge or Chrome give the full experience.</p>`, action: { label: 'Open files now', run: connectFolder } },
    { target: '#btn-author', title: S.author ? `Saving as ${S.author}` : 'Set your name', body: `<p>Every save and import is recorded in the change log under this name. ${S.author ? 'Change it here if needed.' : 'Set it before you edit.'}</p>`, action: S.author ? null : { label: 'Set name now', run: askAuthor } },
    { target: '#tabs', title: 'Pick an economy', body: `<p>One file per economy. Two people can work on different economies at the same time; the same economy is locked while someone edits it.</p>` },
    { target: '#btn-edit', title: 'Edit the views', body: `<p><strong>Edit</strong> locks the economy for others and lets you change titles and bullets, add, remove or reorder issues and signposts, and click matrix cells. <strong>Save changes</strong> writes the file with a log entry; <strong>Cancel</strong> discards.</p>` },
    { target: '#btn-workflow', title: 'Work with Ada, or in Word', body: `<p><strong>Workflow</strong> holds everything that moves this economy in or out of the page.</p><p><strong>Get Ada prompt</strong> copies the prompt and the economy's file together; paste both into a new Ada conversation. Ada works in the mode you pick: Review Mode goes through the thesis three items at a time, Discuss Mode talks a topic through with you as a junior strategist, Incorporate Mode folds in the key points of a note you provide. Every change is approved by you, word for word, before Ada hands the whole file back. <strong>Import Ada YAML</strong> takes that file and shows every change for review, bullet by bullet, with Ada's note; nothing is written until you apply.</p><p><strong>Get .docx</strong> saves this economy as a Word document to read, circulate or mark up.</p>` },
    { target: '#btn-more', title: 'The rest', body: `<p><strong>Export snapshot</strong> writes a self-contained page with today's views baked in, for people who only need to read.</p><p>Replay this walkthrough any time with <strong>Guide</strong>.</p>` },
  ];
  return steps.filter(st => document.querySelector(st.target));
}
function startTour(i = 0) {
  if (SNAPSHOT_AT) return;
  if (S.draft) { toast('Finish or cancel your edits first, then click Guide'); return; }
  S.tour = { i };
  $('tour').hidden = false;
  window.addEventListener('resize', tourReposition);
  window.addEventListener('scroll', tourReposition, true);
  document.addEventListener('keydown', tourKeys);
  $('tour').querySelectorAll('[data-tour]').forEach(b => b.onclick = () => tourGo(b.dataset.tour));
  tourShow();
}
function tourShow() {
  const steps = tourSteps(), n = steps.length;
  if (!n) return endTour();
  const i = Math.min(S.tour.i, n - 1), st = steps[i];
  S.tour.i = i; S.tour.target = st.target;
  $('tour-step').textContent = `Step ${i + 1} of ${n}`;
  $('tour-title').textContent = st.title;
  $('tour-body').innerHTML = st.body + (st.action ? `<button type="button" class="btn small" id="tour-action">${esc(st.action.label)}</button>` : '');
  if (st.action) $('tour-action').onclick = async () => { try { await st.action.run(); } catch (e) { /* the page reports it */ } tourShow(); };
  const nx = $('tour').querySelector('[data-tour="next"]'), bk = $('tour').querySelector('[data-tour="back"]');
  nx.textContent = i === n - 1 ? 'Done' : 'Next';
  bk.disabled = i === 0;
  const el = document.querySelector(st.target);
  el.scrollIntoView({ block: 'nearest' });
  tourReposition();
  nx.focus();
}
function tourReposition() {
  if (!S.tour) return;
  const el = document.querySelector(S.tour.target); if (!el) return tourShow();
  const r = el.getBoundingClientRect(), pad = 6, spot = $('tour').querySelector('.tour-spot'), card = $('tour').querySelector('.tour-card');
  Object.assign(spot.style, { top: (r.top - pad) + 'px', left: (r.left - pad) + 'px', width: (r.width + 2 * pad) + 'px', height: (r.height + 2 * pad) + 'px' });
  const cw = card.offsetWidth, ch = card.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  let top = r.bottom + 14; if (top + ch > vh - 12) top = Math.max(12, r.top - ch - 14);
  let left = Math.min(Math.max(12, r.left), vw - cw - 12);
  Object.assign(card.style, { top: top + 'px', left: left + 'px' });
}
function tourGo(what) {
  if (what === 'skip') return endTour();
  if (what === 'back') { S.tour.i = Math.max(0, S.tour.i - 1); return tourShow(); }
  if (S.tour.i >= tourSteps().length - 1) return endTour();
  S.tour.i++; tourShow();
}
function tourKeys(e) {
  if (!S.tour || $('dlg').open) return;
  if (e.key === 'Escape') { e.preventDefault(); endTour(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); tourGo('next'); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); tourGo('back'); }
}
function endTour() {
  S.tour = null;
  $('tour').hidden = true;
  window.removeEventListener('resize', tourReposition);
  window.removeEventListener('scroll', tourReposition, true);
  document.removeEventListener('keydown', tourKeys);
  safeSet('tour-done', '1');
}

boot().then(() => { if (!SNAPSHOT_AT && !safeGet('tour-done')) startTour(); });
</script>
