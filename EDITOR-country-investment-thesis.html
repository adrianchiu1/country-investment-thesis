const DEMO_YAML = {"brazil":"# Country Investment Thesis — Brazil\n# Draft house view, September 2026. Edit through EDITOR-country-investment-thesis.html so changes are logged.\n\nid: brazil\nname: Brazil\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-br-tg1\n            title: Decelerating into the election on a 10% real rate\n            text: |-\n              - Growth has slowed from above 3% in 2023-24 toward about 1.9% in 2026; Q2 came in near flat as the lagged effect of a 15% Selic and tighter credit bit\n              - Potential growth is around 2% with a tight labour market; the cycle is being driven by monetary policy and fiscal transfers pulling in opposite directions\n            baseline: \"- Growth 1.5-2% in 2026 and 1.5% in 2027; unemployment low, consumption sustained by transfers, investment weak on high real rates\"\n            upside: \"- Market-friendly election outcome and credible fiscal plan; real rates fall fast, capex recovers, growth back toward 2.5-3% in 2027\"\n            downside: \"- Fiscal drift continues, the BRL sells off and Copom stops easing; growth below 1% with rising unemployment\"\n          - id: iss-br-tg2\n            title: Commodity terms of trade in a Gulf war\n            text: |-\n              - Brazil is a net oil exporter and a food and iron-ore exporter into a Chinese economy that is slowing; the 2026 oil shock is a net positive for the external accounts and Petrobras but a negative for inflation and the consumer\n              - Agricultural exports have benefited from China's redirection away from US suppliers\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-br-ti1\n            title: Inflation above the band despite record-high rates\n            text: |-\n              - IPCA expectations for 2026 sit near 5%, above the 4.5% ceiling of the 3% target band, and 2027 near 4.2%; core has slowed to just below the ceiling\n              - The problem is fiscal-monetary: expansionary fiscal policy (income-tax exemption, transfers, new federal hiring) plus a tight labour market keep services inflation sticky; the BRL is the transmission channel to headline\n            baseline: \"- IPCA near 5% in 2026 easing to about 4.2% in 2027; services inflation sticky, food and fuel volatile\"\n            upside: \"- BRL appreciation on a market-friendly outcome and easing food prices bring IPCA toward 3.5% in 2027\"\n            downside: \"- Fiscal loosening and a weaker real push IPCA back toward 6% and expectations de-anchor further\"\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-br-mo1\n            title: Copom easing cautiously from 15%\n            text: |-\n              - Selic at 14.00% after four consecutive 25bp cuts (unanimous in August), with the committee refusing to pre-commit to more while headline is above the band; the Focus survey sees 13.75% at year-end and 12% at end-2027\n              - Galípolo has established credibility (275bp of hikes in his first year, then a slow easing) under a government that wants faster cuts; the election is the test of whether the reaction function survives\n              - Watch: the September meeting, fiscal news that pushes rate expectations up rather than down, and any change to the BCB's inflation-target or governance framework after the election\n            baseline: \"- One more cut to 13.75% in 2026, then 12% by end-2027 as inflation edges back into the band; real rate stays near 8-9%\"\n            upside: \"- Post-election credibility allows cuts to 10-11% by end-2027; curve bull-flattens and the real rallies toward 4.8\"\n            downside: \"- Easing halted or reversed; questions over central-bank independence after the election; Selic back above 15%\"\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-br-fi1\n            title: The fiscal framework is bending in an election year\n            text: |-\n              - Gross debt near 82% of GDP and rising, nominal deficit near 8% of GDP with debt service around R$1tn; the primary target is being met on accounting rather than structural adjustment\n              - The 2026 election-year package (transfers, tax exemption up to R$5k, hiring) adds demand; the next government's first budget is what markets are pricing\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-br-do1\n            title: Household leverage at the top of the cycle\n            text: |-\n              - Household debt-service ratios are at record highs; the expansion of payroll-deducted credit to private-sector workers in 2025 pushed leverage further just as rates peaked\n              - Delinquencies are rising in unsecured credit; consumption is being sustained by transfers and a strong labour market rather than balance sheets\n      - id: external\n        name: External\n        issues:\n          - id: iss-br-ex1\n            title: Comfortable external accounts, volatile currency\n            text: |-\n              - Current-account deficit around 2-3% of GDP financed by FDI; reserves ample; the real has traded around 5.2-5.5 per dollar with a 10% real rate providing carry support\n              - The 25% US Section 301 tariff on Brazilian goods (after the IEEPA measures fell) is a nuisance more than a macro event; trade is redirected to China and Europe\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-br-cr1\n            title: Credit cycle turning at record-high rates\n            text: |-\n              - Bank credit growth has slowed to the mid-single digits in real terms; NPLs are rising from a low base in retail and small-business books\n              - Public banks (BNDES, Caixa) are again being used for directed credit, which blunts monetary transmission and adds fiscal risk\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-br-gd1\n            title: October election is the single biggest driver\n            text: |-\n              - Lula is running for re-election on the economy just as growth decelerates; polls show him competitive but the centre-right opposition is consolidating, and his age and health add tail risk\n              - A market-friendly outcome would compress real rates and spreads quickly; a Lula win with a weak Congress means more of the same fiscal drift and a slower easing cycle\n      - id: international\n        name: International\n        issues:\n          - id: iss-br-gi1\n            title: Between Washington and Beijing\n            text: |-\n              - The Lula-Trump relationship stabilised after the 2025 tariff episode; Brazil is a beneficiary of China's diversification away from US agriculture and of Gulf-shock oil prices\n              - Brazil's own tariffs on Chinese steel and autos show the backlash is global; Mercosur-EU implementation is the medium-term trade upside\nimplications:\n  drivers/regime/trend-growth:\n    sales_growth: down\n    cash_rate: down\n  drivers/regime/trend-inflation:\n    inflation_expectation: up\n    cash_rate: up\n    valuation: down\n  drivers/policy/monetary:\n    cash_rate: down\n    valuation: up\n    liquidity: up\n  drivers/policy/fiscal:\n    term_premium: up\n    inflation_expectation: up\n    valuation: down\n  drivers/imbalances/domestic:\n    sales_growth: down\n    margin_growth: down\n  drivers/imbalances/external:\n    sales_growth: up\n    term_premium: down\n  drivers/imbalances/credit:\n    liquidity: down\n    margin_growth: down\n  drivers/geopolitics/domestic:\n    valuation: down\n    term_premium: up\n  drivers/geopolitics/international:\n    sales_growth: up\n    dividend_yield: up\n","china":"# Country Investment Thesis — China\n# Draft house view, September 2026. Edit through EDITOR-country-investment-thesis.html so changes are logged.\n\nid: china\nname: China\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-cn-tg1\n            title: Growth without domestic demand\n            text: |-\n              - Headline growth is holding in the 4.5-5% range the 15th Five-Year Plan implies, but the composition is exports and state-directed manufacturing; private investment and property have been contracting since mid-2025\n              - The property adjustment is still running: existing-home prices down more than 20% from the 2021 peak, starts down about 70%, and rating agencies still expect further declines in 2026\n              - Our working assumption is trend growth drifting toward 4% by 2028, with the export surplus (above $1tn in 2025) the main support and the main source of friction\n          - id: iss-cn-tg2\n            title: The productivity bet on AI and advanced manufacturing\n            text: |-\n              - The Plan targets core digital industries above 12% of GDP and R&D growth above 7% a year; DeepSeek-style capability gains and EV and battery dominance are real, and TFP is contributing more than demographics subtract\n              - The failure mode is overcapacity: the anti-involution campaign against price wars has had limited traction, and margins in solar, EVs and steel remain compressed\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-cn-ti1\n            title: Ten quarters of near-zero inflation\n            text: |-\n              - CPI 0.8% in August with core at 1.0%; food prices falling for a fifth month and housing costs still negative; PPI has been in deflation for over three years\n              - The oil shock is passing through to transport prices but not to core; China is exporting disinflation to the rest of the world through goods prices\n              - Real rates remain too high for a deleveraging economy; this is the central policy failure and the reason nominal GDP growth lags real growth\n            baseline: \"- CPI 0.5-1% and PPI slightly negative through 2027; nominal growth stays below real growth\"\n            upside: \"- Anti-involution enforcement and demand support lift core inflation above 1.5%; PPI turns positive and corporate profits recover\"\n            downside: \"- Renewed property deflation and yuan strength push CPI below zero; debt-deflation dynamics and a Japan-1990s narrative take hold\"\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-cn-mo1\n            title: PBOC easing in small steps, preserving ammunition\n            text: |-\n              - One-year LPR at 3.0% after the April cut; the central bank has preferred RRR cuts, structural lending facilities and bond purchases to headline rate moves, and has been protective of bank margins and the currency\n              - With US-China relations in a truce and the Iran war raising import costs, the PBOC is holding firepower; expect 10-20bp of further cuts only if activity weakens visibly in Q4\n              - Watch: the 7-day reverse repo, net bond purchases, and any shift to explicit inflation-targeting language\n            baseline: \"- LPR cut to 2.8% by mid-2027, more RRR cuts and bond purchases; fiscal stays supply-side with incremental consumer measures\"\n            upside: \"- Beijing shifts to large direct household transfers and a housing inventory backstop after the 2027 Congress; the yuan strengthens on confidence\"\n            downside: \"- Policy stays reactive; capital outflow pressure forces a managed depreciation and tighter controls\"\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-cn-fi1\n            title: Fiscal is doing the work, but on the supply side\n            text: |-\n              - Augmented deficit near 8-9% of GDP; the local-government debt swap has removed near-term refinancing risk but not the incentive problem\n              - Consumer trade-in subsidies, childcare allowances and the consumption emphasis in the Plan are real but small relative to the household balance-sheet hit from property; policymakers are still reluctant to run demand-side transfers at scale\n              - Watch: the Q4 Politburo and the December Central Economic Work Conference for any move toward direct household support ahead of the 2027 Party Congress\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-cn-do1\n            title: Household balance sheets and the consumption gap\n            text: |-\n              - Property is 60-70% of household wealth and still falling; precautionary saving is elevated, youth unemployment near 17%, and consumption is running below income growth\n              - Retail sales respond to subsidies then fade; the structural fix (social security, hukou, income redistribution) is acknowledged in the Plan but not funded\n            baseline: \"- Prices keep falling at a slowing pace; starts flat at a low base; property subtracts 0.5-1pp from growth through 2027 and growth lands near 4.3-4.5%\"\n            upside: \"- Central-government inventory purchases and lower rates stabilise tier-1 and tier-2 prices by mid-2027; household confidence recovers and consumption growth exceeds 5%\"\n            downside: \"- A second leg down in prices, developer defaults spread to the state-linked sector, and local-government finances force spending cuts; growth below 3.5%\"\n      - id: external\n        name: External\n        issues:\n          - id: iss-cn-ex1\n            title: Record surplus, redirected away from the US\n            text: |-\n              - Exports to the US fell by double digits through 2025 while shipments to ASEAN, the EU and the Middle East surged; the surplus passed $1tn and is the source of a widening global backlash (EU, Brazil, India all adding measures)\n              - The yuan has been managed firm to keep the trade truce and to lean against capital outflows; a weaker currency is the tail policy option\n            baseline: \"- Export volumes keep growing mid-single digits with redirection to the Global South; the surplus stays near $1tn\"\n            upside: \"- A durable US deal plus EU market access keeps export growth high while domestic demand policy finally scales; nominal GDP growth back above 6%\"\n            downside: \"- Coordinated tariffs from the US, EU and major EMs cut export growth to zero; overcapacity turns into industrial bankruptcies and a localised financial event\"\n          - id: iss-cn-ex2\n            title: Energy import exposure\n            text: |-\n              - China is the largest importer through Hormuz; crude imports hit a decade low in June before recovering, and the shock has hit refining margins and the terms of trade\n              - Strategic stockpiles and Russian supply have cushioned the blow, and the episode strengthens the case for the EV and renewables push\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-cn-cr1\n            title: Credit demand is the problem, not supply\n            text: |-\n              - Credit growth is at multi-decade lows in real terms; households are repaying mortgages early and corporates are hoarding cash\n              - Bank asset quality is deteriorating slowly in property and small-business lending; state recapitalisation of the large banks has pre-empted a capital problem, smaller regional banks remain the weak link\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-cn-gd1\n            title: Run-up to the 21st Party Congress\n            text: |-\n              - Policy is being set with the 2027 Congress in view: stability, technological self-reliance and political control rank above consumption stimulus\n              - Provincial competition and local protectionism are named in the Plan as problems; execution risk on unification of the domestic market is high\n      - id: international\n        name: International\n        issues:\n          - id: iss-cn-gi1\n            title: The US truce and its edges\n            text: |-\n              - The Busan truce (October 2025) and Beijing summit (May 2026) have held: triple-digit tariffs were averted, China's rare-earth controls proved to be real leverage, and China now faces the same 12.5% Section 301 layer as other Asian exporters plus legacy 301 duties\n              - The edges are being tested: the US excess-capacity investigation, chip export controls, and Taiwan; either side can re-escalate quickly and the truce expires unless renewed\n          - id: iss-cn-gi2\n            title: Trade backlash beyond the US\n            text: \"- The EU, Brazil, India, Mexico and Turkey have all added tariffs or investigations on Chinese autos, steel and chemicals; the surplus redirection strategy is running into limits in 2026-27\"\nimplications:\n  drivers/regime/trend-growth:\n    sales_growth: down\n    margin_growth: down\n    cash_rate: down\n  drivers/regime/trend-inflation:\n    margin_growth: down\n    inflation_expectation: down\n    cash_rate: down\n  drivers/policy/monetary:\n    valuation: up\n    cash_rate: down\n    liquidity: up\n  drivers/policy/fiscal:\n    sales_growth: up\n    term_premium: up\n  drivers/imbalances/domestic:\n    sales_growth: down\n    valuation: down\n  drivers/imbalances/external:\n    margin_growth: down\n    inflation_expectation: down\n  drivers/imbalances/credit:\n    liquidity: down\n    cash_rate: down\n  drivers/geopolitics/domestic:\n    valuation: down\n  drivers/geopolitics/international:\n    sales_growth: down\n    margin_growth: down\n    valuation: down\n","eurozone":"# Country Investment Thesis — Eurozone\n# Draft house view, September 2026. Edit through EDITOR-country-investment-thesis.html so changes are logged.\n\nid: eurozone\nname: Eurozone\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-ez-tg1\n            title: German fiscal impulse against an energy headwind\n            text: |-\n              - Potential growth is still around 1%, but the German infrastructure and defence programme (deficit near 4.75% of GDP, the largest stimulus since the 1970s) is the first sustained upward force in a decade and is finally showing up in orders and construction\n              - Growth has surprised to the upside in 2026 (Q2 at 0.6% q/q, flattered by Ireland) and the ECB now projects 0.9% this year and 1.4% in 2027\n              - The offset is energy: the Gulf war re-opened the competitiveness gap with the US just as it had started to close, and energy-intensive industry is shedding capacity again\n            baseline: \"- Growth 1.0-1.4% in 2027 as German spending ramps and energy prices ease gradually; consumption recovers modestly\"\n            upside: \"- Hormuz normalises, the saving rate falls and German capex crowds in private investment; growth near 2% in 2027\"\n            downside: \"- Oil above $100 through 2027, French politics tighten financial conditions, Chinese competition intensifies; growth back toward 0.5%\"\n          - id: iss-ez-tg2\n            title: Productivity and the savings glut\n            text: |-\n              - Household saving rate remains several points above pre-2020 norms; the fiscal impulse is partly saved rather than spent, which caps the multiplier\n              - Capital-market union and pension reform (the Dutch transition, EU savings and investment agenda) are slow-moving but matter for whether the region's surplus is recycled at home\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-ez-ti1\n            title: Energy has reopened the inflation gap\n            text: |-\n              - Headline inflation is 3.3% (August) with energy up 14% y/y; excluding energy it is 2.2%, which is the number that will decide the cycle\n              - Staff projections put headline at 3.0% in 2026, 2.5% in 2027 and 2.1% in 2028; core is projected at 2.5-2.6% through 2027, so the ECB sees a longer road back to target than in March\n              - Second-round risk is lower than in 2022 because wage growth has already decelerated and the euro is firm, but negotiated wages for 2027 are the key check\n            baseline: \"- Headline averages 3.0% in 2026 and 2.5% in 2027; ex-energy inflation stays close to 2.2-2.5% and wage growth keeps decelerating\"\n            upside: \"- Energy relief brings headline below 2% by late 2027; the firm euro and Chinese goods prices push core toward 1.8%\"\n            downside: \"- Second-round effects in 2027 wage rounds keep core above 2.5%; the ECB has to hike beyond 3%\"\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-ez-mo1\n            title: ECB has hiked twice and calls it a war-inflation response\n            text: |-\n              - Deposit rate 2.50% after 25bp hikes in June and on 10 September, described as unanimous; the Council is explicit that the moves are about the energy shock and are robust across scenarios, not a new cycle\n              - Markets price more tightening than the ECB's own baseline needs; if energy falls, the front end has room to rally, which is the asymmetric trade\n              - Watch: the October 29 meeting, negotiated wage data, and whether Lagarde starts to distinguish between headline and ex-energy inflation more forcefully\n            baseline: \"- One more hike at most, then a hold through mid-2027; cuts resume once ex-energy inflation is clearly at 2%\"\n            upside: \"- Energy relief lets the ECB stop at 2.50% and cut back toward 2% in 2027; Bund curve bull-steepens\"\n            downside: \"- Deposit rate to 3.25% or higher; TPI activated if French spreads gap wider around the election\"\n          - id: iss-ez-mo2\n            title: Balance sheet and the fragmentation backstop\n            text: |-\n              - APP and PEPP run off passively; there is no Eurosystem bid for French paper, which is why the OAT spread now trades on fundamentals and politics\n              - TPI has not been needed, but its credibility is what keeps a French episode from becoming a euro-area episode\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-ez-fi1\n            title: Two-speed fiscal union\n            text: |-\n              - Germany is spending (record issuance above €500bn in 2026); France cannot consolidate (deficit 5.1%, debt 118% of GDP, another budget standoff over the 2027 finance law); Italy and Spain are the surprising fiscal good pupils\n              - Defence at 3-3.5% of GDP is the new common denominator and is debt-financed nearly everywhere; the revised EU rules are being interpreted flexibly\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-ez-do1\n            title: Precautionary saving and the labour market\n            text: |-\n              - Unemployment is near record lows and real incomes have been rising, yet consumption remains subdued; the energy shock has reset confidence just as it was recovering\n              - Upside if the stock of savings is drawn down once energy prices settle; the German programme provides the confidence trigger\n      - id: external\n        name: External\n        issues:\n          - id: iss-ez-ex1\n            title: Surplus recycling and the euro\n            text: |-\n              - Current account surplus near 3% of GDP and increasingly invested at home as US allocations are trimmed; the euro is firm around 1.16 despite the energy shock and has been a disinflationary force on goods\n              - The EU-US deal's 15% ceiling has removed the tariff tail risk; the larger medium-term threat is Chinese competition in autos, machinery and chemicals\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-ez-cr1\n            title: Banks are the transmission channel and are in good shape\n            text: |-\n              - Loan growth is modest but positive, banks are well capitalised and profitable on the steeper curve; higher policy rates pass through quickly to floating-rate mortgages in the south\n              - Commercial real estate remains the main pocket of stress, concentrated in Germany; no systemic read-through\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-ez-gd1\n            title: \"France is the euro area's sovereign risk\"\n            text: |-\n              - OAT-Bund spread near 85bp, 10-year OAT above 4.1% and the widest sustained premium since the euro crisis; the 2027 budget and the May 2027 presidential election are the catalysts, with Le Pen leading and markets doubting any candidate's appetite for consolidation\n              - Contagion has been limited because Italian fundamentals have improved; the risk is a rating cross-over that forces index-driven selling\n            baseline: \"- The 2027 budget passes with difficulty, deficit stays near 5%, spread 75-95bp; the presidential election dominates 1H27\"\n            upside: \"- A working fiscal majority passes a credible budget; spread compresses toward 60bp\"\n            downside: \"- Budget fails, rating cross-over to single-A, spread above 120bp and contagion to the periphery\"\n      - id: international\n        name: International\n        issues:\n          - id: iss-ez-gi1\n            title: Energy dependence in a Gulf war\n            text: |-\n              - Europe is the region most exposed to Hormuz: LNG and crude import bills are up sharply, and the fiscal cost of new energy relief measures is being added to already-stretched budgets\n              - Ukraine ceasefire scenarios still matter for gas prices and reconstruction demand; the defence build-up is now a permanent feature of the fiscal picture\nimplications:\n  drivers/regime/trend-growth:\n    sales_growth: up\n    cash_rate: up\n    term_premium: up\n  drivers/regime/trend-inflation:\n    margin_growth: down\n    inflation_expectation: up\n    cash_rate: up\n  drivers/policy/monetary:\n    valuation: down\n    cash_rate: up\n    liquidity: down\n  drivers/policy/fiscal:\n    sales_growth: up\n    term_premium: up\n  drivers/imbalances/domestic:\n    sales_growth: down\n    dividend_yield: up\n  drivers/imbalances/external:\n    valuation: up\n    term_premium: down\n    inflation_expectation: down\n  drivers/imbalances/credit:\n    margin_growth: up\n    liquidity: up\n  drivers/geopolitics/domestic:\n    term_premium: up\n    valuation: down\n  drivers/geopolitics/international:\n    margin_growth: down\n    sales_growth: down\n    inflation_expectation: up\n","india":"# Country Investment Thesis — India\n# Draft house view, September 2026. Edit through EDITOR-country-investment-thesis.html so changes are logged.\n\nid: india\nname: India\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-in-tg1\n            title: The fastest large economy, now stress-tested by oil\n            text: |-\n              - Growth ran near 7-8% through FY26 on public capex, the GST rate cut and a consumption rebound; the RBI has FY27 at 6.7% and Q1 manufacturing and discretionary spending were strong\n              - India is the large economy most exposed to Hormuz after Japan: Gulf crude, LNG, and remittances and diaspora employment in the GCC; the shock arrived just as the private capex cycle was turning up\n              - Our assumption: trend growth 6.5% with two-sided risk; the productivity story (digital public infrastructure, formalisation, manufacturing incentives) is intact but the external account is the constraint again\n            baseline: \"- FY27 growth 6.5% as public capex and the consumption tax cut offset the energy drag; private capex continues at a moderate pace\"\n            upside: \"- Hormuz normalises, oil back below $75; consumption and private capex lift growth above 7% with the current account back near 1% of GDP\"\n            downside: \"- Oil above $100 through 2027; current-account deficit above 2.5%, rupee overshoots, RBI forced to hike and growth falls below 5.5%\"\n          - id: iss-in-tg2\n            title: Private capex and the manufacturing push\n            text: |-\n              - Corporate balance sheets are clean and capacity utilisation high; the interim US trade agreement (in force since February) has reopened the export channel after the punitive 2025 tariffs\n              - Electronics assembly and pharma are scaling; the constraint is land, logistics and state-level execution rather than demand\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-in-ti1\n            title: From record-low inflation to an energy shock\n            text: |-\n              - Headline inflation fell to 1-2% in late 2025 on food; the RBI now projects 5.0% for FY27 with core near 4.3%, so the whole move is fuel and pass-through\n              - Food remains the swing factor: monsoon outcomes and vegetable prices dominate the headline, and the RBI is learning to look through them\n            baseline: \"- Headline 4.5-5% in FY27, core 4-4.5%; food benign on a normal monsoon\"\n            upside: \"- Energy relief and a strong monsoon bring headline back to 3.5-4%; the RBI can resume cutting\"\n            downside: \"- Fuel pass-through plus a weak monsoon push headline above 6% and core above 5%; expectations rise and the RBI hikes 50-75bp\"\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-in-mo1\n            title: RBI on hold at 5.25%, defending the rupee with the wider toolkit\n            text: |-\n              - After 125bp of cuts in 2025 the RBI has held at 5.25% with a neutral stance through 2026; the August vote was unanimous and Governor Malhotra wants a clearer inflation signal before moving either way\n              - The rupee has weakened beyond 95 per dollar and the RBI has chosen FX swaps, reserve sales and liquidity tools over a defensive hike; that is the right call as long as inflation expectations hold\n              - Watch: core inflation above 4.5%, further rupee depreciation, and the liquidity stance (OMOs and swaps) which is doing more work than the policy rate\n            baseline: \"- On hold through FY27 with liquidity and FX tools doing the work; rupee drifts to 96-98\"\n            upside: \"- Two cuts to 4.75% in 2027 as inflation returns to 4% and the current account narrows; rupee stabilises below 95\"\n            downside: \"- Defensive hikes to 6% to stop a rupee run; growth and credit slow sharply\"\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-in-fi1\n            title: Consolidation on a debt anchor, with an oil bill\n            text: |-\n              - The centre has shifted from a deficit target to a debt-to-GDP anchor; FY27 budget keeps capex high and the deficit near 4.3-4.5% of GDP\n              - Fuel subsidies and excise cuts to cushion the oil shock are the fiscal risk; states are the softer link on revenue and welfare spending\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-in-do1\n            title: Household credit and the K-shaped consumer\n            text: |-\n              - Urban middle-class consumption is running on credit (unsecured personal loans, cards) while rural demand has recovered on good monsoons and food-price relief\n              - The GST cut lifted mass consumption in 2H25; the oil shock is now eroding real incomes at the bottom\n      - id: external\n        name: External\n        issues:\n          - id: iss-in-ex1\n            title: The current account is the pressure point again\n            text: |-\n              - Oil at $90-100 pushes the current-account deficit toward 1.5-2% of GDP; services exports and remittances remain strong but portfolio flows have been volatile and FDI net of repatriation is weak\n              - Reserves are ample but the RBI has spent them; the rupee's depreciation is orderly so far, which is the objective\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-in-cr1\n            title: Banks are healthy, NBFCs and unsecured retail are the watch item\n            text: |-\n              - Bank NPAs are at multi-decade lows and capital is strong; the RBI tightened risk weights on unsecured retail and NBFC lending in 2024-25 and asset quality in small-ticket loans is deteriorating at the margin\n              - Credit growth has slowed to the low teens, which is healthy; deposit growth is the constraint on banks\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-in-gd1\n            title: Reform momentum with state-election noise\n            text: \"- The GST overhaul, labour codes and the new income-tax framework show the coalition can still legislate; the 2026-27 state election cycle (including large states) will bring welfare spending and pauses in reform\"\n      - id: international\n        name: International\n        issues:\n          - id: iss-in-gi1\n            title: Managing the US, Russia and the Gulf at once\n            text: |-\n              - The interim trade agreement with the US removed the 2025 tariff penalty tied to Russian oil purchases; India now sits at the standard Section 301 rate and keeps buying discounted Russian crude, which has been a buffer in the Gulf shock\n              - The Gulf war is a direct security and energy issue (shipping, diaspora, Chabahar); relations with China have thawed at the margin, and border stability is being bought with trade openness\nimplications:\n  drivers/regime/trend-growth:\n    sales_growth: up\n    margin_growth: down\n    cash_rate: up\n  drivers/regime/trend-inflation:\n    inflation_expectation: up\n    cash_rate: up\n  drivers/policy/monetary:\n    cash_rate: up\n    liquidity: down\n    valuation: down\n  drivers/policy/fiscal:\n    sales_growth: up\n    term_premium: up\n  drivers/imbalances/domestic:\n    sales_growth: up\n    margin_growth: down\n  drivers/imbalances/external:\n    valuation: down\n    term_premium: up\n    inflation_expectation: up\n  drivers/imbalances/credit:\n    liquidity: down\n  drivers/geopolitics/domestic:\n    sales_growth: up\n    valuation: up\n  drivers/geopolitics/international:\n    margin_growth: down\n    inflation_expectation: up\n","japan":"# Country Investment Thesis — Japan\n# Draft house view, September 2026. Edit through EDITOR-country-investment-thesis.html so changes are logged.\n\nid: japan\nname: Japan\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-jp-tg1\n            title: Reflation is real but the growth rate is not\n            text: |-\n              - Potential growth is still near 0.5%; what has changed is nominal: wages, prices and corporate pricing power have all moved, and corporate profits have stayed high through the tariff and energy shocks\n              - The Takaichi programme (economic security, defence above 2% of GDP, disaster resilience, a 17-field growth strategy) is a fiscal push rather than a supply-side reform; the multiplier is low in a full-employment economy\n              - Labour scarcity is the binding constraint; capex in automation and software is the one genuinely structural upside\n          - id: iss-jp-tg2\n            title: Corporate governance and capital return\n            text: \"- Cross-shareholding unwinds, buybacks and activist pressure keep ROE rising; this is the equity story regardless of macro and is now in its fourth year\"\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-jp-ti1\n            title: The wage-price mechanism has held, now stress-tested by oil\n            text: |-\n              - Shunto outcomes have delivered a third year of strong base-pay rises; services inflation and rent are finally moving, which is the domestic anchor the BOJ wanted\n              - The Gulf war pushed headline inflation up through energy and food, exactly the import-driven inflation that squeezed real incomes in 2022-23; the yen's September rally is the offset\n              - We assume underlying inflation settles around 2% with two-sided risk, which is a regime change from the 2010s\n            baseline: \"- Core inflation settles near 2% through 2027; the 2027 shunto delivers base-pay growth of 3% or more\"\n            upside: \"- Services inflation and rents keep rising; underlying inflation runs 2.5% and the BOJ's terminal rate estimate moves up\"\n            downside: \"- Yen strength and an energy reversal drag headline below 1.5%; the wage-price mechanism stalls and the BOJ pauses indefinitely\"\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-jp-mo1\n            title: BOJ normalisation is proceeding, with political friction\n            text: |-\n              - Policy rate raised to 1.00% in June and widely expected to reach 1.25% at the September meeting, a 30-year high; the stated logic is upside inflation risk from oil and the weak yen\n              - The BOJ has said it will stop tapering JGB purchases from April 2027, holding monthly buying steady; the balance sheet is nonetheless down about 15% from its peak, the largest QT any G7 central bank has run\n              - Takaichi has pressed Ueda to buy more bonds if long yields rise disorderly and has appointed reflationist board members; independence is intact but the terminal rate debate (1.5% or 2%?) is now political\n            baseline: \"- Hikes to 1.25% in September and 1.50% by mid-2027, then a pause near the lower end of neutral estimates; JGB taper halted from April 2027\"\n            upside: \"- Terminal rate revised to 2% with orderly curve; yen appreciates gradually and lifers return to super-longs\"\n            downside: \"- A disorderly super-long sell-off forces the BOJ into yield-curve intervention under political pressure; credibility and the yen both suffer\"\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-jp-fi1\n            title: Responsible and proactive, tested by the bond market\n            text: |-\n              - FY2026 budget a record ¥122tn with debt service up 11% on an assumed 3% rate; supplementary budgets and a possible food consumption-tax cut (up to ¥5tn of revenue) are the pressure points\n              - Debt-to-GDP has been falling on nominal growth, which is the government's defence; the market's counter is the 30-year yield at record highs near 4% and a 10-year near 2.8-2.9%, the highest since 1996\n              - Watch: issuance mix (shorter maturities to placate lifers), any move on the consumption tax, and the FY2027 budget request\n            baseline: \"- Supplementary budgets continue, a partial food tax cut is enacted, 10-year yield 2.5-3%; debt ratio roughly stable on nominal growth\"\n            upside: \"- Spending restraint and primary-balance progress; 30-year yields fall back below 3.5%\"\n            downside: \"- Large consumption-tax cut plus defence overshoot; 30-year above 4.5%, rating pressure and a fiscal-dominance debate\"\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-jp-do1\n            title: Real incomes and the household squeeze\n            text: |-\n              - Nominal wages are rising but real wages have oscillated around zero as food and energy inflation bit; consumption is soft and the political pressure for handouts and tax cuts comes from here\n              - Household portfolio shift from deposits into equities (NISA) is a slow structural positive for domestic asset demand\n            baseline: \"- Growth 0.7-1% in 2027 as real wages turn modestly positive and fiscal support flows; exports flat on tariffs and China weakness\"\n            upside: \"- Energy normalises and a stronger yen restores real incomes; consumption and capex lift growth to 1.5%\"\n            downside: \"- Oil stays above $100, the yen weakens again on fiscal concern and real incomes fall; growth near zero and a technical recession\"\n      - id: external\n        name: External\n        issues:\n          - id: iss-jp-ex1\n            title: The yen and the great repatriation question\n            text: |-\n              - The yen traded near 155 for most of the year and then rallied sharply in September on carry-trade unwinds, expectations of capital repatriation and US political pressure for Japan to support the currency\n              - Japan is the largest foreign holder of Treasuries and a large holder of European credit; higher domestic yields and a stronger yen are the mechanism through which Japanese capital comes home, with global term-premium consequences\n          - id: iss-jp-ex2\n            title: Energy dependence and the US trade deal\n            text: |-\n              - Almost entirely dependent on imported hydrocarbons, much of it through Hormuz; the terms-of-trade hit is the largest among G7 economies\n              - The 2025 US deal (15% tariff, investment pledge) has held and Japan is inside the new 301 layer at the lower rate; auto exports to the US remain the exposed sector\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-jp-cr1\n            title: Duration risk has moved from banks to lifers and the sovereign\n            text: |-\n              - Banks have shortened duration and benefit from higher rates; life insurers and pension funds carry the super-long risk and have been reducing demand, which is why the 30-year sector has repriced most\n              - Regional banks with legacy JGB books are the weak link if yields overshoot\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-jp-gd1\n            title: Takaichi has a mandate and a bond-market constraint\n            text: |-\n              - The decisive general election win in early 2026 removed coalition arithmetic as a constraint; the government can spend, and the market rather than the Diet is now the check\n              - Populist tax relief (gasoline levies abolished, food VAT under discussion) is the path of least resistance ahead of the next upper-house cycle\n      - id: international\n        name: International\n        issues:\n          - id: iss-jp-gi1\n            title: Security spending and the China relationship\n            text: |-\n              - Defence and economic-security spending are structural and bipartisan; relations with Beijing are tense after the Taiwan remarks episode and Chinese trade measures, so supply-chain diversification carries a fiscal cost\n              - Alignment with the US on chips and export controls is complete; the exposure is to a US-China re-escalation that hits Japanese suppliers on both sides\nimplications:\n  drivers/regime/trend-growth:\n    margin_growth: up\n    dividend_yield: up\n    cash_rate: up\n  drivers/regime/trend-inflation:\n    inflation_expectation: up\n    cash_rate: up\n    valuation: down\n  drivers/policy/monetary:\n    cash_rate: up\n    term_premium: up\n    valuation: down\n    liquidity: down\n  drivers/policy/fiscal:\n    sales_growth: up\n    term_premium: up\n  drivers/imbalances/domestic:\n    sales_growth: down\n    valuation: up\n  drivers/imbalances/external:\n    margin_growth: down\n    term_premium: up\n  drivers/imbalances/credit:\n    term_premium: up\n    liquidity: down\n  drivers/geopolitics/domestic:\n    sales_growth: up\n    term_premium: up\n  drivers/geopolitics/international:\n    margin_growth: down\n    inflation_expectation: up\n","united-kingdom":"# Country Investment Thesis — United Kingdom\n# Draft house view, September 2026. Edit through EDITOR-country-investment-thesis.html so changes are logged.\n\nid: united-kingdom\nname: United Kingdom\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-uk-tg1\n            title: Stagnation with a loosening labour market\n            text: |-\n              - Growth has been near 1% for three years; unemployment has drifted up to 5.2% as employer payroll-tax rises and minimum-wage increases bit, and hiring has stalled\n              - Productivity is flat and public investment plans are back-loaded; the planning and infrastructure reforms are the only credible supply-side lever and they pay off late in the decade\n              - Our assumption: trend growth 1-1.25%, with the labour-market slack building faster than the Bank expected\n            baseline: \"- Growth around 1% in 2027; unemployment peaks near 5.5%; real incomes flat as energy prices ease slowly\"\n            upside: \"- Energy relief and lower gilt yields support housing and consumption; growth 1.5-2% and unemployment stabilises\"\n            downside: \"- Energy shock persists, tax rises in the autumn budget and rising unemployment tip the economy into recession; unemployment above 6%\"\n          - id: iss-uk-tg2\n            title: Energy-price exposure is structural\n            text: |-\n              - The UK sets electricity prices off gas at the margin and is a net importer; the 2026 Gulf shock has flowed straight through Ofgem price caps into the CPI and into industrial costs\n              - Two cap increases in 2026 (July and October) are why the Bank sees inflation peaking in Q4 rather than Q2\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-uk-ti1\n            title: Inflation was at target, then energy intervened\n            text: |-\n              - CPI 2.9% in July with core at 2.6% and services at 3.4%; before the war the Bank expected 2% from April, and now projects a peak around 3.2% in Q4 2026 with risks to the upside\n              - Underlying disinflation has continued: pay growth is slowing with the loosening labour market, and food inflation is the lowest since 2021; the question is whether households' elevated short-term expectations feed 2027 pay rounds\n            baseline: \"- CPI peaks near 3.2% in Q4 2026 and returns toward 2.5% by end-2027; services inflation keeps easing with the labour market\"\n            upside: \"- Energy normalises and services inflation falls below 3%; CPI back at 2% by mid-2027\"\n            downside: \"- Second Ofgem cap increase plus renewed wage push keep CPI above 3.5%; expectations de-anchor and the Bank has to hike twice or more\"\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-uk-mo1\n            title: MPC split and leaning hawkish\n            text: |-\n              - Bank Rate 3.75% since December; the committee moved from a 5-4 vote with four wanting cuts in February to a 6-3 vote with three wanting hikes in July, purely on the energy shock\n              - Markets price one or two hikes; the Bank's own framing is that policy cannot influence energy prices but must ensure the adjustment happens with inflation returning to target, which is a hold with a hiking bias\n              - Watch: the September 17 decision and the QT annual decision on gilt sales, which has fiscal consequences\n            baseline: \"- One insurance hike to 4% or an extended hold; cuts resume in 2H27 as slack builds\"\n            upside: \"- No hikes, cuts to 3.25% by end-2027 as inflation falls back with energy; gilt curve rallies\"\n            downside: \"- Two or three hikes into a weakening economy, then a sharp reversal; policy error debate and curve volatility\"\n          - id: iss-uk-mo2\n            title: QT and the gilt supply overhang\n            text: \"- Active gilt sales plus record DMO issuance have kept long gilt yields among the highest in the G7; the Bank has been shifting sales toward shorter maturities to relieve the long end\"\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-uk-fi1\n            title: No fiscal room, and a government tempted to spend\n            text: |-\n              - Headroom against the fiscal rules is thin; the 2025 budget raised taxes and the OBR pushed borrowing up; energy-support demands and a weak political position push the other way\n              - The autumn 2026 budget is the test: further tax rises would hit growth, loosening would hit gilts; markets fear a leadership change toward a higher-spending chancellor more than they fear Reeves\n            baseline: \"- Autumn budget balances modest tax rises and energy support; 10-year gilt 4.25-4.75%; headroom stays thin\"\n            upside: \"- Credible medium-term consolidation and lower issuance; 10-year gilt back below 4%\"\n            downside: \"- Leadership change or a loosened fiscal rule; 10-year above 5%, sterling under pressure and an LDI-style liquidity episode\"\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-uk-do1\n            title: High saving rate and a housing market on the turn\n            text: \"- Household saving rate is elevated and consumer confidence weak; the mortgage refinancing wave has largely passed, but a housing market that had started recovering is now facing higher gilt-driven mortgage rates again\"\n      - id: external\n        name: External\n        issues:\n          - id: iss-uk-ex1\n            title: Current-account deficit financed by kindness of strangers\n            text: |-\n              - The UK runs a persistent deficit near 3% of GDP and depends on portfolio inflows; sterling has been stable but gilts are the pressure valve whenever politics or fiscal credibility wobbles\n              - Trade: the US deal (10% baseline, 25% on steel rather than 50%) has held; the EU reset is incremental\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-uk-cr1\n            title: Banks strong, non-bank leverage the watch item\n            text: \"- Banks are well capitalised and profitable; the 2022 LDI episode and the pension-fund shift out of gilts remain the template for how a gilt sell-off transmits, and the Bank now has a standing repo facility for that purpose\"\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-uk-gd1\n            title: A weak government and a populist opposition\n            text: |-\n              - Starmer's authority has been eroded by the Mandelson affair, by-election losses to Greens and Reform, and internal calls to step down; Reform UK leads polls with a platform that markets read as fiscally expansionary\n              - The next general election is not due until 2029, but a leadership change or a shift to spending-led politics is the gilt market's main political risk\n      - id: international\n        name: International\n        issues:\n          - id: iss-uk-gi1\n            title: Energy security and defence\n            text: |-\n              - North Sea decline, LNG dependence and the Gulf war have put energy security back at the centre of policy; defence spending toward 3% of GDP is another claim on a budget with no room\n              - Closer EU alignment on defence and energy is the direction of travel, but slower than the market would like\nimplications:\n  drivers/regime/trend-growth:\n    sales_growth: down\n    cash_rate: down\n  drivers/regime/trend-inflation:\n    inflation_expectation: up\n    cash_rate: up\n    margin_growth: down\n  drivers/policy/monetary:\n    cash_rate: up\n    valuation: down\n  drivers/policy/fiscal:\n    term_premium: up\n    sales_growth: down\n  drivers/imbalances/domestic:\n    sales_growth: down\n    dividend_yield: up\n  drivers/imbalances/external:\n    term_premium: up\n    valuation: down\n  drivers/imbalances/credit:\n    liquidity: down\n  drivers/geopolitics/domestic:\n    term_premium: up\n    valuation: down\n  drivers/geopolitics/international:\n    margin_growth: down\n    inflation_expectation: up\n","united-states":"# Country Investment Thesis — United States\n# Draft house view, September 2026. Edit through EDITOR-country-investment-thesis.html so changes are logged.\n\nid: united-states\nname: United States\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-us-tg1\n            title: AI capex is now the growth engine, and the concentration risk\n            text: |-\n              - Investment in data centres, power and chips is running at something like 2-2.5% of GDP and has carried GDP growth through the tariff and oil shocks; ex-AI, the economy is close to stall speed\n              - Financing has migrated from hyperscaler cash flow to bonds and private credit, so a capex pause would hit both growth and credit markets at once\n              - Working assumption: potential growth around 2% while the productivity dividend is still mostly promise; hours worked and non-residential investment are the tells\n            baseline: \"- Data-centre and power investment keeps growing but decelerates; contributes 0.3-0.5pp to growth in 2027 with financing increasingly debt-funded\"\n            upside: \"- Investment broadens into the grid, industrial automation and measured productivity; potential growth revised up toward 2.5%\"\n            downside: \"- Returns disappoint and private-credit financing tightens; orders are cut, investment subtracts from growth and the credit channel amplifies it\"\n          - id: iss-us-tg2\n            title: Labour supply is the binding constraint\n            text: |-\n              - Immigration enforcement has cut labour-force growth to a trickle; payrolls in the 50-150k range are now consistent with a flat unemployment rate (4.1% in August)\n              - A low-churn market: few layoffs, few hires, long-term unemployment share at a five-year high, wage growth down to about 3% and below headline inflation for four months running\n              - Implication: break-even payroll growth is much lower than markets are used to, and a downturn would show up in hours and participation before it shows in the unemployment rate\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-us-ti1\n            title: Oil shock on top of tariff pass-through\n            text: |-\n              - Headline CPI is stuck at 3.4% with gasoline at record nominal highs after the Hormuz closure; core has cooled to the low 2s as goods pass-through from 2025 tariffs fades and shelter decelerates\n              - The risk is second-round effects: short-horizon inflation expectations are elevated and real wages are falling, which is the classic set-up for wage catch-up demands in 2027\n              - We assume trend inflation settles near 2.5-3% rather than 2%, with the energy path the swing factor\n            baseline: \"- Headline CPI drifts from 3.4% toward 2.8% by mid-2027 as the energy contribution fades; core stays 2.3-2.6%\"\n            upside: \"- Energy normalises quickly and shelter disinflation brings headline to 2.3% by end-2027; expectations re-anchor\"\n            downside: \"- Second-round effects from energy and a weaker dollar push core back above 3%; short-horizon expectations unanchor and the Fed is forced into a real tightening cycle\"\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-us-mo1\n            title: Warsh Fed facing a hike into a slowing economy\n            text: |-\n              - Funds rate at 3.50-3.75% after the July 9-3 hold; three dissents for a hike, and markets price roughly two-thirds odds of a 25bp increase on 16 September\n              - The committee is split between looking through a supply shock and defending credibility after leaving rates unchanged into rising headline inflation; Hammack and others have floated multiple hikes\n              - Watch: the September dots, whether Warsh frames any hike as insurance or the start of a cycle, and the balance-sheet language (reserve-management purchases have been keeping front-end funding calm)\n            baseline: \"- One or two insurance hikes to 4.00%, then an extended hold while the committee watches the labour market; cuts return only in 2H27\"\n            upside: \"- Energy relief lets the Fed stay on hold and resume cutting toward 3% in 2027; the curve bull-steepens in an orderly way\"\n            downside: \"- Either a full hiking cycle toward 4.5-5% into a stagflationary economy, or a growth shock forcing rapid cuts below 2.5%; both damage risk assets and the credibility of the reaction function\"\n          - id: iss-us-mo2\n            title: Independence and the reaction function\n            text: |-\n              - The 2026 chair transition went through without the institutional rupture markets feared, but the administration's preference for lower rates is public and the committee's composition has shifted\n              - Our read: the reaction function is more tolerant of inflation than in 2022 but not captured; the term premium is where markets express doubt, not the front end\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-us-fi1\n            title: Deficit near 6-7% of GDP and losing its tariff crutch\n            text: |-\n              - The 2025 tax package locked in a structural deficit; the Supreme Court's February ruling voided IEEPA tariff revenue and triggered refunds, and the replacement 10-12.5% Section 301 tariffs on 60 economies raise less\n              - Treasury keeps skewing issuance to bills to limit duration supply; that caps term premium today at the cost of rollover risk and growing dependence on money funds\n              - Higher oil raises the deficit further via indexed programmes and lower real growth; no consolidation is plausible before the 2028 cycle\n            baseline: \"- Deficit 6-7% of GDP, bills share stays high, no consolidation before 2028; term premium grinds higher\"\n            upside: \"- Tariff revenue and stronger nominal growth stabilise the debt ratio; Treasury terms out issuance without a term-premium shock\"\n            downside: \"- A cluster of weak auctions or a political challenge to Fed independence produces a term-premium spike and a disorderly bear-steepening\"\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-us-do1\n            title: Two-speed households\n            text: |-\n              - Consumption is being carried by the top of the income distribution on equity wealth; lower-income cohorts are squeezed by $4-plus gasoline, tariff-driven goods prices and rising card delinquencies\n              - The transmission channel that matters is asset prices: an equity correction would hit the only cohort still spending freely\n            baseline: \"- Real consumption slows to 1-1.5% as real incomes stagnate; wealth effects and fiscal support prevent a contraction\"\n            upside: \"- Hormuz reopens durably, gasoline falls back below $3.50 and real wages turn positive; consumption re-accelerates above 2%\"\n            downside: \"- Oil stays above $100 into 2027 and equities correct 15-20%; high-income spending stops and unemployment rises past 5%\"\n          - id: iss-us-do2\n            title: Corporate margins under a cost squeeze\n            text: \"- Tariffs, energy and a tight labour market are compressing margins outside the AI complex; an earnings recession is already visible in consumer discretionary and industrials\"\n      - id: external\n        name: External\n        issues:\n          - id: iss-us-ex1\n            title: Dollar has lost its reflexive safe-haven bid\n            text: |-\n              - The dollar did not rally on the Iran war the way it did in 2022; foreign official demand for Treasuries is slower and more price sensitive, and the euro and yen have both strengthened on repatriation flows\n              - The current account is narrowing as tariffs compress imports, but the financing question (who absorbs record Treasury supply at a lower dollar) is the live one\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-us-cr1\n            title: Private credit is the AI financing plumbing\n            text: |-\n              - Private credit has absorbed the leveraged-loan market and now a large share of data-centre and power project finance; opacity, not aggregate size, is the concern\n              - Stress would surface first in redemption gates and mark-downs at private funds, then in bank lines to those funds; the sector has not been tested by a capex downturn\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-us-gd1\n            title: Midterms and the policy volatility premium\n            text: |-\n              - November midterms are being fought on the cost of living; a Democratic House would end the legislative agenda and raise the odds of investigations, but tariff and regulatory policy would still move by executive action\n              - Congress is also stirring on trade powers (bills to restrain 122, 232 and 301 authority); a real transfer of authority back to Congress would be a structural change in policy risk\n      - id: international\n        name: International\n        issues:\n          - id: iss-us-gi1\n            title: Iran war, Hormuz and the energy price regime\n            text: |-\n              - The Strait has been effectively contested since late February; a June US-Iran MOU reopened it partially, fighting resumed in September and Brent is back near $100 with Iran-Gulf talks pending in Oman\n              - EIA doe const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p) => p + '-' + Math.random().toString(36).slice(2, 8);
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'item';
const nowIso = () => {
  const d = new Date(), tz = -d.getTimezoneOffset(), sign = tz >= 0 ? '+' : '-';
  const p = (n) => String(Math.abs(n)).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + sign + p(Math.floor(Math.abs(tz) / 60)) + ':' + p(Math.abs(tz) % 60);
};
const fmtTime = (iso) => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };

/* Render bullet text: lines starting with "- " become list items, two-space indent nests. **bold** supported. */
function renderRich(text) {
  if (!text || !text.trim()) return '<p class="empty">Nothing entered yet.</p>';
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const out = [];
  let level = 0, liOpen = false;
  const closeLi = () => { if (liOpen) { out.push('</li>'); liOpen = false; } };
  const closeTo = (lvl) => { closeLi(); while (level > lvl) { out.push('</ul>'); level--; if (level > 0) { liOpen = true; closeLi(); } } };
  for (const line of text.split('\n')) {
    const m = line.match(/^(\s*)-\s+(.*)$/);
    if (m) {
      const lvl = Math.min(Math.floor(m[1].length / 2) + 1, level + 1);
      if (lvl > level) { out.push('<ul>'); level++; }
      else closeTo(lvl);
      out.push('<li>' + inline(m[2])); liOpen = true;
    } else if (line.trim() !== '') { closeTo(0); out.push('<p>' + inline(line) + '</p>'); }
  }
  closeTo(0);
  return '<div class="rich">' + out.join('') + '</div>';
}

/* ---------------- data scaffolding ---------------- */
function emptyEconomy(eco) {
  return {
    id: eco.id, name: eco.name, version: 0, updated_at: null, updated_by: null,
    drivers: DRIVER_TEMPLATE.map(d => ({ id: d.id, name: d.name, subsections: d.subsections.map(([id, name]) => ({ id, name, issues: [] })) })),
    implications: {},
  };
}
function normalise(eco, raw) {
  const base = emptyEconomy(eco);
  if (!raw || typeof raw !== 'object') return base;
  const out = { ...base, ...raw };
  out.id = eco.id; out.name = eco.name;
  out.version = Number(out.version) || 0;
  const text = (v) => (v == null ? '' : String(v));
  const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);
  const list = (v) => (Array.isArray(v) ? v.filter(isObj) : []);
  out.drivers = list(out.drivers);
  if (!out.drivers.length) out.drivers = base.drivers;
  out.drivers.forEach((d, n) => {
    d.id = text(d.id) || 'driver-' + (n + 1);
    const t = DRIVER_TEMPLATE.find(x => x.id === d.id);
    // the page owns the fixed structure: for a group or subsection it defines, its name wins
    // over whatever the file says, so renaming one here renames it everywhere on next load
    d.name = t ? t.name : text(d.name) || d.id;
    d.subsections = list(d.subsections);
    d.subsections.forEach((s, m) => {
      s.id = text(s.id) || 'sub-' + (m + 1);
      const ts = t && t.subsections.find(([id]) => id === s.id);
      s.name = ts ? ts[1] : text(s.name) || '';
      s.issues = list(s.issues); for (const i of s.issues) { i.id = text(i.id) || uid('iss'); i.title = text(i.title); i.text = text(i.text); for (const k of SCENARIO_COLS) i[k] = text(i[k]); }
      // an interim layout kept signposts as their own list under the subsection: each becomes an issue with cells and no view text
      for (const i of list(s.signposts)) s.issues.push({ id: text(i.id) || uid('iss'), title: text(i.title), text: '', baseline: text(i.baseline), upside: text(i.upside), downside: text(i.downside) });
      delete s.signposts;
    });
    // a subsection the page defines but the file predates (a newly added one) is created empty
    if (t) for (const [id, name] of t.subsections) if (!d.subsections.some(x => x.id === id)) d.subsections.push({ id, name, issues: [] });
  });
  // Legacy layout: signposts used to live in top-level scenario categories. Fold them into the
  // driver subsections so an old file (a restored version, an old Ada hand-back) still loads.
  if (Array.isArray(raw.scenarios) && raw.scenarios.length) {
    let moved = 0;
    for (const c of raw.scenarios.filter(isObj)) for (const i of list(c.issues)) {
      let [dId, sId] = LEGACY_SCENARIO_HOME[text(c.id)] || LEGACY_SCENARIO_HOME.growth;
      if (text(c.id) === 'policy' && LEGACY_FISCAL.test(text(i.title))) [dId, sId] = ['policy', 'fiscal'];
      const d = out.drivers.find(x => x.id === dId), sub = d && d.subsections.find(x => x.id === sId) || (out.drivers[0] && out.drivers[0].subsections[0]);
      if (!sub) continue;
      sub.issues.push({ id: text(i.id) || uid('iss'), title: text(i.title), text: '', baseline: text(i.baseline), upside: text(i.upside), downside: text(i.downside) }); moved++;
    }
    delete out.scenarios;
    if (moved) toast(`${eco.name}: ${moved} signpost${moved === 1 ? '' : 's'} from the old scenario categories became issues under the drivers (with empty views); save to keep the new layout`);
  } else delete out.scenarios;
  out.implications = {};
  const rowSet = new Set(rowKeys(out).map(r => r.key)); // arrows only on rows that exist (drops the old scenarios/* rows)
  if (isObj(raw.implications)) for (const [key, cells] of Object.entries(raw.implications)) if (isObj(cells) && rowSet.has(key)) { const row = {}; for (const [f, v] of Object.entries(cells)) if (v === 'up' || v === 'down') row[f] = v; if (Object.keys(row).length) out.implications[key] = row; }
  return out;
}
function rowKeys(eco) {
  const rows = [];
  const titles = (items) => items.map(i => i.title.trim() || 'Untitled');
  for (const d of eco.drivers) for (const s of d.subsections) rows.push({ key: `drivers/${d.id}/${s.id}`, group: d.name, groupId: d.id, name: s.name, items: titles(s.issues) });
  return rows;
}

async function connectFolder() {
  if (Store.fallback) return fallbackOpen();
  if (Store.connected) { if (S.draft) { toast('Save or cancel your edits before reloading'); return; } await loadAll(); render(); toast('Reloaded from folder'); return; }
  try {
    if (S.savedFolder) { if (!(await Store.requestSaved())) await Store.pick(); }
    else await Store.pick();
    await loadAll(); render();
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    dialog('Could not open the folder', '<p>' + esc(e.message || e) + '</p><p>If this page was opened from a <code>file://</code> path and the folder picker is blocked, use "Open YAML files" instead.</p>', [['Close']]);
  }
}
async function loadAll() {
  let cfgText = null;
  try { cfgText = await Store.readText('config.yaml'); } catch (e) { /* optional */ }
  if (cfgText) {
    try { const cfg = YAML.parse(cfgText); if (cfg && Array.isArray(cfg.economies) && cfg.economies.length) S.config = { ...S.config, ...cfg }; }
    catch (e) { toast('config.yaml could not be read; using defaults'); }
  }
  if (!S.config.economies.find(e => e.id === S.current)) S.current = S.config.economies[0].id;
  for (const eco of S.config.economies) await loadEconomy(eco);
  S.demo = false;
  statusConnected();
  S.savedFolder = true;
  $('brand').firstChild.textContent = S.config.title || 'Country Investment Thesis';
  document.title = S.config.title || 'Country Investment Thesis';
}
async function loadEconomy(eco) {
  const text = await Store.readText(`data/${eco.id}.yaml`);
  let raw = null;
  delete S.loadError[eco.id];
  if (text && text.trim()) { try { raw = YAML.parse(text); } catch (e) { S.loadError[eco.id] = e.message; toast(`${eco.name}: data file could not be parsed`); } }
  S.data[eco.id] = normalise(eco, raw);
  S.loadedText[eco.id] = text || '';
}
async function exportSnapshot() {
  if (!Store.connected) return;
  if (!(await Store.ensureWrite())) { toast('Exporting a snapshot needs permission to write to the folder; allow it when the browser asks'); return; }
  statusConnected();
  try {
    let name = decodeURIComponent(location.pathname.split('/').pop());
    let src = await Store.readText(name);
    if (src == null && name !== 'EDITOR-country-investment-thesis.html') {
      name = 'EDITOR-country-investment-thesis.html';
      src = await Store.readText(name);
    }
    if (src == null) {
      dialog('Could not export snapshot', `<p>Could not read <code>${esc(name)}</code> from the connected folder.</p>`, [['Close']]);
      return;
    }
    const today = new Date(), pad = (n) => String(n).padStart(2, '0');
    const defaultName = `${name.replace(/^EDITOR-/i, '').replace(/\.html$/, '')}-${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}.html`;
    const outName = await promptSnapshotName(defaultName);
    if (!outName) return;
    if (outName.toLowerCase() === name.toLowerCase()) {
      dialog('Could not export snapshot', '<p>That is the name of the live source file — choose a different name so it is not overwritten.</p>', [['Close']]);
      return;
    }
    const yamlById = {};
    for (const eco of S.config.economies) {
      const text = await Store.readText(`data/${eco.id}.yaml`);
      if (text != null) yamlById[eco.id] = text;
    }
    let sawDemoYaml = false;
    src = src.replace(/const DEMO_YAML = [^\r\n]*;/, () => { sawDemoYaml = true; return `const DEMO_YAML = ${JSON.stringify(yamlById)};`; });
    if (!sawDemoYaml) {
      dialog('Could not export snapshot', '<p>Could not find the <code>DEMO_YAML</code> constant in the source file.</p>', [['Close']]);
      return;
    }
    let sawSnapshotAt = false;
    src = src.replace(/const SNAPSHOT_AT = [^\r\n]*;/, () => { sawSnapshotAt = true; return `const SNAPSHOT_AT = ${JSON.stringify(nowIso())};`; });
    if (!sawSnapshotAt) {
      dialog('Could not export snapshot', '<p>Could not find the <code>SNAPSHOT_AT</code> constant in the source file.</p>', [['Close']]);
      return;
    }
    await Store.writeText(outName, src);
    toast('Exported ' + outName);
  } catch (e) {
    dialog('Could not export snapshot', '<p>' + esc(e.message || e) + '</p>', [['Close']]);
  }
}
async function promptSnapshotName(defaultName) {
  const p = dialog('Export snapshot', `<p>Saves a self-contained, read-only copy of the team's current views into this folder.</p><div class="field"><label>File name</label><input type="text" id="dlg-input" placeholder="${esc(defaultName)}"></div>`, [['Cancel', 'quiet'], ['Export', 'primary']]);
  const inp = $('dlg-input'); inp.focus();
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('dlg-actions').querySelector('[data-i="1"]').click(); });
  if (await p !== 1) return null;
  let out = inp.value.trim() || defaultName;
  out = out.split(/[\\/]+/).pop();
  if (!/\.html$/i.test(out)) out += '.html';
  return out;
}

/* ---------------- fallback (no File System Access API) ---------------- */
function fallbackOpen() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true; inp.accept = '.yaml,.yml';
  inp.onchange = async () => {
    for (const f of inp.files) {
      const text = await f.text();
      const id = f.name.replace(/\.ya?ml$/, '');
      if (id === 'config') { try { const cfg = YAML.parse(text); if (cfg && Array.isArray(cfg.economies) && cfg.economies.length) S.config = { ...S.config, ...cfg }; } catch (e) { toast('config.yaml unreadable'); } continue; }
      const eco = S.config.economies.find(e => e.id === id);
      if (!eco) { toast('Skipped ' + f.name + ': not a known economy'); continue; }
      delete S.loadError[id];
      try { S.data[id] = normalise(eco, YAML.parse(text)); } catch (e) { S.loadError[id] = e.message; S.data[id] = normalise(eco, null); toast(f.name + ' could not be parsed'); }
      S.loadedText[id] = text;
    }
    S.demo = false;
    if (!S.config.economies.find(e => e.id === S.current)) S.current = S.config.economies[0].id;
    for (const eco of S.config.economies) if (!S.data[eco.id]) S.data[eco.id] = normalise(eco, null);
    setStatus('warn', 'Files opened', 'Files were opened by hand \u2014 click to pick more. Saving downloads the updated YAML.');
    render();
  };
  inp.click();
}
function download(name, body, type = 'text/yaml') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
/* Save the selected economy as a Word document. Read-only, so unlike Export snapshot it
   needs no write access to the folder and no entry in config.yaml's editors list: anyone
   looking at the page can take a copy away, including from a snapshot. */
async function exportWord() {
  const eco = S.data[S.current];

  try {
    const bytes = await DOCX.write(eco);
    download(`${eco.id}-v${eco.version}.docx`, bytes, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    toast(`Saved ${eco.id}-v${eco.version}.docx to your downloads`);
  } catch (e) {
    dialog('Could not build the Word file', '<p>' + esc(e.message || e) + '</p>', [['Close']]);
  }
}

    <div class="legend"><span class="item"><span class="arrow up">${ARROW.up}</span>Upside to the factor</span><span class="item"><span class="arrow down">${ARROW.down}</span>Downside to the factor</span><span class="item"><span class="arrow none">${ARROW.none}</span>Neutral / not relevant</span>${ed ? '<span class="item">Click a cell to cycle through the three states.</span>' : ''}</div>`;
}

/* ---------- wiring ---------- */
function wireMain(eco) {
  const main = $('main');
