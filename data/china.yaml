# Country Investment Thesis — China
# Draft house view, September 2026. Edit through EDITOR-country-investment-thesis.html so changes are logged.

id: china
name: China
version: 2
updated_at: "2026-09-13T12:00:00+08:00"
updated_by: draft
drivers:
  - id: regime
    name: Regime
    subsections:
      - id: trend-growth
        name: Trend growth
        issues:
          - id: iss-cn-tg1
            title: Growth without domestic demand
            text: |-
              - Headline growth is holding in the 4.5-5% range the 15th Five-Year Plan implies, but the composition is exports and state-directed manufacturing; private investment and property have been contracting since mid-2025
              - The property adjustment is still running: existing-home prices down more than 20% from the 2021 peak, starts down about 70%, and rating agencies still expect further declines in 2026
              - Our working assumption is trend growth drifting toward 4% by 2028, with the export surplus (above $1tn in 2025) the main support and the main source of friction
          - id: iss-cn-tg2
            title: The productivity bet on AI and advanced manufacturing
            text: |-
              - The Plan targets core digital industries above 12% of GDP and R&D growth above 7% a year; DeepSeek-style capability gains and EV and battery dominance are real, and TFP is contributing more than demographics subtract
              - The failure mode is overcapacity: the anti-involution campaign against price wars has had limited traction, and margins in solar, EVs and steel remain compressed
        signposts:
          - id: iss-cn-sg1
            title: Property stabilisation
            baseline: "- Prices keep falling at a slowing pace; starts flat at a low base; property subtracts 0.5-1pp from growth through 2027 and growth lands near 4.3-4.5%"
            upside: "- Central-government inventory purchases and lower rates stabilise tier-1 and tier-2 prices by mid-2027; household confidence recovers and consumption growth exceeds 5%"
            downside: "- A second leg down in prices, developer defaults spread to the state-linked sector, and local-government finances force spending cuts; growth below 3.5%"
          - id: iss-cn-sg2
            title: Export engine under backlash
            baseline: "- Export volumes keep growing mid-single digits with redirection to the Global South; the surplus stays near $1tn"
            upside: "- A durable US deal plus EU market access keeps export growth high while domestic demand policy finally scales; nominal GDP growth back above 6%"
            downside: "- Coordinated tariffs from the US, EU and major EMs cut export growth to zero; overcapacity turns into industrial bankruptcies and a localised financial event"
      - id: trend-inflation
        name: Trend inflation
        issues:
          - id: iss-cn-ti1
            title: Ten quarters of near-zero inflation
            text: |-
              - CPI 0.8% in August with core at 1.0%; food prices falling for a fifth month and housing costs still negative; PPI has been in deflation for over three years
              - The oil shock is passing through to transport prices but not to core; China is exporting disinflation to the rest of the world through goods prices
              - Real rates remain too high for a deleveraging economy; this is the central policy failure and the reason nominal GDP growth lags real growth
        signposts:
          - id: iss-cn-si1
            title: Exit from deflation
            baseline: "- CPI 0.5-1% and PPI slightly negative through 2027; nominal growth stays below real growth"
            upside: "- Anti-involution enforcement and demand support lift core inflation above 1.5%; PPI turns positive and corporate profits recover"
            downside: "- Renewed property deflation and yuan strength push CPI below zero; debt-deflation dynamics and a Japan-1990s narrative take hold"
  - id: policy
    name: Policy
    subsections:
      - id: monetary
        name: Monetary
        issues:
          - id: iss-cn-mo1
            title: PBOC easing in small steps, preserving ammunition
            text: |-
              - One-year LPR at 3.0% after the April cut; the central bank has preferred RRR cuts, structural lending facilities and bond purchases to headline rate moves, and has been protective of bank margins and the currency
              - With US-China relations in a truce and the Iran war raising import costs, the PBOC is holding firepower; expect 10-20bp of further cuts only if activity weakens visibly in Q4
              - Watch: the 7-day reverse repo, net bond purchases, and any shift to explicit inflation-targeting language
        signposts:
          - id: iss-cn-sp1
            title: PBOC and fiscal response
            baseline: "- LPR cut to 2.8% by mid-2027, more RRR cuts and bond purchases; fiscal stays supply-side with incremental consumer measures"
            upside: "- Beijing shifts to large direct household transfers and a housing inventory backstop after the 2027 Congress; the yuan strengthens on confidence"
            downside: "- Policy stays reactive; capital outflow pressure forces a managed depreciation and tighter controls"
      - id: fiscal
        name: Fiscal
        issues:
          - id: iss-cn-fi1
            title: Fiscal is doing the work, but on the supply side
            text: |-
              - Augmented deficit near 8-9% of GDP; the local-government debt swap has removed near-term refinancing risk but not the incentive problem
              - Consumer trade-in subsidies, childcare allowances and the consumption emphasis in the Plan are real but small relative to the household balance-sheet hit from property; policymakers are still reluctant to run demand-side transfers at scale
              - Watch: the Q4 Politburo and the December Central Economic Work Conference for any move toward direct household support ahead of the 2027 Party Congress
        signposts: []
  - id: imbalances
    name: Imbalances
    subsections:
      - id: domestic
        name: Domestic
        issues:
          - id: iss-cn-do1
            title: Household balance sheets and the consumption gap
            text: |-
              - Property is 60-70% of household wealth and still falling; precautionary saving is elevated, youth unemployment near 17%, and consumption is running below income growth
              - Retail sales respond to subsidies then fade; the structural fix (social security, hukou, income redistribution) is acknowledged in the Plan but not funded
        signposts: []
      - id: external
        name: External
        issues:
          - id: iss-cn-ex1
            title: Record surplus, redirected away from the US
            text: |-
              - Exports to the US fell by double digits through 2025 while shipments to ASEAN, the EU and the Middle East surged; the surplus passed $1tn and is the source of a widening global backlash (EU, Brazil, India all adding measures)
              - The yuan has been managed firm to keep the trade truce and to lean against capital outflows; a weaker currency is the tail policy option
          - id: iss-cn-ex2
            title: Energy import exposure
            text: |-
              - China is the largest importer through Hormuz; crude imports hit a decade low in June before recovering, and the shock has hit refining margins and the terms of trade
              - Strategic stockpiles and Russian supply have cushioned the blow, and the episode strengthens the case for the EV and renewables push
        signposts: []
      - id: credit
        name: Credit
        issues:
          - id: iss-cn-cr1
            title: Credit demand is the problem, not supply
            text: |-
              - Credit growth is at multi-decade lows in real terms; households are repaying mortgages early and corporates are hoarding cash
              - Bank asset quality is deteriorating slowly in property and small-business lending; state recapitalisation of the large banks has pre-empted a capital problem, smaller regional banks remain the weak link
        signposts: []
  - id: geopolitics
    name: Geopolitics
    subsections:
      - id: domestic
        name: Domestic
        issues:
          - id: iss-cn-gd1
            title: Run-up to the 21st Party Congress
            text: |-
              - Policy is being set with the 2027 Congress in view: stability, technological self-reliance and political control rank above consumption stimulus
              - Provincial competition and local protectionism are named in the Plan as problems; execution risk on unification of the domestic market is high
        signposts: []
      - id: international
        name: International
        issues:
          - id: iss-cn-gi1
            title: The US truce and its edges
            text: |-
              - The Busan truce (October 2025) and Beijing summit (May 2026) have held: triple-digit tariffs were averted, China's rare-earth controls proved to be real leverage, and China now faces the same 12.5% Section 301 layer as other Asian exporters plus legacy 301 duties
              - The edges are being tested: the US excess-capacity investigation, chip export controls, and Taiwan; either side can re-escalate quickly and the truce expires unless renewed
          - id: iss-cn-gi2
            title: Trade backlash beyond the US
            text: "- The EU, Brazil, India, Mexico and Turkey have all added tariffs or investigations on Chinese autos, steel and chemicals; the surplus redirection strategy is running into limits in 2026-27"
        signposts: []
