# Country Investment Thesis — Japan
# Draft house view, September 2026. Edit through EDITOR-country-investment-thesis.html so changes are logged.

id: japan
name: Japan
version: 2
updated_at: "2026-09-13T12:00:00+08:00"
updated_by: draft
drivers:
  - id: regime
    name: Regime
    subsections:
      - id: trend-growth
        name: Trend growth
        issues:
          - id: iss-jp-tg1
            title: Reflation is real but the growth rate is not
            text: |-
              - Potential growth is still near 0.5%; what has changed is nominal: wages, prices and corporate pricing power have all moved, and corporate profits have stayed high through the tariff and energy shocks
              - The Takaichi programme (economic security, defence above 2% of GDP, disaster resilience, a 17-field growth strategy) is a fiscal push rather than a supply-side reform; the multiplier is low in a full-employment economy
              - Labour scarcity is the binding constraint; capex in automation and software is the one genuinely structural upside
          - id: iss-jp-tg2
            title: Corporate governance and capital return
            text: "- Cross-shareholding unwinds, buybacks and activist pressure keep ROE rising; this is the equity story regardless of macro and is now in its fourth year"
        signposts:
          - id: iss-jp-sg1
            title: Consumption recovery versus energy squeeze
            baseline: "- Growth 0.7-1% in 2027 as real wages turn modestly positive and fiscal support flows; exports flat on tariffs and China weakness"
            upside: "- Energy normalises and a stronger yen restores real incomes; consumption and capex lift growth to 1.5%"
            downside: "- Oil stays above $100, the yen weakens again on fiscal concern and real incomes fall; growth near zero and a technical recession"
      - id: trend-inflation
        name: Trend inflation
        issues:
          - id: iss-jp-ti1
            title: The wage-price mechanism has held, now stress-tested by oil
            text: |-
              - Shunto outcomes have delivered a third year of strong base-pay rises; services inflation and rent are finally moving, which is the domestic anchor the BOJ wanted
              - The Gulf war pushed headline inflation up through energy and food, exactly the import-driven inflation that squeezed real incomes in 2022-23; the yen's September rally is the offset
              - We assume underlying inflation settles around 2% with two-sided risk, which is a regime change from the 2010s
        signposts:
          - id: iss-jp-si1
            title: Underlying inflation at 2%
            baseline: "- Core inflation settles near 2% through 2027; the 2027 shunto delivers base-pay growth of 3% or more"
            upside: "- Services inflation and rents keep rising; underlying inflation runs 2.5% and the BOJ's terminal rate estimate moves up"
            downside: "- Yen strength and an energy reversal drag headline below 1.5%; the wage-price mechanism stalls and the BOJ pauses indefinitely"
  - id: policy
    name: Policy
    subsections:
      - id: monetary
        name: Monetary
        issues:
          - id: iss-jp-mo1
            title: BOJ normalisation is proceeding, with political friction
            text: |-
              - Policy rate raised to 1.00% in June and widely expected to reach 1.25% at the September meeting, a 30-year high; the stated logic is upside inflation risk from oil and the weak yen
              - The BOJ has said it will stop tapering JGB purchases from April 2027, holding monthly buying steady; the balance sheet is nonetheless down about 15% from its peak, the largest QT any G7 central bank has run
              - Takaichi has pressed Ueda to buy more bonds if long yields rise disorderly and has appointed reflationist board members; independence is intact but the terminal rate debate (1.5% or 2%?) is now political
        signposts:
          - id: iss-jp-sp1
            title: BOJ path from 1.00-1.25%
            baseline: "- Hikes to 1.25% in September and 1.50% by mid-2027, then a pause near the lower end of neutral estimates; JGB taper halted from April 2027"
            upside: "- Terminal rate revised to 2% with orderly curve; yen appreciates gradually and lifers return to super-longs"
            downside: "- A disorderly super-long sell-off forces the BOJ into yield-curve intervention under political pressure; credibility and the yen both suffer"
      - id: fiscal
        name: Fiscal
        issues:
          - id: iss-jp-fi1
            title: Responsible and proactive, tested by the bond market
            text: |-
              - FY2026 budget a record ¥122tn with debt service up 11% on an assumed 3% rate; supplementary budgets and a possible food consumption-tax cut (up to ¥5tn of revenue) are the pressure points
              - Debt-to-GDP has been falling on nominal growth, which is the government's defence; the market's counter is the 30-year yield at record highs near 4% and a 10-year near 2.8-2.9%, the highest since 1996
              - Watch: issuance mix (shorter maturities to placate lifers), any move on the consumption tax, and the FY2027 budget request
        signposts:
          - id: iss-jp-sp2
            title: Fiscal credibility
            baseline: "- Supplementary budgets continue, a partial food tax cut is enacted, 10-year yield 2.5-3%; debt ratio roughly stable on nominal growth"
            upside: "- Spending restraint and primary-balance progress; 30-year yields fall back below 3.5%"
            downside: "- Large consumption-tax cut plus defence overshoot; 30-year above 4.5%, rating pressure and a fiscal-dominance debate"
  - id: imbalances
    name: Imbalances
    subsections:
      - id: domestic
        name: Domestic
        issues:
          - id: iss-jp-do1
            title: Real incomes and the household squeeze
            text: |-
              - Nominal wages are rising but real wages have oscillated around zero as food and energy inflation bit; consumption is soft and the political pressure for handouts and tax cuts comes from here
              - Household portfolio shift from deposits into equities (NISA) is a slow structural positive for domestic asset demand
        signposts: []
      - id: external
        name: External
        issues:
          - id: iss-jp-ex1
            title: The yen and the great repatriation question
            text: |-
              - The yen traded near 155 for most of the year and then rallied sharply in September on carry-trade unwinds, expectations of capital repatriation and US political pressure for Japan to support the currency
              - Japan is the largest foreign holder of Treasuries and a large holder of European credit; higher domestic yields and a stronger yen are the mechanism through which Japanese capital comes home, with global term-premium consequences
          - id: iss-jp-ex2
            title: Energy dependence and the US trade deal
            text: |-
              - Almost entirely dependent on imported hydrocarbons, much of it through Hormuz; the terms-of-trade hit is the largest among G7 economies
              - The 2025 US deal (15% tariff, investment pledge) has held and Japan is inside the new 301 layer at the lower rate; auto exports to the US remain the exposed sector
        signposts: []
      - id: credit
        name: Credit
        issues:
          - id: iss-jp-cr1
            title: Duration risk has moved from banks to lifers and the sovereign
            text: |-
              - Banks have shortened duration and benefit from higher rates; life insurers and pension funds carry the super-long risk and have been reducing demand, which is why the 30-year sector has repriced most
              - Regional banks with legacy JGB books are the weak link if yields overshoot
        signposts: []
  - id: geopolitics
    name: Geopolitics
    subsections:
      - id: domestic
        name: Domestic
        issues:
          - id: iss-jp-gd1
            title: Takaichi has a mandate and a bond-market constraint
            text: |-
              - The decisive general election win in early 2026 removed coalition arithmetic as a constraint; the government can spend, and the market rather than the Diet is now the check
              - Populist tax relief (gasoline levies abolished, food VAT under discussion) is the path of least resistance ahead of the next upper-house cycle
        signposts: []
      - id: international
        name: International
        issues:
          - id: iss-jp-gi1
            title: Security spending and the China relationship
            text: |-
              - Defence and economic-security spending are structural and bipartisan; relations with Beijing are tense after the Taiwan remarks episode and Chinese trade measures, so supply-chain diversification carries a fiscal cost
              - Alignment with the US on chips and export controls is complete; the exposure is to a US-China re-escalation that hits Japanese suppliers on both sides
        signposts: []
