n    inflation_expectation: up\n  drivers/imbalances/credit:\n    liquidity: down\n    valuation: down\n  drivers/geopolitics/domestic:\n    valuation: down\n    term_premium: up\n  drivers/geopolitics/international:\n    margin_growth: down\n    inflation_expectation: up\n    cash_rate: up\n  scenarios/growth:\n    sales_growth: down\n    margin_growth: down\n    valuation: down\n  scenarios/inflation:\n    inflation_expectation: up\n    cash_rate: up\n    valuation: down\n  scenarios/policy:\n    cash_rate: up\n    term_premium: up\n    liquidity: down\n", "china": "# Country Investment Thesis \u2014 China\n# Draft house view, September 2026. Edit through country-investment-thesis.html so changes are logged.\n\nid: china\nname: China\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-cn-tg1\n            title: Growth without domestic demand\n            text: |-\n              - Headline growth is holding in the 4.5-5% range the 15th Five-Year Plan implies, but the composition is exports and state-directed manufacturing; private investment and property have been contracting since mid-2025\n              - The property adjustment is still running: existing-home prices down more than 20% from the 2021 peak, starts down about 70%, and rating agencies still expect further declines in 2026\n              - Our working assumption is trend growth drifting toward 4% by 2028, with the export surplus (above $1tn in 2025) the main support and the main source of friction\n          - id: iss-cn-tg2\n            title: The productivity bet on AI and advanced manufacturing\n            text: |-\n              - The Plan targets core digital industries above 12% of GDP and R&D growth above 7% a year; DeepSeek-style capability gains and EV and battery dominance are real, and TFP is contributing more than demographics subtract\n              - The failure mode is overcapacity: the anti-involution campaign against price wars has had limited traction, and margins in solar, EVs and steel remain compressed\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-cn-ti1\n            title: Ten quarters of near-zero inflation\n            text: |-\n              - CPI 0.8% in August with core at 1.0%; food prices falling for a fifth month and housing costs still negative; PPI has been in deflation for over three years\n              - The oil shock is passing through to transport prices but not to core; China is exporting disinflation to the rest of the world through goods prices\n              - Real rates remain too high for a deleveraging economy; this is the central policy failure and the reason nominal GDP growth lags real growth\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-cn-mo1\n            title: PBOC easing in small steps, preserving ammunition\n            text: |-\n              - One-year LPR at 3.0% after the April cut; the central bank has preferred RRR cuts, structural lending facilities and bond purchases to headline rate moves, and has been protective of bank margins and the currency\n              - With US-China relations in a truce and the Iran war raising import costs, the PBOC is holding firepower; expect 10-20bp of further cuts only if activity weakens visibly in Q4\n              - Watch: the 7-day reverse repo, net bond purchases, and any shift to explicit inflation-targeting language\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-cn-fi1\n            title: Fiscal is doing the work, but on the supply side\n            text: |-\n              - Augmented deficit near 8-9% of GDP; the local-government debt swap has removed near-term refinancing risk but not the incentive problem\n              - Consumer trade-in subsidies, childcare allowances and the consumption emphasis in the Plan are real but small relative to the household balance-sheet hit from property; policymakers are still reluctant to run demand-side transfers at scale\n              - Watch: the Q4 Politburo and the December Central Economic Work Conference for any move toward direct household support ahead of the 2027 Party Congress\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-cn-do1\n            title: Household balance sheets and the consumption gap\n            text: |-\n              - Property is 60-70% of household wealth and still falling; precautionary saving is elevated, youth unemployment near 17%, and consumption is running below income growth\n              - Retail sales respond to subsidies then fade; the structural fix (social security, hukou, income redistribution) is acknowledged in the Plan but not funded\n      - id: external\n        name: External\n        issues:\n          - id: iss-cn-ex1\n            title: Record surplus, redirected away from the US\n            text: |-\n              - Exports to the US fell by double digits through 2025 while shipments to ASEAN, the EU and the Middle East surged; the surplus passed $1tn and is the source of a widening global backlash (EU, Brazil, India all adding measures)\n              - The yuan has been managed firm to keep the trade truce and to lean against capital outflows; a weaker currency is the tail policy option\n          - id: iss-cn-ex2\n            title: Energy import exposure\n            text: |-\n              - China is the largest importer through Hormuz; crude imports hit a decade low in June before recovering, and the shock has hit refining margins and the terms of trade\n              - Strategic stockpiles and Russian supply have cushioned the blow, and the episode strengthens the case for the EV and renewables push\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-cn-cr1\n            title: Credit demand is the problem, not supply\n            text: |-\n              - Credit growth is at multi-decade lows in real terms; households are repaying mortgages early and corporates are hoarding cash\n              - Bank asset quality is deteriorating slowly in property and small-business lending; state recapitalisation of the large banks has pre-empted a capital problem, smaller regional banks remain the weak link\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-cn-gd1\n            title: Run-up to the 21st Party Congress\n            text: |-\n              - Policy is being set with the 2027 Congress in view: stability, technological self-reliance and political control rank above consumption stimulus\n              - Provincial competition and local protectionism are named in the Plan as problems; execution risk on unification of the domestic market is high\n      - id: international\n        name: International\n        issues:\n          - id: iss-cn-gi1\n            title: The US truce and its edges\n            text: |-\n              - The Busan truce (October 2025) and Beijing summit (May 2026) have held: triple-digit tariffs were averted, China's rare-earth controls proved to be real leverage, and China now faces the same 12.5% Section 301 layer as other Asian exporters plus legacy 301 duties\n              - The edges are being tested: the US excess-capacity investigation, chip export controls, and Taiwan; either side can re-escalate quickly and the truce expires unless renewed\n          - id: iss-cn-gi2\n            title: Trade backlash beyond the US\n            text: |-\n              - The EU, Brazil, India, Mexico and Turkey have all added tariffs or investigations on Chinese autos, steel and chemicals; the surplus redirection strategy is running into limits in 2026-27\nscenarios:\n  - id: growth\n    name: Growth\n    issues:\n      - id: iss-cn-sg1\n        title: Property stabilisation\n        baseline: |-\n          - Prices keep falling at a slowing pace; starts flat at a low base; property subtracts 0.5-1pp from growth through 2027 and growth lands near 4.3-4.5%\n        upside: |-\n          - Central-government inventory purchases and lower rates stabilise tier-1 and tier-2 prices by mid-2027; household confidence recovers and consumption growth exceeds 5%\n        downside: |-\n          - A second leg down in prices, developer defaults spread to the state-linked sector, and local-government finances force spending cuts; growth below 3.5%\n      - id: iss-cn-sg2\n        title: Export engine under backlash\n        baseline: |-\n          - Export volumes keep growing mid-single digits with redirection to the Global South; the surplus stays near $1tn\n        upside: |-\n          - A durable US deal plus EU market access keeps export growth high while domestic demand policy finally scales; nominal GDP growth back above 6%\n        downside: |-\n          - Coordinated tariffs from the US, EU and major EMs cut export growth to zero; overcapacity turns into industrial bankruptcies and a localised financial event\n  - id: inflation\n    name: Inflation\n    issues:\n      - id: iss-cn-si1\n        title: Exit from deflation\n        baseline: |-\n          - CPI 0.5-1% and PPI slightly negative through 2027; nominal growth stays below real growth\n        upside: |-\n          - Anti-involution enforcement and demand support lift core inflation above 1.5%; PPI turns positive and corporate profits recover\n        downside: |-\n          - Renewed property deflation and yuan strength push CPI below zero; debt-deflation dynamics and a Japan-1990s narrative take hold\n  - id: policy\n    name: Policy\n    issues:\n      - id: iss-cn-sp1\n        title: PBOC and fiscal response\n        baseline: |-\n          - LPR cut to 2.8% by mid-2027, more RRR cuts and bond purchases; fiscal stays supply-side with incremental consumer measures\n        upside: |-\n          - Beijing shifts to large direct household transfers and a housing inventory backstop after the 2027 Congress; the yuan strengthens on confidence\n        downside: |-\n          - Policy stays reactive; capital outflow pressure forces a managed depreciation and tighter controls\nimplications:\n  drivers/regime/trend-growth:\n    sales_growth: down\n    margin_growth: down\n    cash_rate: down\n  drivers/regime/trend-inflation:\n    margin_growth: down\n    inflation_expectation: down\n    cash_rate: down\n  drivers/policy/monetary:\n    valuation: up\n    cash_rate: down\n    liquidity: up\n  drivers/policy/fiscal:\n    sales_growth: up\n    term_premium: up\n  drivers/imbalances/domestic:\n    sales_growth: down\n    valuation: down\n  drivers/imbalances/external:\n    margin_growth: down\n    inflation_expectation: down\n  drivers/imbalances/credit:\n    liquidity: down\n    cash_rate: down\n  drivers/geopolitics/domestic:\n    valuation: down\n  drivers/geopolitics/international:\n    sales_growth: down\n    margin_growth: down\n    valuation: down\n  scenarios/growth:\n    sales_growth: down\n    dividend_yield: up\n  scenarios/inflation:\n    inflation_expectation: down\n    cash_rate: down\n  scenarios/policy:\n    cash_rate: down\n    liquidity: up\n    valuation: up\n", "eurozone": "# Country Investment Thesis \u2014 Eurozone\n# Draft house view, September 2026. Edit through country-investment-thesis.html so changes are logged.\n\nid: eurozone\nname: Eurozone\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-ez-tg1\n            title: German fiscal impulse against an energy headwind\n            text: |-\n              - Potential growth is still around 1%, but the German infrastructure and defence programme (deficit near 4.75% of GDP, the largest stimulus since the 1970s) is the first sustained upward force in a decade and is finally showing up in orders and construction\n              - Growth has surprised to the upside in 2026 (Q2 at 0.6% q/q, flattered by Ireland) and the ECB now projects 0.9% this year and 1.4% in 2027\n              - The offset is energy: the Gulf war re-opened the competitiveness gap with the US just as it had started to close, and energy-intensive industry is shedding capacity again\n          - id: iss-ez-tg2\n            title: Productivity and the savings glut\n            text: |-\n              - Household saving rate remains several points above pre-2020 norms; the fiscal impulse is partly saved rather than spent, which caps the multiplier\n              - Capital-market union and pension reform (the Dutch transition, EU savings and investment agenda) are slow-moving but matter for whether the region's surplus is recycled at home\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-ez-ti1\n            title: Energy has reopened the inflation gap\n            text: |-\n              - Headline inflation is 3.3% (August) with energy up 14% y/y; excluding energy it is 2.2%, which is the number that will decide the cycle\n              - Staff projections put headline at 3.0% in 2026, 2.5% in 2027 and 2.1% in 2028; core is projected at 2.5-2.6% through 2027, so the ECB sees a longer road back to target than in March\n              - Second-round risk is lower than in 2022 because wage growth has already decelerated and the euro is firm, but negotiated wages for 2027 are the key check\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-ez-mo1\n            title: ECB has hiked twice and calls it a war-inflation response\n            text: |-\n              - Deposit rate 2.50% after 25bp hikes in June and on 10 September, described as unanimous; the Council is explicit that the moves are about the energy shock and are robust across scenarios, not a new cycle\n              - Markets price more tightening than the ECB's own baseline needs; if energy falls, the front end has room to rally, which is the asymmetric trade\n              - Watch: the October 29 meeting, negotiated wage data, and whether Lagarde starts to distinguish between headline and ex-energy inflation more forcefully\n          - id: iss-ez-mo2\n            title: Balance sheet and the fragmentation backstop\n            text: |-\n              - APP and PEPP run off passively; there is no Eurosystem bid for French paper, which is why the OAT spread now trades on fundamentals and politics\n              - TPI has not been needed, but its credibility is what keeps a French episode from becoming a euro-area episode\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-ez-fi1\n            title: Two-speed fiscal union\n            text: |-\n              - Germany is spending (record issuance above \u20ac500bn in 2026); France cannot consolidate (deficit 5.1%, debt 118% of GDP, another budget standoff over the 2027 finance law); Italy and Spain are the surprising fiscal good pupils\n              - Defence at 3-3.5% of GDP is the new common denominator and is debt-financed nearly everywhere; the revised EU rules are being interpreted flexibly\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-ez-do1\n            title: Precautionary saving and the labour market\n            text: |-\n              - Unemployment is near record lows and real incomes have been rising, yet consumption remains subdued; the energy shock has reset confidence just as it was recovering\n              - Upside if the stock of savings is drawn down once energy prices settle; the German programme provides the confidence trigger\n      - id: external\n        name: External\n        issues:\n          - id: iss-ez-ex1\n            title: Surplus recycling and the euro\n            text: |-\n              - Current account surplus near 3% of GDP and increasingly invested at home as US allocations are trimmed; the euro is firm around 1.16 despite the energy shock and has been a disinflationary force on goods\n              - The EU-US deal's 15% ceiling has removed the tariff tail risk; the larger medium-term threat is Chinese competition in autos, machinery and chemicals\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-ez-cr1\n            title: Banks are the transmission channel and are in good shape\n            text: |-\n              - Loan growth is modest but positive, banks are well capitalised and profitable on the steeper curve; higher policy rates pass through quickly to floating-rate mortgages in the south\n              - Commercial real estate remains the main pocket of stress, concentrated in Germany; no systemic read-through\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-ez-gd1\n            title: France is the euro area's sovereign risk\n            text: |-\n              - OAT-Bund spread near 85bp, 10-year OAT above 4.1% and the widest sustained premium since the euro crisis; the 2027 budget and the May 2027 presidential election are the catalysts, with Le Pen leading and markets doubting any candidate's appetite for consolidation\n              - Contagion has been limited because Italian fundamentals have improved; the risk is a rating cross-over that forces index-driven selling\n      - id: international\n        name: International\n        issues:\n          - id: iss-ez-gi1\n            title: Energy dependence in a Gulf war\n            text: |-\n              - Europe is the region most exposed to Hormuz: LNG and crude import bills are up sharply, and the fiscal cost of new energy relief measures is being added to already-stretched budgets\n              - Ukraine ceasefire scenarios still matter for gas prices and reconstruction demand; the defence build-up is now a permanent feature of the fiscal picture\nscenarios:\n  - id: growth\n    name: Growth\n    issues:\n      - id: iss-ez-sg1\n        title: Fiscal impulse versus energy drag\n        baseline: |-\n          - Growth 1.0-1.4% in 2027 as German spending ramps and energy prices ease gradually; consumption recovers modestly\n        upside: |-\n          - Hormuz normalises, the saving rate falls and German capex crowds in private investment; growth near 2% in 2027\n        downside: |-\n          - Oil above $100 through 2027, French politics tighten financial conditions, Chinese competition intensifies; growth back toward 0.5%\n  - id: inflation\n    name: Inflation\n    issues:\n      - id: iss-ez-si1\n        title: Headline versus ex-energy\n        baseline: |-\n          - Headline averages 3.0% in 2026 and 2.5% in 2027; ex-energy inflation stays close to 2.2-2.5% and wage growth keeps decelerating\n        upside: |-\n          - Energy relief brings headline below 2% by late 2027; the firm euro and Chinese goods prices push core toward 1.8%\n        downside: |-\n          - Second-round effects in 2027 wage rounds keep core above 2.5%; the ECB has to hike beyond 3%\n  - id: policy\n    name: Policy\n    issues:\n      - id: iss-ez-sp1\n        title: ECB path from 2.50%\n        baseline: |-\n          - One more hike at most, then a hold through mid-2027; cuts resume once ex-energy inflation is clearly at 2%\n        upside: |-\n          - Energy relief lets the ECB stop at 2.50% and cut back toward 2% in 2027; Bund curve bull-steepens\n        downside: |-\n          - Deposit rate to 3.25% or higher; TPI activated if French spreads gap wider around the election\n      - id: iss-ez-sp2\n        title: French fiscal and political path\n        baseline: |-\n          - The 2027 budget passes with difficulty, deficit stays near 5%, spread 75-95bp; the presidential election dominates 1H27\n        upside: |-\n          - A working fiscal majority passes a credible budget; spread compresses toward 60bp\n        downside: |-\n          - Budget fails, rating cross-over to single-A, spread above 120bp and contagion to the periphery\nimplications:\n  drivers/regime/trend-growth:\n    sales_growth: up\n    cash_rate: up\n    term_premium: up\n  drivers/regime/trend-inflation:\n    margin_growth: down\n    inflation_expectation: up\n    cash_rate: up\n  drivers/policy/monetary:\n    valuation: down\n    cash_rate: up\n    liquidity: down\n  drivers/policy/fiscal:\n    sales_growth: up\n    term_premium: up\n  drivers/imbalances/domestic:\n    sales_growth: down\n    dividend_yield: up\n  drivers/imbalances/external:\n    valuation: up\n    term_premium: down\n    inflation_expectation: down\n  drivers/imbalances/credit:\n    margin_growth: up\n    liquidity: up\n  drivers/geopolitics/domestic:\n    term_premium: up\n    valuation: down\n  drivers/geopolitics/international:\n    margin_growth: down\n    sales_growth: down\n    inflation_expectation: up\n  scenarios/growth:\n    sales_growth: up\n    margin_growth: up\n  scenarios/inflation:\n    inflation_expectation: up\n    cash_rate: up\n  scenarios/policy:\n    cash_rate: up\n    term_premium: up\n    valuation: down\n", "japan": "# Country Investment Thesis \u2014 Japan\n# Draft house view, September 2026. Edit through country-investment-thesis.html so changes are logged.\n\nid: japan\nname: Japan\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-jp-tg1\n            title: Reflation is real but the growth rate is not\n            text: |-\n              - Potential growth is still near 0.5%; what has changed is nominal: wages, prices and corporate pricing power have all moved, and corporate profits have stayed high through the tariff and energy shocks\n              - The Takaichi programme (economic security, defence above 2% of GDP, disaster resilience, a 17-field growth strategy) is a fiscal push rather than a supply-side reform; the multiplier is low in a full-employment economy\n              - Labour scarcity is the binding constraint; capex in automation and software is the one genuinely structural upside\n          - id: iss-jp-tg2\n            title: Corporate governance and capital return\n            text: |-\n              - Cross-shareholding unwinds, buybacks and activist pressure keep ROE rising; this is the equity story regardless of macro and is now in its fourth year\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-jp-ti1\n            title: The wage-price mechanism has held, now stress-tested by oil\n            text: |-\n              - Shunto outcomes have delivered a third year of strong base-pay rises; services inflation and rent are finally moving, which is the domestic anchor the BOJ wanted\n              - The Gulf war pushed headline inflation up through energy and food, exactly the import-driven inflation that squeezed real incomes in 2022-23; the yen's September rally is the offset\n              - We assume underlying inflation settles around 2% with two-sided risk, which is a regime change from the 2010s\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-jp-mo1\n            title: BOJ normalisation is proceeding, with political friction\n            text: |-\n              - Policy rate raised to 1.00% in June and widely expected to reach 1.25% at the September meeting, a 30-year high; the stated logic is upside inflation risk from oil and the weak yen\n              - The BOJ has said it will stop tapering JGB purchases from April 2027, holding monthly buying steady; the balance sheet is nonetheless down about 15% from its peak, the largest QT any G7 central bank has run\n              - Takaichi has pressed Ueda to buy more bonds if long yields rise disorderly and has appointed reflationist board members; independence is intact but the terminal rate debate (1.5% or 2%?) is now political\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-jp-fi1\n            title: Responsible and proactive, tested by the bond market\n            text: |-\n              - FY2026 budget a record \u00a5122tn with debt service up 11% on an assumed 3% rate; supplementary budgets and a possible food consumption-tax cut (up to \u00a55tn of revenue) are the pressure points\n              - Debt-to-GDP has been falling on nominal growth, which is the government's defence; the market's counter is the 30-year yield at record highs near 4% and a 10-year near 2.8-2.9%, the highest since 1996\n              - Watch: issuance mix (shorter maturities to placate lifers), any move on the consumption tax, and the FY2027 budget request\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-jp-do1\n            title: Real incomes and the household squeeze\n            text: |-\n              - Nominal wages are rising but real wages have oscillated around zero as food and energy inflation bit; consumption is soft and the political pressure for handouts and tax cuts comes from here\n              - Household portfolio shift from deposits into equities (NISA) is a slow structural positive for domestic asset demand\n      - id: external\n        name: External\n        issues:\n          - id: iss-jp-ex1\n            title: The yen and the great repatriation question\n            text: |-\n              - The yen traded near 155 for most of the year and then rallied sharply in September on carry-trade unwinds, expectations of capital repatriation and US political pressure for Japan to support the currency\n              - Japan is the largest foreign holder of Treasuries and a large holder of European credit; higher domestic yields and a stronger yen are the mechanism through which Japanese capital comes home, with global term-premium consequences\n          - id: iss-jp-ex2\n            title: Energy dependence and the US trade deal\n            text: |-\n              - Almost entirely dependent on imported hydrocarbons, much of it through Hormuz; the terms-of-trade hit is the largest among G7 economies\n              - The 2025 US deal (15% tariff, investment pledge) has held and Japan is inside the new 301 layer at the lower rate; auto exports to the US remain the exposed sector\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-jp-cr1\n            title: Duration risk has moved from banks to lifers and the sovereign\n            text: |-\n              - Banks have shortened duration and benefit from higher rates; life insurers and pension funds carry the super-long risk and have been reducing demand, which is why the 30-year sector has repriced most\n              - Regional banks with legacy JGB books are the weak link if yields overshoot\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-jp-gd1\n            title: Takaichi has a mandate and a bond-market constraint\n            text: |-\n              - The decisive general election win in early 2026 removed coalition arithmetic as a constraint; the government can spend, and the market rather than the Diet is now the check\n              - Populist tax relief (gasoline levies abolished, food VAT under discussion) is the path of least resistance ahead of the next upper-house cycle\n      - id: international\n        name: International\n        issues:\n          - id: iss-jp-gi1\n            title: Security spending and the China relationship\n            text: |-\n              - Defence and economic-security spending are structural and bipartisan; relations with Beijing are tense after the Taiwan remarks episode and Chinese trade measures, so supply-chain diversification carries a fiscal cost\n              - Alignment with the US on chips and export controls is complete; the exposure is to a US-China re-escalation that hits Japanese suppliers on both sides\nscenarios:\n  - id: growth\n    name: Growth\n    issues:\n      - id: iss-jp-sg1\n        title: Consumption recovery versus energy squeeze\n        baseline: |-\n          - Growth 0.7-1% in 2027 as real wages turn modestly positive and fiscal support flows; exports flat on tariffs and China weakness\n        upside: |-\n          - Energy normalises and a stronger yen restores real incomes; consumption and capex lift growth to 1.5%\n        downside: |-\n          - Oil stays above $100, the yen weakens again on fiscal concern and real incomes fall; growth near zero and a technical recession\n  - id: inflation\n    name: Inflation\n    issues:\n      - id: iss-jp-si1\n        title: Underlying inflation at 2%\n        baseline: |-\n          - Core inflation settles near 2% through 2027; the 2027 shunto delivers base-pay growth of 3% or more\n        upside: |-\n          - Services inflation and rents keep rising; underlying inflation runs 2.5% and the BOJ's terminal rate estimate moves up\n        downside: |-\n          - Yen strength and an energy reversal drag headline below 1.5%; the wage-price mechanism stalls and the BOJ pauses indefinitely\n  - id: policy\n    name: Policy\n    issues:\n      - id: iss-jp-sp1\n        title: BOJ path from 1.00-1.25%\n        baseline: |-\n          - Hikes to 1.25% in September and 1.50% by mid-2027, then a pause near the lower end of neutral estimates; JGB taper halted from April 2027\n        upside: |-\n          - Terminal rate revised to 2% with orderly curve; yen appreciates gradually and lifers return to super-longs\n        downside: |-\n          - A disorderly super-long sell-off forces the BOJ into yield-curve intervention under political pressure; credibility and the yen both suffer\n      - id: iss-jp-sp2\n        title: Fiscal credibility\n        baseline: |-\n          - Supplementary budgets continue, a partial food tax cut is enacted, 10-year yield 2.5-3%; debt ratio roughly stable on nominal growth\n        upside: |-\n          - Spending restraint and primary-balance progress; 30-year yields fall back below 3.5%\n        downside: |-\n          - Large consumption-tax cut plus defence overshoot; 30-year above 4.5%, rating pressure and a fiscal-dominance debate\nimplications:\n  drivers/regime/trend-growth:\n    margin_growth: up\n    dividend_yield: up\n    cash_rate: up\n  drivers/regime/trend-inflation:\n    inflation_expectation: up\n    cash_rate: up\n    valuation: down\n  drivers/policy/monetary:\n    cash_rate: up\n    term_premium: up\n    valuation: down\n    liquidity: down\n  drivers/policy/fiscal:\n    sales_growth: up\n    term_premium: up\n  drivers/imbalances/domestic:\n    sales_growth: down\n    valuation: up\n  drivers/imbalances/external:\n    margin_growth: down\n    term_premium: up\n  drivers/imbalances/credit:\n    term_premium: up\n    liquidity: down\n  drivers/geopolitics/domestic:\n    sales_growth: up\n    term_premium: up\n  drivers/geopolitics/international:\n    margin_growth: down\n    inflation_expectation: up\n  scenarios/growth:\n    sales_growth: up\n    margin_growth: down\n  scenarios/inflation:\n    inflation_expectation: up\n    cash_rate: up\n  scenarios/policy:\n    cash_rate: up\n    term_premium: up\n    valuation: down\n", "united-kingdom": "# Country Investment Thesis \u2014 United Kingdom\n# Draft house view, September 2026. Edit through country-investment-thesis.html so changes are logged.\n\nid: united-kingdom\nname: United Kingdom\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-uk-tg1\n            title: Stagnation with a loosening labour market\n            text: |-\n              - Growth has been near 1% for three years; unemployment has drifted up to 5.2% as employer payroll-tax rises and minimum-wage increases bit, and hiring has stalled\n              - Productivity is flat and public investment plans are back-loaded; the planning and infrastructure reforms are the only credible supply-side lever and they pay off late in the decade\n              - Our assumption: trend growth 1-1.25%, with the labour-market slack building faster than the Bank expected\n          - id: iss-uk-tg2\n            title: Energy-price exposure is structural\n            text: |-\n              - The UK sets electricity prices off gas at the margin and is a net importer; the 2026 Gulf shock has flowed straight through Ofgem price caps into the CPI and into industrial costs\n              - Two cap increases in 2026 (July and October) are why the Bank sees inflation peaking in Q4 rather than Q2\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-uk-ti1\n            title: Inflation was at target, then energy intervened\n            text: |-\n              - CPI 2.9% in July with core at 2.6% and services at 3.4%; before the war the Bank expected 2% from April, and now projects a peak around 3.2% in Q4 2026 with risks to the upside\n              - Underlying disinflation has continued: pay growth is slowing with the loosening labour market, and food inflation is the lowest since 2021; the question is whether households' elevated short-term expectations feed 2027 pay rounds\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-uk-mo1\n            title: MPC split and leaning hawkish\n            text: |-\n              - Bank Rate 3.75% since December; the committee moved from a 5-4 vote with four wanting cuts in February to a 6-3 vote with three wanting hikes in July, purely on the energy shock\n              - Markets price one or two hikes; the Bank's own framing is that policy cannot influence energy prices but must ensure the adjustment happens with inflation returning to target, which is a hold with a hiking bias\n              - Watch: the September 17 decision and the QT annual decision on gilt sales, which has fiscal consequences\n          - id: iss-uk-mo2\n            title: QT and the gilt supply overhang\n            text: |-\n              - Active gilt sales plus record DMO issuance have kept long gilt yields among the highest in the G7; the Bank has been shifting sales toward shorter maturities to relieve the long end\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-uk-fi1\n            title: No fiscal room, and a government tempted to spend\n            text: |-\n              - Headroom against the fiscal rules is thin; the 2025 budget raised taxes and the OBR pushed borrowing up; energy-support demands and a weak political position push the other way\n              - The autumn 2026 budget is the test: further tax rises would hit growth, loosening would hit gilts; markets fear a leadership change toward a higher-spending chancellor more than they fear Reeves\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-uk-do1\n            title: High saving rate and a housing market on the turn\n            text: |-\n              - Household saving rate is elevated and consumer confidence weak; the mortgage refinancing wave has largely passed, but a housing market that had started recovering is now facing higher gilt-driven mortgage rates again\n      - id: external\n        name: External\n        issues:\n          - id: iss-uk-ex1\n            title: Current-account deficit financed by kindness of strangers\n            text: |-\n              - The UK runs a persistent deficit near 3% of GDP and depends on portfolio inflows; sterling has been stable but gilts are the pressure valve whenever politics or fiscal credibility wobbles\n              - Trade: the US deal (10% baseline, 25% on steel rather than 50%) has held; the EU reset is incremental\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-uk-cr1\n            title: Banks strong, non-bank leverage the watch item\n            text: |-\n              - Banks are well capitalised and profitable; the 2022 LDI episode and the pension-fund shift out of gilts remain the template for how a gilt sell-off transmits, and the Bank now has a standing repo facility for that purpose\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-uk-gd1\n            title: A weak government and a populist opposition\n            text: |-\n              - Starmer's authority has been eroded by the Mandelson affair, by-election losses to Greens and Reform, and internal calls to step down; Reform UK leads polls with a platform that markets read as fiscally expansionary\n              - The next general election is not due until 2029, but a leadership change or a shift to spending-led politics is the gilt market's main political risk\n      - id: international\n        name: International\n        issues:\n          - id: iss-uk-gi1\n            title: Energy security and defence\n            text: |-\n              - North Sea decline, LNG dependence and the Gulf war have put energy security back at the centre of policy; defence spending toward 3% of GDP is another claim on a budget with no room\n              - Closer EU alignment on defence and energy is the direction of travel, but slower than the market would like\nscenarios:\n  - id: growth\n    name: Growth\n    issues:\n      - id: iss-uk-sg1\n        title: Consumer and labour market\n        baseline: |-\n          - Growth around 1% in 2027; unemployment peaks near 5.5%; real incomes flat as energy prices ease slowly\n        upside: |-\n          - Energy relief and lower gilt yields support housing and consumption; growth 1.5-2% and unemployment stabilises\n        downside: |-\n          - Energy shock persists, tax rises in the autumn budget and rising unemployment tip the economy into recession; unemployment above 6%\n  - id: inflation\n    name: Inflation\n    issues:\n      - id: iss-uk-si1\n        title: Energy pass-through and pay\n        baseline: |-\n          - CPI peaks near 3.2% in Q4 2026 and returns toward 2.5% by end-2027; services inflation keeps easing with the labour market\n        upside: |-\n          - Energy normalises and services inflation falls below 3%; CPI back at 2% by mid-2027\n        downside: |-\n          - Second Ofgem cap increase plus renewed wage push keep CPI above 3.5%; expectations de-anchor and the Bank has to hike twice or more\n  - id: policy\n    name: Policy\n    issues:\n      - id: iss-uk-sp1\n        title: Bank Rate path from 3.75%\n        baseline: |-\n          - One insurance hike to 4% or an extended hold; cuts resume in 2H27 as slack builds\n        upside: |-\n          - No hikes, cuts to 3.25% by end-2027 as inflation falls back with energy; gilt curve rallies\n        downside: |-\n          - Two or three hikes into a weakening economy, then a sharp reversal; policy error debate and curve volatility\n      - id: iss-uk-sp2\n        title: Fiscal and gilts\n        baseline: |-\n          - Autumn budget balances modest tax rises and energy support; 10-year gilt 4.25-4.75%; headroom stays thin\n        upside: |-\n          - Credible medium-term consolidation and lower issuance; 10-year gilt back below 4%\n        downside: |-\n          - Leadership change or a loosened fiscal rule; 10-year above 5%, sterling under pressure and an LDI-style liquidity episode\nimplications:\n  drivers/regime/trend-growth:\n    sales_growth: down\n    cash_rate: down\n  drivers/regime/trend-inflation:\n    inflation_expectation: up\n    cash_rate: up\n    margin_growth: down\n  drivers/policy/monetary:\n    cash_rate: up\n    valuation: down\n  drivers/policy/fiscal:\n    term_premium: up\n    sales_growth: down\n  drivers/imbalances/domestic:\n    sales_growth: down\n    dividend_yield: up\n  drivers/imbalances/external:\n    term_premium: up\n    valuation: down\n  drivers/imbalances/credit:\n    liquidity: down\n  drivers/geopolitics/domestic:\n    term_premium: up\n    valuation: down\n  drivers/geopolitics/international:\n    margin_growth: down\n    inflation_expectation: up\n  scenarios/growth:\n    sales_growth: down\n    cash_rate: down\n  scenarios/inflation:\n    inflation_expectation: up\n    cash_rate: up\n  scenarios/policy:\n    term_premium: up\n    valuation: down\n", "india": "# Country Investment Thesis \u2014 India\n# Draft house view, September 2026. Edit through country-investment-thesis.html so changes are logged.\n\nid: india\nname: India\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-in-tg1\n            title: The fastest large economy, now stress-tested by oil\n            text: |-\n              - Growth ran near 7-8% through FY26 on public capex, the GST rate cut and a consumption rebound; the RBI has FY27 at 6.7% and Q1 manufacturing and discretionary spending were strong\n              - India is the large economy most exposed to Hormuz after Japan: Gulf crude, LNG, and remittances and diaspora employment in the GCC; the shock arrived just as the private capex cycle was turning up\n              - Our assumption: trend growth 6.5% with two-sided risk; the productivity story (digital public infrastructure, formalisation, manufacturing incentives) is intact but the external account is the constraint again\n          - id: iss-in-tg2\n            title: Private capex and the manufacturing push\n            text: |-\n              - Corporate balance sheets are clean and capacity utilisation high; the interim US trade agreement (in force since February) has reopened the export channel after the punitive 2025 tariffs\n              - Electronics assembly and pharma are scaling; the constraint is land, logistics and state-level execution rather than demand\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-in-ti1\n            title: From record-low inflation to an energy shock\n            text: |-\n              - Headline inflation fell to 1-2% in late 2025 on food; the RBI now projects 5.0% for FY27 with core near 4.3%, so the whole move is fuel and pass-through\n              - Food remains the swing factor: monsoon outcomes and vegetable prices dominate the headline, and the RBI is learning to look through them\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-in-mo1\n            title: RBI on hold at 5.25%, defending the rupee with the wider toolkit\n            text: |-\n              - After 125bp of cuts in 2025 the RBI has held at 5.25% with a neutral stance through 2026; the August vote was unanimous and Governor Malhotra wants a clearer inflation signal before moving either way\n              - The rupee has weakened beyond 95 per dollar and the RBI has chosen FX swaps, reserve sales and liquidity tools over a defensive hike; that is the right call as long as inflation expectations hold\n              - Watch: core inflation above 4.5%, further rupee depreciation, and the liquidity stance (OMOs and swaps) which is doing more work than the policy rate\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-in-fi1\n            title: Consolidation on a debt anchor, with an oil bill\n            text: |-\n              - The centre has shifted from a deficit target to a debt-to-GDP anchor; FY27 budget keeps capex high and the deficit near 4.3-4.5% of GDP\n              - Fuel subsidies and excise cuts to cushion the oil shock are the fiscal risk; states are the softer link on revenue and welfare spending\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-in-do1\n            title: Household credit and the K-shaped consumer\n            text: |-\n              - Urban middle-class consumption is running on credit (unsecured personal loans, cards) while rural demand has recovered on good monsoons and food-price relief\n              - The GST cut lifted mass consumption in 2H25; the oil shock is now eroding real incomes at the bottom\n      - id: external\n        name: External\n        issues:\n          - id: iss-in-ex1\n            title: The current account is the pressure point again\n            text: |-\n              - Oil at $90-100 pushes the current-account deficit toward 1.5-2% of GDP; services exports and remittances remain strong but portfolio flows have been volatile and FDI net of repatriation is weak\n              - Reserves are ample but the RBI has spent them; the rupee's depreciation is orderly so far, which is the objective\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-in-cr1\n            title: Banks are healthy, NBFCs and unsecured retail are the watch item\n            text: |-\n              - Bank NPAs are at multi-decade lows and capital is strong; the RBI tightened risk weights on unsecured retail and NBFC lending in 2024-25 and asset quality in small-ticket loans is deteriorating at the margin\n              - Credit growth has slowed to the low teens, which is healthy; deposit growth is the constraint on banks\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-in-gd1\n            title: Reform momentum with state-election noise\n            text: |-\n              - The GST overhaul, labour codes and the new income-tax framework show the coalition can still legislate; the 2026-27 state election cycle (including large states) will bring welfare spending and pauses in reform\n      - id: international\n        name: International\n        issues:\n          - id: iss-in-gi1\n            title: Managing the US, Russia and the Gulf at once\n            text: |-\n              - The interim trade agreement with the US removed the 2025 tariff penalty tied to Russian oil purchases; India now sits at the standard Section 301 rate and keeps buying discounted Russian crude, which has been a buffer in the Gulf shock\n              - The Gulf war is a direct security and energy issue (shipping, diaspora, Chabahar); relations with China have thawed at the margin, and border stability is being bought with trade openness\nscenarios:\n  - id: growth\n    name: Growth\n    issues:\n      - id: iss-in-sg1\n        title: Domestic demand under the oil shock\n        baseline: |-\n          - FY27 growth 6.5% as public capex and the consumption tax cut offset the energy drag; private capex continues at a moderate pace\n        upside: |-\n          - Hormuz normalises, oil back below $75; consumption and private capex lift growth above 7% with the current account back near 1% of GDP\n        downside: |-\n          - Oil above $100 through 2027; current-account deficit above 2.5%, rupee overshoots, RBI forced to hike and growth falls below 5.5%\n  - id: inflation\n    name: Inflation\n    issues:\n      - id: iss-in-si1\n        title: Energy pass-through versus food\n        baseline: |-\n          - Headline 4.5-5% in FY27, core 4-4.5%; food benign on a normal monsoon\n        upside: |-\n          - Energy relief and a strong monsoon bring headline back to 3.5-4%; the RBI can resume cutting\n        downside: |-\n          - Fuel pass-through plus a weak monsoon push headline above 6% and core above 5%; expectations rise and the RBI hikes 50-75bp\n  - id: policy\n    name: Policy\n    issues:\n      - id: iss-in-sp1\n        title: RBI path from 5.25%\n        baseline: |-\n          - On hold through FY27 with liquidity and FX tools doing the work; rupee drifts to 96-98\n        upside: |-\n          - Two cuts to 4.75% in 2027 as inflation returns to 4% and the current account narrows; rupee stabilises below 95\n        downside: |-\n          - Defensive hikes to 6% to stop a rupee run; growth and credit slow sharply\nimplications:\n  drivers/regime/trend-growth:\n    sales_growth: up\n    margin_growth: down\n    cash_rate: up\n  drivers/regime/trend-inflation:\n    inflation_expectation: up\n    cash_rate: up\n  drivers/policy/monetary:\n    cash_rate: up\n    liquidity: down\n    valuation: down\n  drivers/policy/fiscal:\n    sales_growth: up\n    term_premium: up\n  drivers/imbalances/domestic:\n    sales_growth: up\n    margin_growth: down\n  drivers/imbalances/external:\n    valuation: down\n    term_premium: up\n    inflation_expectation: up\n  drivers/imbalances/credit:\n    liquidity: down\n  drivers/geopolitics/domestic:\n    sales_growth: up\n    valuation: up\n  drivers/geopolitics/international:\n    margin_growth: down\n    inflation_expectation: up\n  scenarios/growth:\n    sales_growth: up\n    valuation: down\n  scenarios/inflation:\n    inflation_expectation: up\n    cash_rate: up\n  scenarios/policy:\n    cash_rate: up\n    liquidity: down\n", "brazil": "# Country Investment Thesis \u2014 Brazil\n# Draft house view, September 2026. Edit through country-investment-thesis.html so changes are logged.\n\nid: brazil\nname: Brazil\nversion: 2\nupdated_at: \"2026-09-13T12:00:00+08:00\"\nupdated_by: draft\ndrivers:\n  - id: regime\n    name: Regime\n    subsections:\n      - id: trend-growth\n        name: Trend growth\n        issues:\n          - id: iss-br-tg1\n            title: Decelerating into the election on a 10% real rate\n            text: |-\n              - Growth has slowed from above 3% in 2023-24 toward about 1.9% in 2026; Q2 came in near flat as the lagged effect of a 15% Selic and tighter credit bit\n              - Potential growth is around 2% with a tight labour market; the cycle is being driven by monetary policy and fiscal transfers pulling in opposite directions\n          - id: iss-br-tg2\n            title: Commodity terms of trade in a Gulf war\n            text: |-\n              - Brazil is a net oil exporter and a food and iron-ore exporter into a Chinese economy that is slowing; the 2026 oil shock is a net positive for the external accounts and Petrobras but a negative for inflation and the consumer\n              - Agricultural exports have benefited from China's redirection away from US suppliers\n      - id: trend-inflation\n        name: Trend inflation\n        issues:\n          - id: iss-br-ti1\n            title: Inflation above the band despite record-high rates\n            text: |-\n              - IPCA expectations for 2026 sit near 5%, above the 4.5% ceiling of the 3% target band, and 2027 near 4.2%; core has slowed to just below the ceiling\n              - The problem is fiscal-monetary: expansionary fiscal policy (income-tax exemption, transfers, new federal hiring) plus a tight labour market keep services inflation sticky; the BRL is the transmission channel to headline\n  - id: policy\n    name: Policy\n    subsections:\n      - id: monetary\n        name: Monetary\n        issues:\n          - id: iss-br-mo1\n            title: Copom easing cautiously from 15%\n            text: |-\n              - Selic at 14.00% after four consecutive 25bp cuts (unanimous in August), with the committee refusing to pre-commit to more while headline is above the band; the Focus survey sees 13.75% at year-end and 12% at end-2027\n              - Gal\u00edpolo has established credibility (275bp of hikes in his first year, then a slow easing) under a government that wants faster cuts; the election is the test of whether the reaction function survives\n              - Watch: the September meeting, fiscal news that pushes rate expectations up rather than down, and any change to the BCB's inflation-target or governance framework after the election\n      - id: fiscal\n        name: Fiscal\n        issues:\n          - id: iss-br-fi1\n            title: The fiscal framework is bending in an election year\n            text: |-\n              - Gross debt near 82% of GDP and rising, nominal deficit near 8% of GDP with debt service around R$1tn; the primary target is being met on accounting rather than structural adjustment\n              - The 2026 election-year package (transfers, tax exemption up to R$5k, hiring) adds demand; the next government's first budget is what markets are pricing\n  - id: imbalances\n    name: Imbalances\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-br-do1\n            title: Household leverage at the top of the cycle\n            text: |-\n              - Household debt-service ratios are at record highs; the expansion of payroll-deducted credit to private-sector workers in 2025 pushed leverage further just as rates peaked\n              - Delinquencies are rising in unsecured credit; consumption is being sustained by transfers and a strong labour market rather than balance sheets\n      - id: external\n        name: External\n        issues:\n          - id: iss-br-ex1\n            title: Comfortable external accounts, volatile currency\n            text: |-\n              - Current-account deficit around 2-3% of GDP financed by FDI; reserves ample; the real has traded around 5.2-5.5 per dollar with a 10% real rate providing carry support\n              - The 25% US Section 301 tariff on Brazilian goods (after the IEEPA measures fell) is a nuisance more than a macro event; trade is redirected to China and Europe\n      - id: credit\n        name: Credit\n        issues:\n          - id: iss-br-cr1\n            title: Credit cycle turning at record-high rates\n            text: |-\n              - Bank credit growth has slowed to the mid-single digits in real terms; NPLs are rising from a low base in retail and small-business books\n              - Public banks (BNDES, Caixa) are again being used for directed credit, which blunts monetary transmission and adds fiscal risk\n  - id: geopolitics\n    name: Geopolitics\n    subsections:\n      - id: domestic\n        name: Domestic\n        issues:\n          - id: iss-br-gd1\n            title: October election is the single biggest driver\n            text: |-\n              - Lula is running for re-election on the economy just as growth decelerates; polls show him competitive but the centre-right opposition is consolidating, and his age and health add tail risk\n              - A market-friendly outcome would compress real rates and spreads quickly; a Lula win with a weak Congress means more of the same fiscal drift and a slower easing cycle\n      - id: international\n        name: International\n        issues:\n          - id: iss-br-gi1\n            title: Between Washington and Beijing\n            text: |-\n              - The Lula-Trump relationship stabilised after the 2025 tariff episode; Brazil is a beneficiary of China's diversification away from US agriculture and of Gulf-shock oil prices\n              - Brazil's own tariffs on Chinese steel and autos show the backlash is global; Mercosur-EU implementation is the medium-term trade upside\nscenarios:\n  - id: growth\n    name: Growth\n    issues:\n      - id: iss-br-sg1\n        title: Election-year economy\n        baseline: |-\n          - Growth 1.5-2% in 2026 and 1.5% in 2027; unemployment low, consumption sustained by transfers, investment weak on high real rates\n        upside: |-\n          - Market-friendly election outcome and credible fiscal plan; real rates fall fast, capex recovers, growth back toward 2.5-3% in 2027\n        downside: |-\n          - Fiscal drift continues, the BRL sells off and Copom stops easing; growth below 1% with rising unemployment\n  - id: inflation\n    name: Inflation\n    issues:\n      - id: iss-br-si1\n        title: Back inside the band\n        baseline: |-\n          - IPCA near 5% in 2026 easing to about 4.2% in 2027; services inflation sticky, food and fuel volatile\n        upside: |-\n          - BRL appreciation on a market-friendly outcome and easing food prices bring IPCA toward 3.5% in 2027\n        downside: |-\n          - Fiscal loosening and a weaker real push IPCA back toward 6% and expectations de-anchor further\n  - id: policy\n    name: Policy\n    issues:\n      - id: iss-br-sp1\n        title: Selic path from 14%\n        baseline: |-\n          - One more cut to 13.75% in 2026, then 12% by end-2027 as inflation edges back into the band; real rate stays near 8-9%\n        upside: |-\n          - Post-election credibility allows cuts to 10-11% by end-2027; curve bull-flattens and the real rallies toward 4.8\n        downside: |-\n          - Easing halted or reversed; questions over central-bank independence after the election; Selic back above 15%\nimplications:\n  drivers/regime/trend-growth:\n    sales_growth: down\n    cash_rate: down\n  drivers/regime/trend-inflation:\n    inflation_expectation: up\n    cash_rate: up\n    valuation: down\n  drivers/policy/monetary:\n    cash_rate: down\n    valuation: up const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p) => p + '-' + Math.random().toString(36).slice(2, 8);

const nowIso = () => {

  const p = (n) => String(Math.abs(n)).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + sign + p(Math.floor(Math.abs(tz) / 60)) + ':' + p(Math.abs(tz) % 60);
};
const fmtTime = (iso) => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };

/* Render bullet text: lines starting with "- " become list items, two-space indent nests. **bold** supported. */
function renderRich(text) {
  if (!text || !text.trim()) return '<p class="empty">Nothing entered yet.</p>';
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const out = [];
  let level = 0, liOpen = false;
  const closeLi = () => { if (liOpen) { out.push('</li>'); liOpen = false; } };
  const closeTo = (lvl) => { closeLi(); while (level > lvl) { out.push('</ul>'); level--; if (level > 0) { liOpen = true; closeLi(); } } };
  for (const line of text.split('\n')) {
    const m = line.match(/^(\s*)-\s+(.*)$/);
    if (m) {
      const lvl = Math.min(Math.floor(m[1].length / 2) + 1, level + 1);
      if (lvl > level) { out.push('<ul>'); level++; }
      else closeTo(lvl);
      out.push('<li>' + inline(m[2])); liOpen = true;
    } else if (line.trim() !== '') { closeTo(0); out.push('<p>' + inline(line) + '</p>'); }
  }
  closeTo(0);
  return '<div class="rich">' + out.join('') + '</div>';
}

/* ---------------- data scaffolding ---------------- */
function emptyEconomy(eco) {
  return {
    id: eco.id, name: eco.name, version: 0, updated_at: null, updated_by: null,
    drivers: DRIVER_TEMPLATE.map(d => ({ id: d.id, name: d.name, subsections: d.subsections.map(([id, name]) => ({ id, name, issues: [] })) })),
    scenarios: SCENARIO_TEMPLATE.map(([id, name]) => ({ id, name, issues: [] })),
    implications: {},
  };
}
function normalise(eco, raw) {
  const base = emptyEconomy(eco);
  if (!raw || typeof raw !== 'object') return base;
  const out = { ...base, ...raw };
  out.id = eco.id; out.name = eco.name;
  out.version = Number(out.version) || 0;
  const text = (v) => (v == null ? '' : String(v));
  const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v);
  const list = (v) => (Array.isArray(v) ? v.filter(isObj) : []);
  out.drivers = list(out.drivers);
  if (!out.drivers.length) out.drivers = base.drivers;
  out.drivers.forEach((d, n) => {
    d.id = text(d.id) || 'driver-' + (n + 1);
    const t = DRIVER_TEMPLATE.find(x => x.id === d.id);
    d.name = text(d.name) || (t ? t.name : d.id);
    d.subsections = list(d.subsections);
    d.subsections.forEach((s, m) => { s.id = text(s.id) || 'sub-' + (m + 1); s.name = text(s.name) || ((t && t.subsections.find(([id]) => id === s.id)) || [])[1] || ''; s.issues = list(s.issues); for (const i of s.issues) { i.id = text(i.id) || uid('iss'); i.title = text(i.title); i.text = text(i.text); } });
  });
  out.scenarios = list(out.scenarios);
  if (!out.scenarios.length) out.scenarios = base.scenarios;
  out.scenarios.forEach((c, n) => { c.id = text(c.id) || 'cat-' + (n + 1); c.name = text(c.name) || (SCENARIO_TEMPLATE.find(([id]) => id === c.id) || [])[1] || ''; c.issues = list(c.issues); for (const i of c.issues) { i.id = text(i.id) || uid('iss'); i.title = text(i.title); for (const k of SCENARIO_COLS) i[k] = text(i[k]); } });
  out.implications = {};
  if (isObj(raw.implications)) for (const [key, cells] of Object.entries(raw.implications)) if (isObj(cells)) { const row = {}; for (const [f, v] of Object.entries(cells)) if (v === 'up' || v === 'down') row[f] = v; if (Object.keys(row).length) out.implications[key] = row; }
  return out;
}
function rowKeys(eco) {
  const rows = [];
  for (const d of eco.drivers) for (const s of d.subsections) rows.push({ key: `drivers/${d.id}/${s.id}`, group: d.name, name: s.name });
  for (const c of eco.scenarios) rows.push({ key: `scenarios/${c.id}`, group: 'Scenarios & signposts', name: c.name });
  return rows;
}

function safeGet(k) { try { return localStorage.getItem('economy-views:' + k); } catch (e) { return null; } }

async function connectFolder() {

async function loadAll() {
  let cfgText = null;
  try { cfgText = await Store.readText('config.yaml'); } catch (e) { /* optional */ }
  if (cfgText) {
    try { const cfg = YAML.parse(cfgText); if (cfg && Array.isArray(cfg.economies) && cfg.economies.length) S.config = { ...S.config, ...cfg }; }
    catch (e) { toast('config.yaml could not be read; using defaults'); }

async function loadEconomy(eco) {

  let raw = null;
  if (text && text.trim()) { try { raw = YAML.parse(text); } catch (e) { toast(`${eco.name}: data file could not be parsed — ${e.message}`); } }
  S.data[eco.id] = normalise(eco, raw);
  S.loadedText[eco.id] = text || '';
}
async function exportSnapshot() {
  if (!Store.connected) return;
  try {
    let name = decodeURIComponent(location.pathname.split('/').pop());
    let src = await Store.readText(name);
    if (src == null && name !== 'country-investment-thesis.html') {
      name = 'country-investment-thesis.html';
      src = await Store.readText(name);
    }
    if (src == null) {
      dialog('Could not export snapshot', `<p>Could not read <code>${esc(name)}</code> from the connected folder.</p>`, [['Close']]);
      return;
    }
    const today = new Date(), pad = (n) => String(n).padStart(2, '0');
    const defaultName = `${name.replace(/\.html$/, '')}-${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}.html`;
    const outName = await promptSnapshotName(defaultName);
    if (!outName) return;
    if (outName.toLowerCase() === name.toLowerCase()) {
      dialog('Could not export snapshot', '<p>That is the name of the live source file — choose a different name so it is not overwritten.</p>', [['Close']]);
      return;
    }
    const yamlById = {};
    for (const eco of S.config.economies) {
      const text = await Store.readText(`data/${eco.id}.yaml`);
      if (text != null) yamlById[eco.id] = text;
    }
    let sawDemoYaml = false;
    src = src.replace(/const DEMO_YAML = [^\r\n]*;/, () => { sawDemoYaml = true; return `const DEMO_YAML = ${JSON.stringify(yamlById)};`; });
    if (!sawDemoYaml) {
      dialog('Could not export snapshot', '<p>Could not find the <code>DEMO_YAML</code> constant in the source file.</p>', [['Close']]);
      return;
    }
    let sawSnapshotAt = false;
    src = src.replace(/const SNAPSHOT_AT = [^\r\n]*;/, () => { sawSnapshotAt = true; return `const SNAPSHOT_AT = ${JSON.stringify(nowIso())};`; });
    if (!sawSnapshotAt) {
      dialog('Could not export snapshot', '<p>Could not find the <code>SNAPSHOT_AT</code> constant in the source file.</p>', [['Close']]);
      return;
    }
    await Store.writeText(outName, src);
    toast('Exported ' + outName);
  } catch (e) {
    dialog('Could not export snapshot', '<p>' + esc(e.message || e) + '</p>', [['Close']]);
  }
}
async function promptSnapshotName(defaultName) {
  const p = dialog('Export snapshot', `<p>Saves a self-contained, read-only copy of the team's current views into this folder.</p><div class="field"><label>File name</label><input type="text" id="dlg-input" placeholder="${esc(defaultName)}"></div>`, [['Cancel', 'quiet'], ['Export', 'primary']]);
  const inp = $('dlg-input'); inp.focus();
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('dlg-actions').querySelector('[data-i="1"]').click(); });
  if (await p !== 1) return null;
  let out = inp.value.trim() || defaultName;
  out = out.split(/[\\/]+/).pop();
  if (!/\.html$/i.test(out)) out += '.html';
  return out;
}

/* ---------------- fallback (no File System Access API) ---------------- */
function fallbackOpen() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true; inp.accept = '.yaml,.yml';
  inp.onchange = async () => {
    for (const f of inp.files) {
      const text = await f.text();
      const id = f.name.replace(/\.ya?ml$/, '');
      if (id === 'config') { try { const cfg = YAML.parse(text); if (cfg && Array.isArray(cfg.economies) && cfg.economies.length) S.config = { ...S.config, ...cfg }; } catch (e) { toast('config.yaml unreadable'); } continue; }
      const eco = S.config.economies.find(e => e.id === id);
      if (!eco) { toast('Skipped ' + f.name + ': not a known economy'); continue; }
      try { S.data[id] = normalise(eco, YAML.parse(text)); S.loadedText[id] = text; } catch (e) { toast(f.name + ': ' + e.message); }
    }
    S.demo = false;
    if (!S.config.economies.find(e => e.id === S.current)) S.current = S.config.economies[0].id;
    for (const eco of S.config.economies) if (!S.data[eco.id]) S.data[eco.id] = normalise(eco, null);
    setStatus('warn', 'Files opened manually');
    render();
  };
  inp.click();
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/yaml' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  }));

    else if (a === 'del-issue') { confirmDlg('Remove this issue?', () => { D.drivers[d].subsections[s].issues.splice(i, 1); render(); }); }
    else if (a === 'move-issue') { const arr = D.drivers[d].subsections[s].issues, j = i + (+b.dataset.dir); if (j >= 0 && j < arr.length) { [arr[i], arr[j]] = [arr[j], arr[i]]; render(); } }
    else if (a === 'add-sub') { promptDlg('New subsection under ' + D.drivers[d].name, 'Subsection name', (name) => { const id = slug(name) + '-' + Math.random().toString(36).slice(2, 6); D.drivers[d].subsections.push({ id, name, issues: [] }); S.subTab[S.current + '/' + D.drivers[d].id] = id; render(); }); }
    else if (a === 'move-sub') { const arr = D.drivers[d].subsections, j = s + (+b.dataset.dir); if (j >= 0 && j < arr.length) { [arr[s], arr[j]] = [arr[j], arr[s]]; S.subTab[S.current + '/' + D.drivers[d].id] = arr[j].id; render(); } }
    else if (a === 'del-sub') { confirmDlg('Remove this subsection and all its issues?', () => { const sub = D.drivers[d].subsections.splice(s, 1)[0]; delete D.implications[`drivers/${D.drivers[d].id}/${sub.id}`]; delete S.subTab[S.current + '/' + D.drivers[d].id]; render(); }); }
    else if (a === 'add-scen') { D.scenarios[c].issues.push({ id: uid('iss'), title: '', baseline: '', upside: '', downside: '' }); render(); focusLast('[data-sbind="title"]'); }
    else if (a === 'del-scen') { confirmDlg('Remove this signpost?', () => { D.scenarios[c].issues.splice(i, 1); render(); }); }
    else if (a === 'move-scen') { const arr = D.scenarios[c].issues, j = i + (+b.dataset.dir); if (j >= 0 && j < arr.length) { [arr[i], arr[j]] = [arr[j], arr[i]]; render(); } }
    else if (a === 'add-cat') { promptDlg('New scenario category', 'Category name', (name) => { D.scenarios.push({ id: slug(name) + '-' + Math.random().toString(36).slice(2, 6), name, issues: [] }); render(); }); }
    else if (a === 'del-cat') { confirmDlg('Remove this category and all its signposts?', () => { const cat = D.scenarios.splice(c, 1)[0]; delete D.implications[`scenarios/${cat.id}`]; render(); }); }
    else if (a === 'cycle') {

}
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.max(72, el.scrollHeight + 2) + 'px'; }

/* ---------- dialogs ---------- */
function dialog(title, bodyHtml, buttons) {

  $('dlg-actions').innerHTML = buttons.map(([label, cls], i) => `<button type="button" class="btn ${cls || ''}" data-i="${i}">${esc(label)}</button>`).join('');

  const p = dialog('Your name', `<p>Recorded in the change log against every save you make.</p><div class="field"><input type="text" id="dlg-input" value="${esc(S.author)}"></div>`, [['Cancel', 'quiet'], ['Save', 'primary']]);

/* ====================================================================
   Editing: lock, save, cancel
   ==================================================================== */
const lockPath = (id) => `locks/${id}.lock.yaml`;
async function readLock(id) {
  if (!Store.connected) return null;
  try { const t = await Store.readText(lockPath(id)); return t ? YAML.parse(t) : null; } catch (e) { return null; }
}
async function writeLock(id) {
  if (!Store.connected) return;
  const mins = Number(S.config.lock_minutes) || 30;
  const lock = { economy: id, by: S.author || 'unknown', since: S.lockSince || nowIso(), renewed: nowIso(), expires: new Date(Date.now() + mins * 60000).toISOString(), client: S.clientId };
  S.lockSince = lock.since;
  await Store.writeText(lockPath(id), YAML.dump(lock));
}
async function startEdit() {
  if (!S.author && !(await askAuthor())) { toast('Set your name first so the change log can record it'); return; }
  const id = S.current;
  const lock = await readLock(id);
  if (lock && lock.client !== S.clientId && lock.expires && new Date(lock.expires) > new Date()) {
    const r = await dialog(`${S.data[id].name} is being edited`, `<p><strong>${esc(lock.by)}</strong> started editing at ${esc(fmtTime(lock.since))}. Their lock expires ${esc(fmtTime(lock.expires))} unless renewed.</p><p>Taking over means both of you could save; the second save will be refused as a conflict.</p>`, [['Cancel', 'quiet'], ['Take over anyway', 'warn']]);
    if (r !== 1) return;
  }
  S.clientId = S.clientId || uid('client');
  S.lockSince = null;
  try { await writeLock(id); } catch (e) { toast('Could not write the lock file: ' + e.message); }
  S.lockTimer = setInterval(() => writeLock(id).catch(() => {}), LOCK_RENEW_MS);
  S.draft = clone(S.data[id]);
  render();
}
async function releaseLock(id) {
  clearInterval(S.lockTimer); S.lockTimer = null; S.lockSince = null;
  if (Store.connected) await Store.remove(lockPath(id));
}
async function cancelDraft() {
  const dirty = JSON.stringify(S.draft) !== JSON.stringify(S.data[S.current]);
  if (dirty && await dialog('Discard your changes?', '', [['Keep editing', 'quiet'], ['Discard', 'primary']]) !== 1) return;
  await releaseLock(S.current);
  S.draft = null; render();
}
function validate(D) {
  const problems = [];
  D.drivers.forEach((d, di) => d.subsections.forEach((s, si) => { if (!s.name.trim()) problems.push(`A subsection under ${d.name} has no name`); s.issues.forEach((i, ii) => { if (!i.title.trim()) problems.push(`${d.name} › ${s.name}: issue ${ii + 1} has no title`); }); }));
  D.scenarios.forEach((c, ci) => { if (!c.name.trim()) problems.push('A scenario category has no name'); c.issues.forEach((i, ii) => {
    if (!i.title.trim()) problems.push(`${c.name}: signpost ${ii + 1} has no title`);
    for (const k of SCENARIO_COLS) if (!i[k].trim()) { problems.push(`${c.name} › ${i.title || 'signpost ' + (ii + 1)}: ${k} is empty (all three scenarios are required)`); markInvalid(ci, ii, k); }
  }); });
  return problems;
}
function markInvalid(c, i, k) { const el = $('main').querySelector(`textarea[data-sbind="${k}"][data-c="${c}"][data-i="${i}"]`); if (el) el.classList.add('invalid'); }

/* Flatten an economy into path -> value, used for diffing */
function flatten(eco) {
  const m = {};
  for (const d of eco.drivers) d.subsections.forEach((s, sn) => {
    m[`drivers/${d.id}/${s.id}/name`] = s.name;
    m[`drivers/${d.id}/${s.id}/order`] = sn + 1;
    s.issues.forEach((i, n) => { m[`drivers/${d.id}/${s.id}/${i.id}/title`] = i.title; m[`drivers/${d.id}/${s.id}/${i.id}/text`] = i.text; m[`drivers/${d.id}/${s.id}/${i.id}/order`] = n + 1; });
  });
  eco.scenarios.forEach((c, cn) => {
    m[`scenarios/${c.id}/name`] = c.name;
    m[`scenarios/${c.id}/order`] = cn + 1;
    c.issues.forEach((i, n) => { m[`scenarios/${c.id}/${i.id}/title`] = i.title; for (const k of SCENARIO_COLS) m[`scenarios/${c.id}/${i.id}/${k}`] = i[k]; m[`scenarios/${c.id}/${i.id}/order`] = n + 1; });
  });
  for (const [key, cells] of Object.entries(eco.implications || {})) for (const [f, v] of Object.entries(cells)) if (v) m[`implications/${key}/${f}`] = v;
  return m;
}
function diff(before, after) {
  const a = flatten(before), b = flatten(after), out = [];
  for (const k of new Set([...Object.keys(a), ...Object.keys(b)]).values()) {
    const ov = a[k] ?? null, nv = b[k] ?? null;
    if (JSON.stringify(ov) !== JSON.stringify(nv)) out.push({ path: k, old: ov, new: nv });
  }
  return out.sort((x, y) => x.path < y.path ? -1 : 1);
}
function tidy(D) {
  for (const d of D.drivers) for (const s of d.subsections) { s.name = s.name.trim(); for (const i of s.issues) { i.title = i.title.trim(); i.text = i.text.replace(/\s+$/g, ''); } }
  for (const c of D.scenarios) { c.name = c.name.trim(); for (const i of c.issues) { i.title = i.title.trim(); for (const k of SCENARIO_COLS) i[k] = i[k].replace(/\s+$/g, ''); } }
  const keys = new Set(rowKeys(D).map(r => r.key));
  for (const k of Object.keys(D.implications)) if (!keys.has(k)) delete D.implications[k];
}
async function saveDraft() {
  const id = S.current, D = S.draft;
  tidy(D);
  const problems = validate(D);
  if (problems.length) { dialog('Fix these before saving', '<ul>' + problems.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul>', [['Close']]); return; }
  const changes = diff(S.data[id], D);
  if (!changes.length) { toast('No changes to save'); await releaseLock(id); S.draft = null; render(); return; }

  // conflict check: re-read the file and compare version numbers
  if (Store.connected) {
    const onDisk = await Store.readText(`data/${id}.yaml`);
    if (onDisk && onDisk !== S.loadedText[id]) {
      let v = null; try { v = YAML.parse(onDisk); } catch (e) { /* ignore */ }
      if (!v || Number(v.version) !== S.data[id].version) {
        dialog('Someone saved this economy while you were editing', `<p>The file on disk is now v${esc(v && v.version)} (saved ${esc(fmtTime(v && v.updated_at))} by ${esc(v && v.updated_by)}), but you started from v${S.data[id].version}. Your changes were not written.</p><p>Copy anything you need out of the page, then click <strong>Reload</strong> and re-apply your edits.</p>`, [['Close']]);
        return;
      }
    }
  }
  const prev = S.data[id];
  D.version = (prev.version || 0) + 1;
  D.updated_at = nowIso();
  D.updated_by = S.author || 'unknown';
  const header = `# Country Investment Thesis — ${D.name}\n# Written by country-investment-thesis.html. Edit through the page so changes are logged.\n\n`;
  const dataText = header + YAML.dump({ id: D.id, name: D.name, version: D.version, updated_at: D.updated_at, updated_by: D.updated_by, drivers: D.drivers, scenarios: D.scenarios, implications: D.implications });
  const entry = { at: D.updated_at, by: D.updated_by, economy: id, version: D.version, from_version: prev.version || 0, change_count: changes.length, changes };
  const logText = '---\n' + YAML.dump(entry);

  try {
    if (Store.connected) {
      await Store.writeText(`data/${id}.yaml`, dataText);
      await Store.appendText(`log/${id}.log.yaml`, logText);
    } else if (S.demo) {
      toast('Saved to this preview only — no folder is connected');
    } else {
      download(`${id}.yaml`, dataText);
      download(`${id}.log-entry-v${D.version}.yaml`, logText);
      toast('Downloaded the updated YAML and a log entry; copy them into data/ and log/');
    }
  } catch (e) { dialog('Save failed', '<p>' + esc(e.message || e) + '</p><p>Your edits are still on the page. Check the folder connection and try again.</p>', [['Close']]); return; }

  await releaseLock(id);
  S.data[id] = D; S.loadedText[id] = dataText; S.draft = null;
  render();
  toast(`Saved ${D.name} v${D.version} (${changes.length} change${changes.length === 1 ? '' : 's'})`);
}

boot();
</script>
