const REAL = {"id":"united-states","name":"United States","version":2,"updated_at":"2026-09-13T12:00:00+08:00","updated_by":"draft","drivers":[{"id":"regime","name":"Regime","subsections":[{"id":"trend-growth","name":"Trend growth","issues":[{"id":"iss-us-tg1","title":"AI capex is now the growth engine, and the concentration risk","text":"- Investment in data centres, power and chips is running at something like 2-2.5% of GDP and has carried GDP growth through the tariff and oil shocks; ex-AI, the economy is close to stall speed\n- Financing has migrated from hyperscaler cash flow to bonds and private credit, so a capex pause would hit both growth and credit markets at once\n- Working assumption: potential growth around 2% while the productivity dividend is still mostly promise; hours worked and non-residential investment are the tells","baseline":"- Data-centre and power investment keeps growing but decelerates; contributes 0.3-0.5pp to growth in 2027 with financing increasingly debt-funded","upside":"- Investment broadens into the grid, industrial automation and measured productivity; potential growth revised up toward 2.5%","downside":"- Returns disappoint and private-credit financing tightens; orders are cut, investment subtracts from growth and the credit channel amplifies it"},{"id":"iss-us-tg2","title":"Labour supply is the binding constraint","text":"- Immigration enforcement has cut labour-force growth to a trickle; payrolls in the 50-150k range are now consistent with a flat unemployment rate (4.1% in August)\n- A low-churn market: few layoffs, few hires, long-term unemployment share at a five-year high, wage growth down to about 3% and below headline inflation for four months running\n- Implication: break-even payroll growth is much lower than markets are used to, and a downturn would show up in hours and participation before it shows in the unemployment rate"}]},{"id":"trend-inflation","name":"Trend inflation","issues":[{"id":"iss-us-ti1","title":"Oil shock on top of tariff pass-through","text":"- Headline CPI is stuck at 3.4% with gasoline at record nominal highs after the Hormuz closure; core has cooled to the low 2s as goods pass-through from 2025 tariffs fades and shelter decelerates\n- The risk is second-round effects: short-horizon inflation expectations are elevated and real wages are falling, which is the classic set-up for wage catch-up demands in 2027\n- We assume trend inflation settles near 2.5-3% rather than 2%, with the energy path the swing factor","baseline":"- Headline CPI drifts from 3.4% toward 2.8% by mid-2027 as the energy contribution fades; core stays 2.3-2.6%","upside":"- Energy normalises quickly and shelter disinflation brings headline to 2.3% by end-2027; expectations re-anchor","downside":"- Second-round effects from energy and a weaker dollar push core back above 3%; short-horizon expectations unanchor and the Fed is forced into a real tightening cycle"}]}]},{"id":"policy","name":"Policy","subsections":[{"id":"monetary","name":"Monetary","issues":[{"id":"iss-us-mo1","title":"Warsh Fed facing a hike into a slowing economy","text":"- Funds rate at 3.50-3.75% after the July 9-3 hold; three dissents for a hike, and markets price roughly two-thirds odds of a 25bp increase on 16 September\n- The committee is split between looking through a supply shock and defending credibility after leaving rates unchanged into rising headline inflation; Hammack and others have floated multiple hikes\n- Watch: the September dots, whether Warsh frames any hike as insurance or the start of a cycle, and the balance-sheet language (reserve-management purchases have been keeping front-end funding calm)","baseline":"- One or two insurance hikes to 4.00%, then an extended hold while the committee watches the labour market; cuts return only in 2H27","upside":"- Energy relief lets the Fed stay on hold and resume cutting toward 3% in 2027; the curve bull-steepens in an orderly way","downside":"- Either a full hiking cycle toward 4.5-5% into a stagflationary economy, or a growth shock forcing rapid cuts below 2.5%; both damage risk assets and the credibility of the reaction function"},{"id":"iss-us-mo2","title":"Independence and the reaction function","text":"- The 2026 chair transition went through without the institutional rupture markets feared, but the administration's preference for lower rates is public and the committee's composition has shifted\n- Our read: the reaction function is more tolerant of inflation than in 2022 but not captured; the term premium is where markets express doubt, not the front end"}]},{"id":"fiscal","name":"Fiscal","issues":[{"id":"iss-us-fi1","title":"Deficit near 6-7% of GDP and losing its tariff crutch","text":"- The 2025 tax package locked in a structural deficit; the Supreme Court's February ruling voided IEEPA tariff revenue and triggered refunds, and the replacement 10-12.5% Section 301 tariffs on 60 economies raise less\n- Treasury keeps skewing issuance to bills to limit duration supply; that caps term premium today at the cost of rollover risk and growing dependence on money funds\n- Higher oil raises the deficit further via indexed programmes and lower real growth; no consolidation is plausible before the 2028 cycle","baseline":"- Deficit 6-7% of GDP, bills share stays high, no consolidation before 2028; term premium grinds higher","upside":"- Tariff revenue and stronger nominal growth stabilise the debt ratio; Treasury terms out issuance without a term-premium shock","downside":"- A cluster of weak auctions or a political challenge to Fed independence produces a term-premium spike and a disorderly bear-steepening"}]}]},{"id":"imbalances","name":"Imbalances","subsections":[{"id":"domestic","name":"Domestic","issues":[{"id":"iss-us-do1","title":"Two-speed households","text":"- Consumption is being carried by the top of the income distribution on equity wealth; lower-income cohorts are squeezed by $4-plus gasoline, tariff-driven goods prices and rising card delinquencies\n- The transmission channel that matters is asset prices: an equity correction would hit the only cohort still spending freely","baseline":"- Real consumption slows to 1-1.5% as real incomes stagnate; wealth effects and fiscal support prevent a contraction","upside":"- Hormuz reopens durably, gasoline falls back below $3.50 and real wages turn positive; consumption re-accelerates above 2%","downside":"- Oil stays above $100 into 2027 and equities correct 15-20%; high-income spending stops and unemployment rises past 5%"},{"id":"iss-us-do2","title":"Corporate margins under a cost squeeze","text":"- Tariffs, energy and a tight labour market are compressing margins outside the AI complex; an earnings recession is already visible in consumer discretionary and industrials"}]},{"id":"external","name":"External","issues":[{"id":"iss-us-ex1","title":"Dollar has lost its reflexive safe-haven bid","text":"- The dollar did not rally on the Iran war the way it did in 2022; foreign official demand for Treasuries is slower and more price sensitive, and the euro and yen have both strengthened on repatriation flows\n- The current account is narrowing as tariffs compress imports, but the financing question (who absorbs record Treasury supply at a lower dollar) is the live one"}]},{"id":"credit","name":"Credit","issues":[{"id":"iss-us-cr1","title":"Private credit is the AI financing plumbing","text":"- Private credit has absorbed the leveraged-loan market and now a large share of data-centre and power project finance; opacity, not aggregate size, is the concern\n- Stress would surface first in redemption gates and mark-downs at private funds, then in bank lines to those funds; the sector has not been tested by a capex downturn"}]}]},{"id":"geopolitics","name":"Geopolitics","subsections":[{"id":"domestic","name":"Domestic","issues":[{"id":"iss-us-gd1","title":"Midterms and the policy volatility premium","text":"- November midterms are being fought on the cost of living; a Democratic House would end the legislative agenda and raise the odds of investigations, but tariff and regulatory policy would still move by executive action\n- Congress is also stirring on trade powers (bills to restrain 122, 232 and 301 authority); a real transfer of authority back to Congress would be a structural change in policy risk"}]},{"id":"international","name":"International","issues":[{"id":"iss-us-gi1","title":"Iran war, Hormuz and the energy price regime","text":"- The Strait has been effectively contested since late February; a June US-Iran MOU reopened it partially, fighting resumed in September and Brent is back near $100 with Iran-Gulf talks pending in Oman\n- EIA does not expect Gulf output to normalise before 2027; the US is the relative winner as an energy exporter, but the consumer and the Fed pay first"},{"id":"iss-us-gi2","title":"Tariff regime is fragmenting into 232 and 301 tools","text":"- After IEEPA and Section 122 fell, the administration rebuilt the tariff wall with sectoral 232 actions (metals, 100% on patented pharma, autos, chips) and country 301 actions; the EU has a negotiated 15% ceiling, USMCA goods are exempt, China sits under the Busan and Beijing truce\n- The marginal news is now about excess-capacity investigations and exemptions rather than headline rates; effective tariff rate around 11%, the highest since the 1940s"}]}]}],"implications":{"drivers/regime/trend-growth":{"sales_growth":"up","margin_growth":"up","valuation":"down","liquidity":"down"},"drivers/regime/trend-inflation":{"margin_growth":"down","inflation_expectation":"up","cash_rate":"up"},"drivers/policy/monetary":{"valuation":"down","cash_rate":"up","term_premium":"up","liquidity":"down"},"drivers/policy/fiscal":{"sales_growth":"up","term_premium":"up","liquidity":"down"},"drivers/imbalances/domestic":{"sales_growth":"down","margin_growth":"down","dividend_yield":"up"},"drivers/imbalances/external":{"term_premium":"up","valuation":"down","i ation":"down","inflation_expectation":"up"},"drivers/imbalances/credit":{"liquidity":"down","valuation":"down"},"drivers/geopolitics/domestic":{"valuation":"down","term_premium":"up"},"drivers/geopolitics/international":{"margin_growth":"down","inflation_expectation":"up","cash_rate":"up"}}},"china":{"id":"china","name":"China","version":2,"updated_at":"2026-09-13T12:00:00+08:00","updated_by":"draft","drivers":[{"id":"regime","name":"Regime","subsections":[{"id":"trend-growth","name":"Trend growth","issues":[{"id":"iss-cn-tg1","title":"Growth without domestic demand","text":"- Headline growth is holding in the 4.5-5% range the 15th Five-Year Plan implies, but the composition is exports and state-directed manufacturing; private investment and property have been contracting since mid-2025\n- The property adjustment is still running: existing-home prices down more than 20% from the 2021 peak, starts down about 70%, and rating agencies still expect further declines in 2026\n- Our working assumption is trend growth drifting toward 4% by 2028, with the export surplus (above $1tn in 2025) the main support and the main source of friction"},{"id":"iss-cn-tg2","title":"The productivity bet on AI and advanced manufacturing","text":"- The Plan targets core digital industries above 12% of GDP and R&D growth above 7% a year; DeepSeek-style capability gains and EV and battery dominance are real, and TFP is contributing more than demographics subtract\n- The failure mode is overcapacity: the anti-involution campaign against price wars has had limited traction, and margins in solar, EVs and steel remain compressed"}]},{"id":"trend-inflation","name":"Trend inflation","issues":[{"id":"iss-cn-ti1","title":"Ten quarters of near-zero inflation","text":"- CPI 0.8% in August with core at 1.0%; food prices falling for a fifth month and housing costs still negative; PPI has been in deflation for over three years\n- The oil shock is passing through to transport prices but not to core; China is exporting disinflation to the rest of the world through goods prices\n- Real rates remain too high for a deleveraging economy; this is the central policy failure and the reason nominal GDP growth lags real growth","baseline":"- CPI 0.5-1% and PPI slightly negative through 2027; nominal growth stays below real growth","upside":"- Anti-involution enforcement and demand support lift core inflation above 1.5%; PPI turns positive and corporate profits recover","downside":"- Renewed property deflation and yuan strength push CPI below zero; debt-deflation dynamics and a Japan-1990s narrative take hold"}]}]},{"id":"policy","name":"Policy","subsections":[{"id":"monetary","name":"Monetary","issues":[{"id":"iss-cn-mo1","title":"PBOC easing in small steps, preserving ammunition","text":"- One-year LPR at 3.0% after the April cut; the central bank has preferred RRR cuts, structural lending facilities and bond purchases to headline rate moves, and has been protective of bank margins and the currency\n- With US-China relations in a truce and the Iran war raising import costs, the PBOC is holding firepower; expect 10-20bp of further cuts only if activity weakens visibly in Q4\n- Watch: the 7-day reverse repo, net bond purchases, and any shift to explicit inflation-targeting language","baseline":"- LPR cut to 2.8% by mid-2027, more RRR cuts and bond purchases; fiscal stays supply-side with incremental consumer measures","upside":"- Beijing shifts to large direct household transfers and a housing inventory backstop after the 2027 Congress; the yuan strengthens on confidence","downside":"- Policy stays reactive; capital outflow pressure forces a managed depreciation and tighter controls"}]},{"id":"fiscal","name":"Fiscal","issues":[{"id":"iss-cn-fi1","title":"Fiscal is doing the work, but on the supply side","text":"- Augmented deficit near 8-9% of GDP; the local-government debt swap has removed near-term refinancing risk but not the incentive problem\n- Consumer trade-in subsidies, childcare allowances and the consumption emphasis in the Plan are real but small relative to the household balance-sheet hit from property; policymakers are still reluctant to run demand-side transfers at scale\n- Watch: the Q4 Politburo and the December Central Economic Work Conference for any move toward direct household support ahead of the 2027 Party Congress"}]}]},{"id":"imbalances","name":"Imbalances","subsections":[{"id":"domestic","name":"Domestic","issues":[{"id":"iss-cn-do1","title":"Household balance sheets and the consumption gap","text":"- Property is 60-70% of household wealth and still falling; precautionary saving is elevated, youth unemployment near 17%, and consumption is running below income growth\n- Retail sales respond to subsidies then fade; the structural fix (social security, hukou, income redistribution) is acknowledged in the Plan but not funded","baseline":"- Prices keep falling at a slowing pace; starts flat at a low base; property subtracts 0.5-1pp from growth through 2027 and growth lands near 4.3-4.5%","upside":"- Central-government inventory purchases and lower rates stabilise tier-1 and tier-2 prices by mid-2027; household confidence recovers and consumption growth exceeds 5%","downside":"- A second leg down in prices, developer defaults spread to the state-linked sector, and local-government finances force spending cuts; growth below 3.5%"}]},{"id":"external","name":"External","issues":[{"id":"iss-cn-ex1","title":"Record surplus, redirected away from the US","text":"- Exports to the US fell by double digits through 2025 while shipments to ASEAN, the EU and the Middle East surged; the surplus passed $1tn and is the source of a widening global backlash (EU, Brazil, India all adding measures)\n- The yuan has been managed firm to keep the trade truce and to lean against capital outflows; a weaker currency is the tail policy option","baseline":"- Export volumes keep growing mid-single digits with redirection to the Global South; the surplus stays near $1tn","upside":"- A durable US deal plus EU market access keeps export growth high while domestic demand policy finally scales; nominal GDP growth back above 6%","downside":"- Coordinated tariffs from the US, EU and major EMs cut export growth to zero; overcapacity turns into industrial bankruptcies and a localised financial event"},{"id":"iss-cn-ex2","title":"Energy import exposure","text":"- China is the largest importer through Hormuz; crude imports hit a decade low in June before recovering, and the shock has hit refining margins and the terms of trade\n- Strategic stockpiles and Russian supply have cushioned the blow, and the episode strengthens the case for the EV and renewables push"}]},{"id":"credit","name":"Credit","issues":[{"id":"iss-cn-cr1","title":"Credit demand is the problem, not supply","text":"- Credit growth is at multi-decade lows in real terms; households are repaying mortgages early and corporates are hoarding cash\n- Bank asset quality is deteriorating slowly in property and small-business lending; state recapitalisation of the large banks has pre-empted a capital problem, smaller regional banks remain the weak link"}]}]},{"id":"geopolitics","name":"Geopolitics","subsections":[{"id":"domestic","name":"Domestic","issues":[{"id":"iss-cn-gd1","title":"Run-up to the 21st Party Congress","text":"- Policy is being set with the 2027 Congress in view: stability, technological self-reliance and political control rank above consumption stimulus\n- Provincial competition and local protectionism are named in the Plan as problems; execution risk on unification of the domestic market is high"}]},{"id":"international","name":"International","issues":[{"id":"iss-cn-gi1","title":"The US truce and its edges","text":"- The Busan truce (October 2025) and Beijing summit (May 2026) have held: triple-digit tariffs were averted, China's rare-earth controls proved to be real leverage, and China now faces the same 12.5% Section 301 layer as other Asian exporters plus legacy 301 duties\n- The edges are being tested: the US excess-capacity investigation, chip export controls, and Taiwan; either side can re-escalate quickly and the truce expires unless renewed"},{"id":"iss-cn-gi2","title":"Trade backlash beyond the US","text":"- The EU, Brazil, India, Mexico and Turkey have all added tariffs or investigations on Chinese autos, steel and chemicals; the surplus redirection strategy is running into limits in 2026-27"}]}]}],"implications":{"drivers/regime/trend-growth":{"sales_growth":"down","margin_growth":"down","cash_rate":"down"},"drivers/regime/trend-inflation":{"margin_growth":"down","inflation_expectation":"down","cash_rate":"down"},"drivers/policy/monetary":{"valuation":"up","cash_rate":"down","liquidity":"up"},"drivers/policy/fiscal":{"sales_growth":"up","term_premium":"up"},"drivers/imbalances/domestic":{"sales_growth":"down","valuation":"down"},"drivers/imbalances/external":{"margin_growth":"down","inflation_expectation":"down"},"drivers/imbalances/credit":{"liquidity":"down","cash_rate":"down"},"drivers/geopolitics/domestic":{"valuation":"down"},"drivers/geopolitics/international":{"sales_growth":"down","margin_growth":"down","valuation":"down"}}},"eurozone":{"id":"eurozone","name":"Eurozone","version":2,"updated_at":"2026-09-13T12:00:00+08:00","updated_by":"draft","drivers":[{"id":"regime","name":"Regime","subsections":[{"id":"trend-growth","name":"Trend growth","issues":[{"id":"iss-ez-tg1","title":"German fiscal impulse against an energy headwind","text":"- Potential growth is still around 1%, but the German infrastructure and defence programme (deficit near 4.75% of GDP, the largest stimulus since the 1970s) is the first sustained upward force in a decade and is finally showing up in orders and construction\n- Growth has surprised to the upside in 2026 (Q2 at 0.6% q/q, flattered by Ireland) and the ECB now projects 0.9% this year and 1.4% in 2027\n- The offset is energy: the Gulf war re-opened the competitiveness gap with the US just as it had started to close, and energy-intensive industry is shedding capacity again","baseline":"- Growth 1.0-1.4% in 2027 as German spending ramps and energy prices ease gradually; consumption recovers modestly","upside":"- Hormuz normalises, the saving rate falls and German capex crowds in private investment; growth near 2% in 2027","downside":"- Oil above $100 through 2027, French politics tighten financial conditions, Chinese competition intensifies; growth back toward 0.5%"},{"id":"iss-ez-tg2","title":"Productivity and the savings glut","text":"- Household saving rate remains several points above pre-2020 norms; the fiscal impulse is partly saved rather than spent, which caps the multiplier\n- Capital-market union and pension reform (the Dutch transition, EU savings and investment agenda) are slow-moving but matter for whether the region's surplus is recycled at home"}]},{"id":"trend-inflation","name":"Trend inflation","issues":[{"id":"iss-ez-ti1","title":"Energy has reopened the inflation gap","text":"- Headline inflation is 3.3% (August) with energy up 14% y/y; excluding energy it is 2.2%, which is the number that will decide the cycle\n- Staff projections put headline at 3.0% in 2026, 2.5% in 2027 and 2.1% in 2028; core is projected at 2.5-2.6% through 2027, so the ECB sees a longer road back to target than in March\n- Second-round risk is lower than in 2022 because wage growth has already decelerated and the euro is firm, but negotiated wages for 2027 are the key check","baseline":"- Headline averages 3.0% in 2026 and 2.5% in 2027; ex-energy inflation stays close to 2.2-2.5% and wage growth keeps decelerating","upside":"- Energy relief brings headline below 2% by late 2027; the firm euro and Chinese goods prices push core toward 1.8%","downside":"- Second-round effects in 2027 wage rounds keep core above 2.5%; the ECB has to hike beyond 3%"}]}]},{"id":"policy","name":"Policy","subsections":[{"id":"monetary","name":"Monetary","issues":[{"id":"iss-ez-mo1","title":"ECB has hiked twice and calls it a war-inflation response","text":"- Deposit rate 2.50% after 25bp hikes in June and on 10 September, described as unanimous; the Council is explicit that the moves are about the energy shock and are robust across scenarios, not a new cycle\n- Markets price more tightening than the ECB's own baseline needs; if energy falls, the front end has room to rally, which is the asymmetric trade\n- Watch: the October 29 meeting, negotiated wage data, and whether Lagarde starts to distinguish between headline and ex-energy inflation more forcefully","baseline":"- One more hike at most, then a hold through mid-2027; cuts resume once ex-energy inflation is clearly at 2%","upside":"- Energy relief lets the ECB stop at 2.50% and cut back toward 2% in 2027; Bund curve bull-steepens","downside":"- Deposit rate to 3.25% or higher; TPI activated if French spreads gap wider around the election"},{"id":"iss-ez-mo2","title":"Balance sheet and the fragmentation backstop","text":"- APP and PEPP run off passively; there is no Eurosystem bid for French paper, which is why the OAT spread now trades on fundamentals and politics\n- TPI has not been needed, but its credibility is what keeps a French episode from becoming a euro-area episode"}]},{"id":"fiscal","name":"Fiscal","issues":[{"id":"iss-ez-fi1","title":"Two-speed fiscal union","text":"- Germany is spending (record issuance above €500bn in 2026); France cannot consolidate (deficit 5.1%, debt 118% of GDP, another budget standoff over the 2027 finance law); Italy and Spain are the surprising fiscal good pupils\n- Defence at 3-3.5% of GDP is the new common denominator and is debt-financed nearly everywhere; the revised EU rules are being interpreted flexibly"}]}]},{"id":"imbalances","name":"Imbalances","subsections":[{"id":"domestic","name":"Domestic","issues":[{"id":"iss-ez-do1","title":"Precautionary saving and the labour market","text":"- Unemployment is near record lows and real incomes have been rising, yet consumption remains subdued; the energy shock has reset confidence just as it was recovering\n- Upside if the stock of savings is drawn down once energy prices settle; the German programme provides the confidence trigger"}]},{"id":"external","name":"External","issues":[{"id":"iss-ez-ex1","title":"Surplus recycling and the euro","text":"- Current account surplus near 3% of GDP and increasingly invested at home as US allocations are trimmed; the euro is firm around 1.16 despite the energy shock and has been a disinflationary force on goods\n- The EU-US deal's 15% ceiling has removed the tariff tail risk; the larger medium-term threat is Chinese competition in autos, machinery and chemicals"}]},{"id":"credit","name":"Credit","issues":[{"id":"iss-ez-cr1","title":"Banks are the transmission channel and are in good shape","text":"- Loan growth is modest but positive, banks are well capitalised and profitable on the steeper curve; higher policy rates pass through quickly to floating-rate mortgages in the south\n- Commercial real estate remains the main pocket of stress, concentrated in Germany; no systemic read-through"}]}]},{"id":"geopolitics","name":"Geopolitics","subsections":[{"id":"domestic","name":"Domestic","issues":[{"id":"iss-ez-gd1","title":"France is the euro area's sovereign risk","text":"- OAT-Bund spread near 85bp, 10-year OAT above 4.1% and the widest sustained premium since the euro crisis; the 2027 budget and the May 2027 presidential election are the catalysts, with Le Pen leading and markets doubting any candidate's appetite for consolidation\n- Contagion has been limited because Italian fundamentals have improved; the risk is a rating cross-over that forces index-driven selling","baseline":"- The 2027 budget passes with difficulty, deficit stays near 5%, spread 75-95bp; the presidential election dominates 1H27","upside":"- A working fiscal majority passes a credible budget; spread compresses toward 60bp","downside":"- Budget fails, rating cross-over to single-A, spread above 120bp and contagion to the periphery"}]},{"id":"international","name":"International","issues":[{"id":"iss-ez-gi1","title":"Energy dependence in a Gulf war","text":"- Europe is the region most exposed to Hormuz: LNG and crude import bills are up sharply, and the fiscal cost of new energy relief measures is being added to already-stretched budgets\n- Ukraine ceasefire scenarios still matter for gas prices and reconstruction demand; the defence build-up is now a permanent feature of the fiscal picture"}]}]}],"implications":{"drivers/regime/trend-growth":{"sales_growth":"up","cash_rate":"up","term_premium":"up"},"drivers/regime/trend-inflation":{"margin_growth":"down","inflation_expectation":"up","cash_rate":"up"},"drivers/policy/monetary":{"valuation":"down","cash_rate":"up","liquidity":"down"},"drivers/policy/fiscal":{"sales_growth":"up","term_premium":"up"},"drivers/imbalances/domestic":{"sales_growth":"down","dividend_yield":"up"},"drivers/imbalances/external":{"valuation":"up","term_premium":"down","inflation_expectation":"down"},"drivers/imbalances/credit":{"margin_growth":"up","liquidity":"up"},"drivers/geopolitics/domestic":{"term_premium":"up","valuation":"down"},"drivers/geopolitics/international":{"margin_growth":"down","sales_growth":"down","inflation_expectation":"up"}}},"japan":{"id":"japan","name":"Japan","version":2,"updated_at":"2026-09-13T12:00:00+08:00","updated_by":"draft","drivers":[{"id":"regime","name":"Regime","subsections":[{"id":"trend-growth","name":"Trend growth","issues":[{"id":"iss-jp-tg1","title":"Reflation is real but the growth rate is not","text":"- Potential growth is still near 0.5%; what has changed is nominal: wages, prices and corporate pricing power have all moved, and corporate profits have stayed high through the tariff and energy shocks\n- The Takaichi programme (economic security, defence above 2% of GDP, disaster resilience, a 17-field growth strategy) is a fiscal push rather than a supply-side reform; the multiplier is low in a full-employment economy\n- Labour scarcity is the binding constraint; capex in automation and software is the one genuinely structural upside"},{"id":"iss-jp-tg2","title":"Corporate governance and capital return","text":"- Cross-shareholding unwinds, buybacks and activist pressure keep ROE rising; this is the equity story regardless of macro and is now in its fourth year"}]},{"id":"trend-inflation","name":"Trend inflation","issues":[{"id":"iss-jp-ti1","title":"The wage-price mechanism has held, now stress-tested by oil","text":"- Shunto outcomes have delivered a third year of strong base-pay rises; services inflation and rent are finally moving, which is the domestic anchor the BOJ wanted\n- The Gulf war pushed headline inflation up through energy and food, exactly the import-driven inflation that squeezed real incomes in 2022-23; the yen's September rally is the offset\n- We assume underlying inflation settles around 2% with two-sided risk, which is a regime change from the 2010s","baseline":"- Core inflation settles near 2% through 2027; the 2027 shunto delivers base-pay growth of 3% or more","upside":"- Services inflation and rents keep rising; underlying inflation runs 2.5% and the BOJ's terminal rate estimate moves up","downside":"- Yen strength and an energy reversal drag headline below 1.5%; the wage-price mechanism stalls and the BOJ pauses indefinitely"}]}]},{"id":"policy","name":"Policy","subsections":[{"id":"monetary","name":"Monetary","issues":[{"id":"iss-jp-mo1","title":"BOJ normalisation is proceeding, with political friction","text":"- Policy rate raised to 1.00% in June and widely expected to reach 1.25% at the September meeting, a 30-year high; the stated logic is upside inflation risk from oil and the weak yen\n- The BOJ has said it will stop tapering JGB purchases from April 2027, holding monthly buying steady; the balance sheet is nonetheless down about 15% from its peak, the largest QT any G7 central bank has run\n- Takaichi has pressed Ueda to buy more bonds if long yields rise disorderly and has appointed reflationist board members; independence is intact but the terminal rate debate (1.5% or 2%?) is now political","baseline":"- Hikes to 1.25% in September and 1.50% by mid-2027, then a pause near the lower end of neutral estimates; JGB taper halted from April 2027","upside":"- Terminal rate revised to 2% with orderly curve; yen appreciates gradually and lifers return to super-longs","downside":"- A disorderly super-long sell-off forces the BOJ into yield-curve intervention under political pressure; credibility and the yen both suffer"}]},{"id":"fiscal","name":"Fiscal","issues":[{"id":"iss-jp-fi1","title":"Responsible and proactive, tested by the bond market","text":"- FY2026 budget a record ¥122tn with debt service up 11% on an assumed 3% rate; supplementary budgets and a possible food consumption-tax cut (up to ¥5tn of revenue) are the pressure points\n- Debt-to-GDP has been falling on nominal growth, which is the government's defence; the market's counter is the 30-year yield at record highs near 4% and a 10-year near 2.8-2.9%, the highest since 1996\n- Watch: issuance mix (shorter maturities to placate lifers), any move on the consumption tax, and the FY2027 budget request","baseline":"- Supplementary budgets continue, a partial food tax cut is enacted, 10-year yield 2.5-3%; debt ratio roughly stable on nominal growth","upside":"- Spending restraint and primary-balance progress; 30-year yields fall back below 3.5%","downside":"- Large consumption-tax cut plus defence overshoot; 30-year above 4.5%, rating pressure and a fiscal-dominance debate"}]}]},{"id":"imbalances","name":"Imbalances","subsections":[{"id":"domestic","name":"Domestic","issues":[{"id":"iss-jp-do1","title":"Real incomes and the household squeeze","text":"- Nominal wages are rising but real wages have oscillated around zero as food and energy inflation bit; consumption is soft and the political pressure for handouts and tax cuts comes from here\n- Household portfolio shift from deposits into equities (NISA) is a slow structural positive for domestic asset demand","baseline":"- Growth 0.7-1% in 2027 as real wages turn modestly positive and fiscal support flows; exports flat on tariffs and China weakness","upside":"- Energy normalises and a stronger yen restores real incomes; consumption and capex lift growth to 1.5%","downside":"- Oil stays above $100, the yen weakens again on fiscal concern and real incomes fall; growth near zero and a technical recession"}]},{"id":"external","name":"External","issues":[{"id":"iss-jp-ex1","title":"The yen and the great repatriation question","text":"- The yen traded near 155 for most of the year and then rallied sharply in September on carry-trade unwinds, expectations of capital repatriation and US political pressure for Japan to support the currency\n- Japan is the largest foreign holder of Treasuries and a large holder of European credit; higher domestic yields and a stronger yen are the mechanism through which Japanese capital comes home, with global term-premium consequences"},{"id":"iss-jp-ex2","title":"Energy dependence and the US trade deal","text":"- Almost entirely dependent on imported hydrocarbons, much of it through Hormuz; the terms-of-trade hit is the largest among G7 economies\n- The 2025 US deal (15% tariff, investment pledge) has held and Japan is inside the new 301 layer at the lower rate; auto exports to the US remain the exposed sector"}]},{"id":"credit","name":"Credit","issues":[{"id":"iss-jp-cr1","title":"Duration risk has moved from banks to lifers and the sovereign","text":"- Banks have shortened duration and benefit from higher rates; life insurers and pension funds carry the super-long risk and have been reducing demand, which is why the 30-year sector has repriced most\n- Regional banks with legacy JGB books are the weak link if yields overshoot"}]}]},{"id":"geopolitics","name":"Geopolitics","subsections":[{"id":"domestic","name":"Domestic","issues":[{"id":"iss-jp-gd1","title":"Takaichi has a mandate and a bond-market constraint","text":"- The decisive general election win in early 2026 removed coalition arithmetic as a constraint; the government can spend, and the market rather than the Diet is now the check\n- Populist tax relief (gasoline levies abolished, food VAT under discussion) is the path of least resistance ahead of the next upper-house cycle"}]},{"id":"international","name":"International","issues":[{"id":"iss-jp-gi1","title":"Security spending and the China relationship","text":"- Defence and economic-security spending are structural and bipartisan; relations with Beijing are tense after the Taiwan remarks episode and Chinese trade measures, so supply-chain diversification carries a fiscal cost\n- Alignment with the US on chips and export controls is complete; the exposure is to a US-China re-escalation that hits Japanese suppliers on both sides"}]}]}],"implications":{"drivers/regime/trend-growth":{"margin_growth":"up","dividend_yield":"up","cash_rate":"up"},"drivers/regime/trend-inflation":{"inflation_expectation":"up","cash_rate":"up","valuation":"down"},"drivers/policy/monetary":{"cash_rate":"up","term_premium":"up","valuation":"down","liquidity":"down"},"drivers/policy/fiscal":{"sales_growth":"up","term_premium":"up"},"drivers/imbalances/domestic":{"sales_growth":"down","valuation":"up"},"drivers/imbalances/external":{"margin_growth":"down","term_premium":"up"},"drivers/imbalances/credit":{"term_premium":"up","liquidity":"down"},"drivers/geopolitics/domestic":{"sales_growth":"up","term_premium":"up"},"drivers/geopolitics/international":{"margin_growth":"down","inflation_expectation":"up"}}},"united-kingdom":{"id":"united-kingdom","name":"United Kingdom","version":2,"updated_at":"2026-09-13T12:00:00+08:00","updated_by":"draft","drivers":[{"id":"regime","name":"Regime","subsections":[{"id":"trend-growth","name":"Trend growth","issues":[{"id":"iss-uk-tg1","title":"Stagnation with a loosening labour market","text":"- Growth has been near 1% for three years; unemployment has drifted up to 5.2% as employer payroll-tax rises and minimum-wage increases bit, and hiring has stalled\n- Productivity is flat and public investment plans are back-loaded; the planning and infrastructure reforms are the only credible supply-side lever and they pay off late in the decade\n- Our assumption: trend growth 1-1.25%, with the labour-market slack building faster than the Bank expected","baseline":"- Growth around 1% in 2027; unemployment peaks near 5.5%; real incomes flat as energy prices ease slowly","upside":"- Energy relief and lower gilt yields support housing and consumption; growth 1.5-2% and unemployment stabilises","downside":"- Energy shock persists, tax rises in the autumn budget and rising unemployment tip the economy into recession; unemployment above 6%"},{"id":"iss-uk-tg2","title":"Energy-price exposure is structural","text":"- The UK sets electricity prices off gas at the margin and is a net importer; the 2026 Gulf shock has flowed straight through Ofgem price caps into the CPI and into industrial costs\n- Two cap increases in 2026 (July and October) are why the Bank sees inflation peaking in Q4 rather than Q2"}]},{"id":"trend-inflation","name":"Trend inflation","issues":[{"id":"iss-uk-ti1","title":"Inflation was at target, then energy intervened","text":"- CPI 2.9% in July with core at 2.6% and services at 3.4%; before the war the Bank expected 2% from April, and now projects a peak around 3.2% in Q4 2026 with risks to the upside\n- Underlying disinflation has continued: pay growth is slowing with the loosening labour market, and food inflation is the lowest since 2021; the question is whether households' elevated short-term expectations feed 2027 pay rounds","baseline":"- CPI peaks near 3.2% in Q4 2026 and returns toward 2.5% by end-2027; services inflation keeps easing with the labour market","upside":"- Energy normalises and services inflation falls below 3%; CPI back at 2% by mid-2027","downside":"- Second Ofgem cap increase plus renewed wage push keep CPI above 3.5%; expectations de-anchor and the Bank has to hike twice or more"}]}]},{"id":"policy","name":"Policy","subsections":[{"id":"monetary","name":"Monetary","issues":[{"id":"iss-uk-mo1","title":"MPC split and leaning hawkish","text":"- Bank Rate 3.75% since December; the committee moved from a 5-4 vote with four wanting cuts in February to a 6-3 vote with three wanting hikes in July, purely on the energy shock\n- Markets price one or two hikes; the Bank's own framing is that policy cannot influence energy prices but must ensure the adjustment happens with inflation returning to target, which is a hold with a hiking bias\n- Watch: the September 17 decision and the QT annual decision on gilt sales, which has fiscal consequences","baseline":"- One insurance hike to 4% or an extended hold; cuts resume in 2H27 as slack builds","upside":"- No hikes, cuts to 3.25% by end-2027 as inflation falls back with energy; gilt curve rallies","downside":"- Two or three hikes into a weakening economy, then a sharp reversal; policy error debate and curve volatility"},{"id":"iss-uk-mo2","title":"QT and the gilt supply overhang","text":"- Active gilt sales plus record DMO issuance have kept long gilt yields among the highest in the G7; the Bank has been shifting sales toward shorter maturities to relieve the long end"}]},{"id":"fiscal","name":"Fiscal","issues":[{"id":"iss-uk-fi1","title":"No fiscal room, and a government tempted to spend","text":"- Headroom against the fiscal rules is thin; the 2025 budget raised taxes and the OBR pushed borrowing up; energy-support demands and a weak political position push the other way\n- The autumn 2026 budget is the test: further tax rises would hit growth, loosening would hit gilts; markets fear a leadership change toward a higher-spending chancellor more than they fear Reeves","baseline":"- Autumn budget balances modest tax rises and energy support; 10-year gilt 4.25-4.75%; headroom stays thin","upside":"- Credible medium-term consolidation and lower issuance; 10-year gilt back below 4%","downside":"- Leadership change or a loosened fiscal rule; 10-year above 5%, sterling under pressure and an LDI-style liquidity episode"}]}]},{"id":"imbalances","name":"Imbalances","subsections":[{"id":"domestic","name":"Domestic","issues":[{"id":"iss-uk-do1","title":"High saving rate and a housing market on the turn","text":"- Household saving rate is elevated and consumer confidence weak; the mortgage refinancing wave has largely passed, but a housing market that had started recovering is now facing higher gilt-driven mortgage rates again"}]},{"id":"external","name":"External","issues":[{"id":"iss-uk-ex1","title":"Current-account deficit financed by kindness of strangers","text":"- The UK runs a persistent deficit near 3% of GDP and depends on portfolio inflows; sterling has been stable but gilts are the pressure valve whenever politics or fiscal credibility wobbles\n- Trade: the US deal (10% baseline, 25% on steel rather than 50%) has held; the EU reset is incremental"}]},{"id":"credit","name":"Credit","issues":[{"id":"iss-uk-cr1","title":"Banks strong, non-bank leverage the watch item","text":"- Banks are well capitalised and profitable; the 2022 LDI episode and the pension-fund shift out of gilts remain the template for how a gilt sell-off transmits, and the Bank now has a standing repo facility for that purpose"}]}]},{"id":"geopolitics","name":"Geopolitics","subsections":[{"id":"domestic","name":"Domestic","issues":[{"id":"iss-uk-gd1","title":"A weak government and a populist opposition","text":"- Starmer's authority has been eroded by the Mandelson affair, by-election losses to Greens and Reform, and internal calls to step down; Reform UK leads polls with a platform that markets read as fiscally expansionary\n- The next general election is not due until 2029, but a leadership change or a shift to spending-led politics is the gilt market's main political risk"}]},{"id":"international","name":"International","issues":[{"id":"iss-uk-gi1","title":"Energy security and defence","text":"- North Sea decline, LNG dependence and the Gulf war have put energy security back at the centre of policy; defence spending toward 3% of GDP is another claim on a budget with no room\n- Closer EU alignment on defence and energy is the direction of travel, but slower than the market would like"}]}]}],"implications":{"drivers/regime/trend-growth":{"sales_growth":"down","cash_rate":"down"},"drivers/regime/trend-inflation":{"inflation_expectation":"up","cash_rate":"up","margin_growth":"down"},"drivers/policy/monetary":{"cash_rate":"up","valuation":"down"},"drivers/policy/fiscal":{"term_premium":"up","sales_growth":"down"},"drivers/imbalances/domestic":{"sales_growth":"down","dividend_yield":"up"},"drivers/imbalances/external":{"term_premium":"up","valuation":"down"},"drivers/imbalances/credit":{"liquidity":"down"},"drivers/geopolitics/domestic":{"term_premium":"up","valuation":"down"},"drivers/geopolitics/international":{"margin_growth":"down","inflation_expectation":"up"}}},"india":{"id":"india","name":"India","version":2,"updated_at":"2026-09-13T12:00:00+08:00","updated_by":"draft","drivers":[{"id":"regime","name":"Regime","subsections":[{"id":"trend-growth","name":"Trend growth","issues":[{"id":"iss-in-tg1","title":"The fastest large economy, now stress-tested by oil","text":"- Growth ran near 7-8% through FY26 on public capex, the GST rate cut and a consumption rebound; the RBI has FY27 at 6.7% and Q1 manufacturing and discretionary spending were strong\n- India is the large economy most exposed to Hormuz after Japan: Gulf crude, LNG, and remittances and diaspora employment in the GCC; the shock arrived just as the private capex cycle was turning up\n- Our assumption: trend growth 6.5% with two-sided risk; the productivity story (digital public infrastructure, formalisation, manufacturing incentives) is intact but the external account is the constraint again","baseline":"- FY27 growth 6.5% as public capex and the consumption tax cut offset the energy drag; private capex continues at a moderate pace","upside":"- Hormuz normalises, oil back below $75; consumption and private capex lift growth above 7% with the current account back near 1% of GDP","downside":"- Oil above $100 through 2027; current-account deficit above 2.5%, rupee overshoots, RBI forced to hike and growth falls below 5.5%"},{"id":"iss-in-tg2","title":"Private capex and the manufacturing push","text":"- Corporate balance sheets are clean and capacity utilisation high; the interim US trade agreement (in force since February) has reopened the export channel after the punitive 2025 tariffs\n- Electronics assembly and pharma are scaling; the constraint is land, logistics and state-level execution rather than demand"}]},{"id":"trend-inflation","name":"Trend inflation","issues":[{"id":"iss-in-ti1","title":"From record-low inflation to an energy shock","text":"- Headline inflation fell to 1-2% in late 2025 on food; the RBI now projects 5.0% for FY27 with core near 4.3%, so the whole move is fuel and pass-through\n- Food remains the swing factor: monsoon outcomes and vegetable prices dominate the headline, and the RBI is learning to look through them","baseline":"- Headline 4.5-5% in FY27, core 4-4.5%; food benign on a normal monsoon","upside":"- Energy relief and a strong monsoon bring headline back to 3.5-4%; the RBI can resume cutting","downside":"- Fuel pass-through plus a weak monsoon push headline above 6% and core above 5%; expectations rise and the RBI hikes 50-75bp"}]}]},{"id":"policy","name":"Policy","subsections":[{"id":"monetary","name":"Monetary","issues":[{"id":"iss-in-mo1","title":"RBI on hold at 5.25%, defending the rupee with the wider toolkit","text":"- After 125bp of cuts in 2025 the RBI has held at 5.25% with a neutral stance through 2026; the August vote was unanimous and Governor Malhotra wants a clearer inflation signal before moving either way\n- The rupee has weakened beyond 95 per dollar and the RBI has chosen FX swaps, reserve sales and liquidity tools over a defensive hike; that is the right call as long as inflation expectations hold\n- Watch: core inflation above 4.5%, further rupee depreciation, and the liquidity stance (OMOs and swaps) which is doing more work than the policy rate","baseline":"- On hold through FY27 with liquidity and FX tools doing the work; rupee drifts to 96-98","upside":"- Two cuts to 4.75% in 2027 as inflation returns to 4% and the current account narrows; rupee stabilises below 95","downside":"- Defensive hikes to 6% to stop a rupee run; growth and credit slow sharply"}]},{"id":"fiscal","name":"Fiscal","issues":[{"id":"iss-in-fi1","title":"Consolidation on a debt anchor, with an oil bill","text":"- The centre has shifted from a deficit target to a debt-to-GDP anchor; FY27 budget keeps capex high and the deficit near 4.3-4.5% of GDP\n- Fuel subsidies and excise cuts to cushion the oil shock are the fiscal risk; states are the softer link on revenue and welfare spending"}]}]},{"id":"imbalances","name":"Imbalances","subsections":[{"id":"domestic","name":"Domestic","issues":[{"id":"iss-in-do1","title":"Household credit and the K-shaped consumer","text":"- Urban middle-class consumption is running on credit (unsecured personal loans, cards) while rural demand has recovered on good monsoons and food-price relief\n- The GST cut lifted mass consumption in 2H25; the oil shock is now eroding real incomes at the bottom"}]},{"id":"external","name":"External","issues":[{"id":"iss-in-ex1","title":"The current account is the pressure point again","text":"- Oil at $90-100 pushes the current-account deficit toward 1.5-2% of GDP; services exports and remittances remain strong but portfolio flows have been volatile and FDI net of repatriation is weak\n- const CRC_T = (() => { const t = new Uint32Array(256);

      const partial = h.byTag('issue|iss-us-mo1');
      h.empty(h.inside(partial, 'field|upside'));
      // (d) an issue whose whole box was deleted
      const gone = h.byTag('issue|iss-us-fi1'); gone.parentNode.removeChild(gone);
    });
    const rDel = reconcile(docxParse(deleted), cur);
    say('TEST 3  Q2 — deleting:');
    check('emptying every box retires the issue', rDel.retired.some(x => x.id === 'iss-us-ti1' && x.how === 'box emptied'));
    check('clearing only the three cells keeps the issue', rDel.signpostsCleared.some(x => x.id === withSp.id) && !rDel.retired.some(x => x.id === withSp.id));
    check('half-cleared signposts are caught before validate() can refuse the import', rDel.problems.some(p => p.id === 'iss-us-mo1' && /half filled/.test(p.why)), JSON.stringify(rDel.problems));
    check('a box deleted outright is flagged as possibly accidental', rDel.retired.some(x => x.id === 'iss-us-fi1' && /accidental/.test(x.how)));
    check('nothing else disturbed', rDel.added.length === 0);

    /* ---------- Q3 REORDER ---------- */
    const place = 'drivers/regime/trend-growth';
    const reordered = editXml(XML, (d, h) => {
      const a = h.byTag('issue|iss-us-tg1'), b = h.byTag('issue|iss-us-tg2');
      b.parentNode.insertBefore(b, a);
      const mv = h.byTag('issue|iss-us-ti1');
      h.byTag('sub|drivers/policy/monetary').getElementsByTagName('w:sdtContent')[0].appendChild(mv);
      const subs = [...d.getElementsByTagName('w:sdt')].filter(s => { const g = s.getElementsByTagName('w:tag')[0]; return g && /^sub\|drivers\/imbalances\//.test(g.getAttribute('w:val')); });
      subs[1].parentNode.insertBefore(subs[1], subs[0]);        // reorder subsection tabs
    });
    const pr = docxParse(reordered), rOrd = reconcile(pr, cur);
    say('TEST 4  Q3 — reprioritising:');
    check('swapped issues report an order change, ids intact', rOrd.reordered.length === 2 && rOrd.reordered.every(x => x.place === place));
    check('order comes from document position', (() => { const p = pr.places.find(x => x.key === place); return p.items[0].id === 'iss-us-tg2'; })());
    check('a reorder is not mistaken for an edit', !rOrd.edited.some(e => ['iss-us-tg1', 'iss-us-tg2'].includes(e.id)));
    check('issue dragged to another subsection is reported as moved', rOrd.moved.length === 1 && rOrd.moved[0].to === 'drivers/policy/monetary');
    check('subsection order read from the document', pr.places.findIndex(p => p.key === 'drivers/imbalances/external') < pr.places.findIndex(p => p.key === 'drivers/imbalances/domestic'));
    check('driver group order ignored (the page cannot reorder groups)', !JSON.stringify(rOrd).includes('"group"'));

    /* ---------- Tier B: the control itself destroyed ---------- */
    const mangled = editXml(XML, (d, h) => {
      // (a) inner field controls gone, text left behind (paste-over inside the box)
      const a1 = h.byTag('issue|iss-us-tg1');
      const inner = [...a1.getElementsByTagName('w:sdt')].filter(x => { const g = x.getElementsByTagName('w:tag')[0]; return g && /^field\|(title|text)$/.test(g.getAttribute('w:val')); });
      for (const f of inner) { const frag = d.createDocumentFragment();
        for (const p of [...f.getElementsByTagName('w:sdtContent')[0].childNodes]) frag.appendChild(p.cloneNode(true));
        f.parentNode.replaceChild(frag, f); }
      // (b) the whole issue box unwrapped: paragraphs remain, tag gone
      const a2 = h.byTag('issue|iss-us-tg2');
      const frag2 = d.createDocumentFragment();
      for (const n of [...a2.getElementsByTagName('w:sdtContent')[0].childNodes]) {
        if (n.localName === 'sdt') { for (const p of [...n.getElementsByTagName('w:sdtContent')[0].childNodes]) frag2.appendChild(p.cloneNode(true)); }
        else frag2.appendChild(n.cloneNode(true));
      }
      a2.parentNode.replaceChild(frag2, a2);
    });
    const pm = docxParse(mangled), rM = reconcile(pm, cur);
    say('TEST 5  Tier B — content controls destroyed:');
    check('parser did not crash', true);
    check('box intact but inner controls gone: still read by style anchor', (() => { const i = pm.places.find(p => p.key === place).items.find(x => x.id === 'iss-us-tg1'); return i && /AI capex/.test(i.title) && /data centres/.test(i.text); })());
    check('whole box unwrapped: recovered by title, id restored', rM.recovered.some(x => x.id === 'iss-us-tg2'));
    check('its text came with it', /low-churn/.test((rM.recovered.find(x => x.id === 'iss-us-tg2') || {}).item?.text || ''));
    check('nothing wrongly reported as retired', rM.retired.length === 0, JSON.stringify(rM.retired));
    check('nothing wrongly reported as added', rM.added.length === 0, JSON.stringify(rM.added.map(a => a.title)));

    /* ---------- a stale document: someone else added an issue meanwhile ---------- */
    const laterCur = currentOf(JSON.parse(JSON.stringify(eco)));
    laterCur.places.find(p => p.key === place).items.push({ id: 'iss-us-NEW', title: 'Tariff refunds are a 2027 fiscal cliff', text: '- Added by a colleague while the Word copy was out', baseline: '', upside: '', downside: '' });
    const rStale = reconcile(docxParse(XML), laterCur);
    say('TEST 6  a Word copy that went stale while it was out:');
    check('an issue added on disk since export is NOT retired', !rStale.retired.some(x => x.id === 'iss-us-NEW'));
    check('it is reported as left alone', rStale.untouched.some(x => x.id === 'iss-us-NEW'));
    check('a genuinely deleted box is still retired', (() => {
      const gone = editXml(XML, (d, h) => { const g = h.byTag('issue|iss-us-fi1'); g.parentNode.removeChild(g); });
      return reconcile(docxParse(gone), laterCur).retired.some(x => x.id === 'iss-us-fi1'); })());
    check('manifest read back', docxParse(XML).manifest && docxParse(XML).manifest.includes('iss-us-tg1'));

    /* ---------- editing + tracked changes ---------- */
    const ed = editXml(XML, (d, h) => {
      const box = h.byTag('issue|iss-us-tg2');
      h.setText(box, 'Immigration enforcement has cut labour-force growth to a trickle; payrolls in the 50-150k range are now consistent with a flat unemployment rate (4.1% in August)', 'Immigration enforcement has cut labour-force growth to ZERO');
      const t = [...box.getElementsByTagName('w:t')].find(x => /low-churn/.test(x.textContent));
      const p = t.parentNode.parentNode;
      const mk = (kind, tn, text) => { const e = d.createElementNS(WNS, 'w:' + kind); e.setAttribute('w:id', '900'); e.setAttribute('w:author', 'AC'); e.setAttribute('w:date', '2026-09-15T09:00:00Z');
        const r = d.createElementNS(WNS, 'w:r'), tt = d.createElementNS(WNS, 'w:' + tn); tt.setAttribute('xml:space', 'preserve'); tt.textContent = text; r.appendChild(tt); e.appendChild(r); return e; };
      p.appendChild(mk('ins', 't', ', and long-term unemployment is rising'));
      p.appendChild(mk('del', 'delText', ' DELETE ME'));
    });
    const rEd = reconcile(docxParse(ed), cur);
    say('TEST 7  ordinary editing:');
    check('edit reported on the right issue only', rEd.edited.length === 1 && rEd.edited[0].id === 'iss-us-tg2');
    check('tracked insertion accepted, deletion dropped', (() => { const i = docxParse(ed).places.flatMap(p => p.items).find(x => x.id === 'iss-us-tg2'); return /long-term unemployment is rising/.test(i.text) && !/DELETE ME/.test(i.text); })());

    let refused = 'accepted (BAD)';
    try { await docxRead(await zipWrite([{ name: 'word/other.xml', text: '<a/>' }])); } catch (e) { refused = 'refused — ' + e.message; }
    say('TEST 8  a file that is not a thesis document: ' + refused);
  } catch (e) { say('ERROR ' + (e && e.stack || e)); }
  const txt = log.join('\n');
  const out = document.getElementById('out');
  out.innerHTML = txt.replace(/\bPASS\b/g, '<span class="PASS">PASS</span>').replace(/\bFAIL\b/g, '<span class="FAIL">FAIL</span>');
  window.__RESULT = txt;
})();

</script></body></html>
